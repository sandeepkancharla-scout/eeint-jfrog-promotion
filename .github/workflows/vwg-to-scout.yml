name: VWG to Scout Clone

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "VWG JFrog artifact URL"
        required: true
        type: string

      build_type:
        description: "Select build type"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - official

      release_folder:
        description: "Release/CW number - required only for Official"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vwg-to-scout-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer VWG Artifact to Scout Clone

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 60

    env:
      FILE_URL: ${{ inputs.file_url }}
      BUILD_TYPE: ${{ inputs.build_type }}
      RELEASE_FOLDER: ${{ inputs.release_folder }}

      VWG_URL: ${{ secrets.VWG_JFROG_URL }}
      VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Set temporary directory
        shell: cmd
        run: |
          @echo off

          echo STAGING_DIR=%RUNNER_TEMP%\vwg-scout-${{ github.run_id }}>>"%GITHUB_ENV%"

          echo Temporary directory:
          echo %RUNNER_TEMP%\vwg-scout-${{ github.run_id }}

      - name: Validate inputs and secrets
        shell: cmd
        run: |
          @echo off

          if "%FILE_URL%"=="" (
            echo ERROR: VWG artifact URL is required.
            exit /b 1
          )

          if "%VWG_URL%"=="" (
            echo ERROR: VWG_JFROG_URL is missing.
            exit /b 1
          )

          if "%VWG_TOKEN%"=="" (
            echo ERROR: VWG_JFROG_ACCESS_TOKEN is missing.
            exit /b 1
          )

          if "%SCOUT_URL%"=="" (
            echo ERROR: SCOUT_JFROG_URL is missing.
            exit /b 1
          )

          if "%SCOUT_TOKEN%"=="" (
            echo ERROR: SCOUT_JFROG_ACCESS_TOKEN is missing.
            exit /b 1
          )

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing.
            exit /b 1
          )

          if /I not "%BUILD_TYPE%"=="nightly" (
            if /I not "%BUILD_TYPE%"=="official" (
              echo ERROR: Build type must be nightly or official.
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="official" (
            if "%RELEASE_FOLDER%"=="" (
              echo ERROR: Release/CW number is required for Official.
              exit /b 1
            )
          )

          echo ========================================
          echo INPUT VALIDATION SUCCESSFUL
          echo ========================================
          echo Build Type: %BUILD_TYPE%

          if /I "%BUILD_TYPE%"=="official" (
            echo Release/CW: %RELEASE_FOLDER%
          ) else (
            echo Release/CW: Not required
          )

      - name: Parse VWG URL
        id: parse
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "FULL_URL=%FILE_URL%"
          set "RELATIVE=!FULL_URL:%VWG_URL%/artifactory/=!"

          if "!RELATIVE!"=="!FULL_URL!" (
            echo ERROR: Invalid VWG JFrog URL.
            echo.
            echo Expected format:
            echo %VWG_URL%/artifactory/REPOSITORY/PATH/FILE
            exit /b 1
          )

          for /f "tokens=1,* delims=/" %%A in ("!RELATIVE!") do (
            set "SOURCE_REPO=%%A"
            set "SOURCE_PATH=%%B"
          )

          if "!SOURCE_REPO!"=="" (
            echo ERROR: Could not determine VWG repository.
            exit /b 1
          )

          if "!SOURCE_PATH!"=="" (
            echo ERROR: Could not determine VWG artifact path.
            exit /b 1
          )

          echo ========================================
          echo VWG SOURCE
          echo ========================================
          echo Repository:
          echo !SOURCE_REPO!
          echo.
          echo Path:
          echo !SOURCE_PATH!

          echo source_repo=!SOURCE_REPO!>>"%GITHUB_OUTPUT%"
          echo source_path=!SOURCE_PATH!>>"%GITHUB_OUTPUT%"

          endlocal

      - name: Configure VWG JFrog
        shell: cmd
        run: |
          @echo off

          jf c remove vwg-source --quiet >nul 2>&1

          jf c add vwg-source ^
            --url="%VWG_URL%" ^
            --access-token="%VWG_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure VWG JFrog.
            exit /b 1
          )

          jf rt ping --server-id=vwg-source

          if errorlevel 1 (
            echo ERROR: Cannot connect to VWG JFrog.
            exit /b 1
          )

          echo VWG JFrog connection successful.

      - name: Configure Scout JFrog
        shell: cmd
        run: |
          @echo off

          jf c remove scout-target --quiet >nul 2>&1

          jf c add scout-target ^
            --url="%SCOUT_URL%" ^
            --access-token="%SCOUT_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure Scout JFrog.
            exit /b 1
          )

          jf rt ping --server-id=scout-target

          if errorlevel 1 (
            echo ERROR: Cannot connect to Scout JFrog.
            exit /b 1
          )

          echo Scout JFrog connection successful.

      - name: Prepare local temporary directory
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          mkdir "%STAGING_DIR%"

          if errorlevel 1 (
            echo ERROR: Could not create temporary directory.
            exit /b 1
          )

          echo Temporary directory:
          echo %STAGING_DIR%

      - name: Verify VWG artifact
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          echo Checking VWG artifact:
          echo %SOURCE_REPO%/%SOURCE_PATH%

          jf rt search ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --server-id=vwg-source ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Artifact was not found in VWG.
            exit /b 1
          )

          echo VWG artifact found.

      - name: Download VWG artifact
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          echo ========================================
          echo DOWNLOAD FROM VWG
          echo ========================================

          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%

          echo Local temporary directory:
          echo %STAGING_DIR%

          jf rt download ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%STAGING_DIR%/" ^
            --server-id=vwg-source ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG download failed.
            exit /b 1
          )

          echo VWG download successful.

      - name: Calculate Scout Clone destination
        id: destination
        shell: cmd
        env:
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          if /I "%BUILD_TYPE%"=="nightly" (
            echo destination_path=Daily_Builds/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"
            echo promotion_path=Daily_Builds>>"%GITHUB_OUTPUT%"
            echo approval_build_type=daily>>"%GITHUB_OUTPUT%"

            echo ========================================
            echo NIGHTLY
            echo ========================================
            echo Artifact destination:
            echo %CLONE_REPO%/Daily_Builds/%SOURCE_PATH%
            echo.
            echo Root folder requiring approval:
            echo Daily_Builds

            exit /b 0
          )

          if /I "%BUILD_TYPE%"=="official" (
            echo destination_path=Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"
            echo promotion_path=Official_Release/%RELEASE_FOLDER%>>"%GITHUB_OUTPUT%"
            echo approval_build_type=official>>"%GITHUB_OUTPUT%"

            echo ========================================
            echo OFFICIAL
            echo ========================================
            echo Artifact destination:
            echo %CLONE_REPO%/Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%
            echo.
            echo Root folder requiring approval:
            echo Official_Release/%RELEASE_FOLDER%

            exit /b 0
          )

          echo ERROR: Invalid build type.
          exit /b 1

      - name: Upload Nightly to Scout Clone
        if: ${{ inputs.build_type == 'nightly' }}
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo Uploading Nightly artifact:
          echo %CLONE_REPO%/%DESTINATION_PATH%

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly destination verification failed.
            exit /b 1
          )

          echo Nightly upload and verification successful.

      - name: Upload Official to Scout Clone
        if: ${{ inputs.build_type == 'official' }}
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo Uploading Official artifact:
          echo %CLONE_REPO%/%DESTINATION_PATH%

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official destination verification failed.
            exit /b 1
          )

          echo Official upload and verification successful.

      - name: Request one FVP root-folder approval
        if: ${{ success() }}
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
          PROMOTION_PATH: ${{ steps.destination.outputs.promotion_path }}
          APPROVAL_BUILD_TYPE: ${{ steps.destination.outputs.approval_build_type }}
        run: |
          @echo off

          echo ========================================
          echo REQUEST FVP APPROVAL
          echo ========================================
          echo Build Type:
          echo %APPROVAL_BUILD_TYPE%
          echo.
          echo Root Folder:
          echo %PROMOTION_PATH%
          echo.

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"fvp_root_folder_approval\",\"repo_key\":\"%CLONE_REPO%\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"promotion_path\":\"%PROMOTION_PATH%\",\"path\":\"%PROMOTION_PATH%\",\"build_type\":\"%APPROVAL_BUILD_TYPE%\",\"requested_by\":\"${{ github.actor }}\",\"github_run_id\":\"${{ github.run_id }}\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: FVP approval request failed.
            exit /b 1
          )

          echo.
          echo One FVP root-folder approval request submitted successfully.

      - name: Cleanup local temporary files
        if: ${{ always() }}
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo CLEANUP
          echo ========================================

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          jf c remove vwg-source --quiet >nul 2>&1
          jf c remove scout-target --quiet >nul 2>&1

          echo Local temporary files deleted.
          echo Temporary JFrog configurations removed.
