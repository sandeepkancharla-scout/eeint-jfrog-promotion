name: VWG to Scout Clone

run-name: "VWG to Scout | ${{ inputs.folder_name }}"

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Full VWG JFrog source folder URL"
        required: true
        type: string
      folder_name:
        description: "Folder name to create in Scout Clone"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vwg-to-scout-${{ inputs.folder_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy VWG Artifacts to Scout Clone
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 120

    env:
      VWG_SERVER_ID: vwg-source
      SCOUT_SERVER_ID: scout-target
      WORK_ROOT: C:\Temp\VWGScoutPromotion
      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      - name: Validate Configuration
        shell: pwsh
        env:
          VWG_URL: ${{ secrets.VWG_JFROG_URL }}
          VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}
          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}
          APPROVAL_WEBHOOK_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:VWG_URL) { throw 'VWG_JFROG_URL secret is missing.' }
          if (-not $env:VWG_TOKEN) { throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.' }
          if (-not $env:SCOUT_URL) { throw 'SCOUT_JFROG_URL secret is missing.' }
          if (-not $env:SCOUT_TOKEN) { throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.' }
          if (-not $env:CLONE_REPO) { throw 'SCOUT_CLONE_REPO secret is missing.' }
          if (-not $env:FVP_REPO) { throw 'SCOUT_FVP_REPO secret is missing.' }
          if (-not $env:APPROVAL_WEBHOOK_URL) { throw 'FVP_APPROVAL_WEBHOOK_URL secret is missing.' }

          Write-Host 'All required configuration is available.'

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          jf --version
          if ($LASTEXITCODE -ne 0) { throw 'JFrog CLI is unavailable.' }

      - name: Validate Inputs
        id: inputs
        shell: pwsh
        env:
          SOURCE_URL_INPUT: ${{ inputs.source_url }}
          FOLDER_NAME_INPUT: ${{ inputs.folder_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceUrl = $env:SOURCE_URL_INPUT.Trim()
          $folderName = $env:FOLDER_NAME_INPUT.Trim()

          if (-not $sourceUrl) { throw 'VWG source URL is empty.' }
          if (-not $folderName) { throw 'Scout folder name is empty.' }
          if ($folderName -notmatch '^[A-Za-z0-9._() -]+$') { throw 'Folder name contains unsupported characters.' }
          if ($folderName.Contains('..')) { throw 'Folder name cannot contain ..' }

          $folderName = $folderName.Trim('/').Trim('\\').Trim()
          if (-not $folderName) { throw 'Folder name is invalid.' }

          try { $sourceUri = [System.Uri]$sourceUrl }
          catch { throw 'VWG source URL is invalid.' }

          if ($sourceUri.Scheme -ne 'https') { throw 'VWG source URL must use HTTPS.' }

          "source_url=$sourceUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "folder_name=$folderName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cleanup Existing JFrog Configurations
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:VWG_SERVER_ID" --quiet
          jf c rm "$env:SCOUT_SERVER_ID" --quiet

      - name: Configure VWG JFrog
        shell: pwsh
        env:
          VWG_URL: ${{ secrets.VWG_JFROG_URL }}
          VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          jf c add "$env:VWG_SERVER_ID" --url="$env:VWG_URL" --access-token="$env:VWG_TOKEN" --interactive=false --overwrite=true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure VWG JFrog.' }

      - name: Verify VWG Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          jf rt ping --server-id="$env:VWG_SERVER_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to connect to VWG JFrog.' }

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          jf c add "$env:SCOUT_SERVER_ID" --url="$env:SCOUT_URL" --access-token="$env:SCOUT_TOKEN" --interactive=false --overwrite=true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure Scout JFrog.' }

      - name: Verify Scout Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          jf rt ping --server-id="$env:SCOUT_SERVER_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to connect to Scout JFrog.' }

      - name: Parse VWG Source URL
        id: source
        shell: pwsh
        env:
          SOURCE_URL_INPUT: ${{ steps.inputs.outputs.source_url }}
          CONFIGURED_VWG_URL: ${{ secrets.VWG_JFROG_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          try { $sourceUri = [System.Uri]$env:SOURCE_URL_INPUT }
          catch { throw 'Unable to parse VWG source URL.' }

          try { $configuredUri = [System.Uri]$env:CONFIGURED_VWG_URL }
          catch { throw 'Configured VWG JFrog URL is invalid.' }

          if ($sourceUri.Host -ne $configuredUri.Host) { throw 'Source URL does not belong to configured VWG JFrog.' }

          $marker = '/artifactory/'
          $position = $sourceUri.AbsolutePath.IndexOf($marker, [System.StringComparison]::OrdinalIgnoreCase)
          if ($position -lt 0) { throw 'VWG source URL must contain /artifactory/.' }

          $artifactPath = $sourceUri.AbsolutePath.Substring($position + $marker.Length)
          $artifactPath = [System.Uri]::UnescapeDataString($artifactPath)
          $artifactPath = $artifactPath.Replace('\\', '/').Trim('/')

          if (-not $artifactPath) { throw 'Unable to determine VWG Artifactory path.' }
          if ($artifactPath.Contains('..')) { throw 'VWG artifact path cannot contain ..' }

          $sourcePattern = "$artifactPath/*"

          Write-Host "VWG artifact path: $artifactPath"
          Write-Host "VWG source pattern: $sourcePattern"

          "artifact_path=$artifactPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_pattern=$sourcePattern" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify VWG Source
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.source.outputs.source_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'
          jf rt search "$env:SOURCE_PATTERN" --server-id="$env:VWG_SERVER_ID" --recursive=true --include-dirs=false --fail-no-op=true
          if ($LASTEXITCODE -ne 0) { throw 'No matching VWG artifacts were found.' }

      - name: Prepare Local Staging
        id: staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stagingPath = Join-Path -Path $env:WORK_ROOT -ChildPath "RUN-${{ github.run_id }}"
          if (Test-Path -LiteralPath $stagingPath) { Remove-Item -LiteralPath $stagingPath -Recurse -Force }
          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null

          "staging_path=$stagingPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download VWG Artifacts
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.source.outputs.source_pattern }}
          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt download "$env:SOURCE_PATTERN" "$env:STAGING_PATH/" `
            --server-id="$env:VWG_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=1 `
            --split-count=0 `
            --retries=2 `
            --retry-wait-time=10s

          if ($LASTEXITCODE -ne 0) { throw 'VWG artifact download failed.' }

      - name: Locate Downloaded Content
        id: local
        shell: pwsh
        env:
          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}
          ARTIFACT_PATH: ${{ steps.source.outputs.artifact_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $localSource = $null
          $windowsPath = $env:ARTIFACT_PATH.Replace('/', '\\')
          $candidateWithRepo = Join-Path -Path $env:STAGING_PATH -ChildPath $windowsPath

          if (Test-Path -LiteralPath $candidateWithRepo) { $localSource = $candidateWithRepo }

          if (-not $localSource) {
              $parts = $env:ARTIFACT_PATH.Split('/', [System.StringSplitOptions]::RemoveEmptyEntries)
              if ($parts.Count -gt 1) {
                  $withoutRepo = $parts[1..($parts.Count - 1)] -join '\\'
                  $candidateWithoutRepo = Join-Path -Path $env:STAGING_PATH -ChildPath $withoutRepo
                  if (Test-Path -LiteralPath $candidateWithoutRepo) { $localSource = $candidateWithoutRepo }
              }
          }

          if (-not $localSource) {
              Get-ChildItem -LiteralPath $env:STAGING_PATH -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw 'Unable to locate the selected VWG folder locally.'
          }

          $files = @(Get-ChildItem -LiteralPath $localSource -Recurse -File)
          if ($files.Count -eq 0) { throw 'Downloaded VWG content contains no files.' }

          Write-Host "Local source root: $localSource"
          Write-Host "File count: $($files.Count)"

          "local_source=$localSource" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file_count=$($files.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Scout Destinations
        id: target
        shell: pwsh
        env:
          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')
          $fvpRepo = $env:FVP_REPO.Trim().Trim('/')
          $folderName = $env:FOLDER_NAME.Trim().Trim('/')

          if (-not $cloneRepo) { throw 'SCOUT_CLONE_REPO is empty.' }
          if (-not $fvpRepo) { throw 'SCOUT_FVP_REPO is empty.' }
          if (-not $folderName) { throw 'Folder name is empty.' }

          $cloneTarget = "$cloneRepo/$folderName"
          $fvpTarget = "$fvpRepo/$folderName"

          "clone_target=$cloneTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "fvp_target=$fvpTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Preview Scout Clone Upload
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:LOCAL_SOURCE
          try {
              jf rt upload './*' "$env:CLONE_TARGET/" --server-id="$env:SCOUT_SERVER_ID" --recursive=true --flat=false --dry-run
              if ($LASTEXITCODE -ne 0) { throw 'Scout upload dry run failed.' }
          }
          finally { Pop-Location }

      - name: Upload to Scout Clone
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:LOCAL_SOURCE
          try {
              jf rt upload './*' "$env:CLONE_TARGET/" `
                --server-id="$env:SCOUT_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=4 `
                --retries=3 `
                --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) { throw 'Scout Clone upload failed.' }
          }
          finally { Pop-Location }

      - name: Verify Scout Clone
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetPattern = "$env:CLONE_TARGET/*"
          jf rt search "$targetPattern" --server-id="$env:SCOUT_SERVER_ID" --recursive=true --include-dirs=false --fail-no-op=true
          if ($LASTEXITCODE -ne 0) { throw 'Scout Clone verification failed.' }

      - name: Send FVP Promotion Approval Request
        shell: pwsh
        env:
          APPROVAL_WEBHOOK_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}
          FVP_TARGET: ${{ steps.target.outputs.fvp_target }}
          REQUESTED_BY: ${{ github.actor }}
          REPOSITORY_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:APPROVAL_WEBHOOK_URL) { throw 'FVP_APPROVAL_WEBHOOK_URL secret is missing.' }

          $card = @{
              '$schema' = 'http://adaptivecards.io/schemas/adaptive-card.json'
              type = 'AdaptiveCard'
              version = '1.2'
              body = @(
                  @{
                      type = 'TextBlock'
                      text = 'FVP Promotion Approval'
                      size = 'Large'
                      weight = 'Bolder'
                      color = 'Accent'
                  },
                  @{
                      type = 'TextBlock'
                      text = 'The VWG artifact folder was copied successfully and verified in Scout Clone.'
                      wrap = $true
                  },
                  @{
                      type = 'FactSet'
                      facts = @(
                          @{ title = 'Folder'; value = $env:FOLDER_NAME },
                          @{ title = 'Requested By'; value = $env:REQUESTED_BY },
                          @{ title = 'Scout Clone'; value = $env:CLONE_TARGET },
                          @{ title = 'FVP Destination'; value = $env:FVP_TARGET },
                          @{ title = 'GitHub Run'; value = $env:RUN_ID }
                      )
                  },
                  @{
                      type = 'TextBlock'
                      text = 'Do you want to promote this folder to FVP?'
                      wrap = $true
                      weight = 'Bolder'
                      color = 'Warning'
                  }
              )
          }

          $payload = @{
              type = 'message'
              folder_name = $env:FOLDER_NAME
              requested_by = $env:REQUESTED_BY
              clone_path = $env:CLONE_TARGET
              fvp_path = $env:FVP_TARGET
              repository = $env:REPOSITORY_NAME
              migration_run_id = $env:RUN_ID
              attachments = @(
                  @{
                      contentType = 'application/vnd.microsoft.card.adaptive'
                      content = $card
                  }
              )
          }

          $json = $payload | ConvertTo-Json -Depth 30

          Invoke-RestMethod `
            -Uri $env:APPROVAL_WEBHOOK_URL `
            -Method Post `
            -ContentType 'application/json' `
            -Body $json `
            -ErrorAction Stop

          Write-Host 'FVP approval request submitted successfully.'
          Write-Host 'The GitHub runner will not wait for approval.'

      - name: Migration Summary
        if: success()
        shell: pwsh
        env:
          SOURCE_URL: ${{ steps.inputs.outputs.source_url }}
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}
          FVP_TARGET: ${{ steps.target.outputs.fvp_target }}
          FILE_COUNT: ${{ steps.local.outputs.file_count }}
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VWG -> SCOUT CLONE SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "VWG source: $env:SOURCE_URL"
          Write-Host "Folder: $env:FOLDER_NAME"
          Write-Host "Scout Clone: $env:CLONE_TARGET"
          Write-Host "Files transferred: $env:FILE_COUNT"
          Write-Host "FVP after approval: $env:FVP_TARGET"
          Write-Host 'Approval request: SUBMITTED'

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}
        run: |
          if ($env:STAGING_PATH -and (Test-Path -LiteralPath $env:STAGING_PATH)) {
              Remove-Item -LiteralPath $env:STAGING_PATH -Recurse -Force
          }

          jf c rm "$env:VWG_SERVER_ID" --quiet
          jf c rm "$env:SCOUT_SERVER_ID" --quiet
