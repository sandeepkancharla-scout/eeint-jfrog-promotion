name: VWG to Scout Clone

run-name: "VWG to Scout | ${{ inputs.folder_name }}"

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Full VWG JFrog source folder URL"
        required: true
        type: string

      folder_name:
        description: "Folder name to create in Scout Clone"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vwg-to-scout-${{ inputs.folder_name }}
  cancel-in-progress: false


jobs:

  migrate:

    name: Copy VWG Artifacts to Scout Clone

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120

    env:
      VWG_SERVER_ID: vwg-source
      SCOUT_SERVER_ID: scout-target

      WORK_ROOT: C:\Temp\VWGScoutPromotion

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO


    steps:

      # ==========================================================
      # 1. VALIDATE CONFIGURATION
      # ==========================================================

      - name: Validate Configuration
        shell: pwsh

        env:
          VWG_URL: ${{ secrets.VWG_JFROG_URL }}
          VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

          APPROVAL_WEBHOOK_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:VWG_URL) {
              throw 'VWG_JFROG_URL secret is missing.'
          }

          if (-not $env:VWG_TOKEN) {
              throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if (-not $env:SCOUT_URL) {
              throw 'SCOUT_JFROG_URL secret is missing.'
          }

          if (-not $env:SCOUT_TOKEN) {
              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if (-not $env:CLONE_REPO) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (-not $env:FVP_REPO) {
              throw 'SCOUT_FVP_REPO secret is missing.'
          }

          if (-not $env:APPROVAL_WEBHOOK_URL) {
              throw 'FVP_APPROVAL_WEBHOOK_URL secret is missing.'
          }

          Write-Host 'All required configuration is available.'


      # ==========================================================
      # 2. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true


      # ==========================================================
      # 3. VERIFY JFROG CLI
      # ==========================================================

      - name: Verify JFrog CLI
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }


      # ==========================================================
      # 4. VALIDATE INPUTS
      # ==========================================================

      - name: Validate Inputs
        id: inputs
        shell: pwsh

        env:
          SOURCE_URL_INPUT: ${{ inputs.source_url }}
          FOLDER_NAME_INPUT: ${{ inputs.folder_name }}

        run: |
          $ErrorActionPreference = 'Stop'

          $sourceUrl = $env:SOURCE_URL_INPUT.Trim()
          $folderName = $env:FOLDER_NAME_INPUT.Trim()

          if (-not $sourceUrl) {
              throw 'VWG source URL is empty.'
          }

          if (-not $folderName) {
              throw 'Scout folder name is empty.'
          }

          if ($folderName -notmatch '^[A-Za-z0-9._() -]+$') {
              throw 'Folder name contains unsupported characters.'
          }

          if ($folderName.Contains('..')) {
              throw 'Folder name cannot contain ..'
          }

          $folderName = $folderName.Trim('/').Trim('\').Trim()

          if (-not $folderName) {
              throw 'Folder name is invalid.'
          }

          try {
              $sourceUri = [System.Uri]$sourceUrl
          }
          catch {
              throw 'VWG source URL is invalid.'
          }

          if ($sourceUri.Scheme -ne 'https') {
              throw 'VWG source URL must use HTTPS.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VWG TO SCOUT MIGRATION REQUEST'
          Write-Host '========================================'

          Write-Host 'VWG source:'
          Write-Host $sourceUrl

          Write-Host 'Scout folder:'
          Write-Host $folderName

          "source_url=$sourceUrl" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "folder_name=$folderName" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 5. CLEAN EXISTING JFROG CONFIGURATIONS
      # ==========================================================

      - name: Cleanup Existing JFrog Configurations
        shell: pwsh
        continue-on-error: true

        run: |
          jf c rm "$env:VWG_SERVER_ID" --quiet
          jf c rm "$env:SCOUT_SERVER_ID" --quiet


      # ==========================================================
      # 6. CONFIGURE VWG
      # ==========================================================

      - name: Configure VWG JFrog
        shell: pwsh

        env:
          VWG_URL: ${{ secrets.VWG_JFROG_URL }}
          VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          jf c add `
              "$env:VWG_SERVER_ID" `
              --url="$env:VWG_URL" `
              --access-token="$env:VWG_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure VWG JFrog.'
          }


      # ==========================================================
      # 7. VERIFY VWG
      # ==========================================================

      - name: Verify VWG Connection
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf rt ping `
              --server-id="$env:VWG_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to connect to VWG JFrog.'
          }

          Write-Host 'VWG JFrog connection verified.'


      # ==========================================================
      # 8. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout JFrog
        shell: pwsh

        env:
          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }


      # ==========================================================
      # 9. VERIFY SCOUT
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection verified.'


      # ==========================================================
      # 10. PARSE VWG SOURCE URL
      # ==========================================================

      - name: Parse VWG Source URL
        id: source
        shell: pwsh

        env:
          SOURCE_URL_INPUT: ${{ steps.inputs.outputs.source_url }}
          CONFIGURED_VWG_URL: ${{ secrets.VWG_JFROG_URL }}

        run: |
          $ErrorActionPreference = 'Stop'

          try {
              $sourceUri = [System.Uri]$env:SOURCE_URL_INPUT
          }
          catch {
              throw 'Unable to parse VWG source URL.'
          }

          try {
              $configuredUri = [System.Uri]$env:CONFIGURED_VWG_URL
          }
          catch {
              throw 'Configured VWG JFrog URL is invalid.'
          }

          if ($sourceUri.Host -ne $configuredUri.Host) {

              Write-Host 'Input VWG host:'
              Write-Host $sourceUri.Host

              Write-Host 'Configured VWG host:'
              Write-Host $configuredUri.Host

              throw 'Source URL does not belong to configured VWG JFrog.'
          }

          $marker = '/artifactory/'

          $position = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw 'VWG source URL must contain /artifactory/.'
          }

          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $position + $marker.Length
          )

          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )

          $artifactPath = $artifactPath.Replace('\', '/')
          $artifactPath = $artifactPath.Trim('/')

          if (-not $artifactPath) {
              throw 'Unable to determine VWG Artifactory path.'
          }

          if ($artifactPath.Contains('..')) {
              throw 'VWG artifact path cannot contain ..'
          }

          $sourcePattern = "$artifactPath/*"

          Write-Host ''
          Write-Host 'VWG artifact path:'
          Write-Host $artifactPath

          Write-Host 'VWG source pattern:'
          Write-Host $source
