name: 01 - VWG to Scout Clone

run-name: "VWG to Scout | ${{ inputs.folder_name }}"

on:
  workflow_dispatch:
    inputs:

      source_url:
        description: "Full VWG JFrog source file/folder URL"
        required: true
        type: string

      folder_name:
        description: "Folder name to create in Scout clone (example: CW36)"
        required: true
        type: string


permissions:
  contents: read


# Prevent multiple migration jobs from using the same
# Windows staging directory at the same time.
concurrency:
  group: vwg-to-scout-migration
  cancel-in-progress: false


jobs:

  migrate:

    name: Copy VWG Artifacts to Scout Clone

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 120


    env:

      SOURCE_SERVER_ID: vwg-source

      SCOUT_SERVER_ID: scout-target

      WORK_ROOT: C:\Temp\VWGScoutPromotion

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO


    steps:


      # ==========================================================
      # 1. VALIDATE REQUIRED SECRETS
      # ==========================================================

      - name: Validate Configuration

        shell: pwsh

        env:

          VWG_URL: ${{ secrets.VWG_JFROG_URL }}

          VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}

          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

        run: |

          $ErrorActionPreference = 'Stop'


          if (-not $env:VWG_URL) {

              throw 'VWG_JFROG_URL secret is missing.'

          }


          if (-not $env:VWG_TOKEN) {

              throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.'

          }


          if (-not $env:SCOUT_URL) {

              throw 'SCOUT_JFROG_URL secret is missing.'

          }


          if (-not $env:SCOUT_TOKEN) {

              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'

          }


          if (-not $env:CLONE_REPO) {

              throw 'SCOUT_CLONE_REPO secret is missing.'

          }


          if (-not $env:FVP_REPO) {

              throw 'SCOUT_FVP_REPO secret is missing.'

          }


          Write-Host 'All required JFrog configuration is available.'



      # ==========================================================
      # 2. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI

        uses: jfrog/setup-jfrog-cli@v4

        with:

          disable-auto-build-publish: true



      # ==========================================================
      # 3. SHOW CLI VERSION
      # ==========================================================

      - name: Verify JFrog CLI

        shell: pwsh

        run: |

          $ErrorActionPreference = 'Stop'


          jf --version


          if ($LASTEXITCODE -ne 0) {

              throw 'JFrog CLI is unavailable.'

          }



      # ==========================================================
      # 4. VALIDATE USER INPUTS
      # ==========================================================

      - name: Validate Inputs

        id: inputs

        shell: pwsh

        env:

          INPUT_SOURCE_URL: ${{ inputs.source_url }}

          INPUT_FOLDER_NAME: ${{ inputs.folder_name }}

        run: |

          $ErrorActionPreference = 'Stop'


          $sourceUrl = $env:INPUT_SOURCE_URL.Trim()

          $folderName = $env:INPUT_FOLDER_NAME.Trim()


          if (-not $sourceUrl) {

              throw 'VWG source URL is empty.'

          }


          if (-not $folderName) {

              throw 'Scout folder name is empty.'

          }


          # ------------------------------------------------------
          # Validate destination folder name.
          #
          # Keep this intentionally conservative because the value
          # becomes part of an Artifactory path and local path.
          # ------------------------------------------------------

          if ($folderName -notmatch '^[A-Za-z0-9._() -]+$') {

              throw 'Folder name contains unsupported characters.'

          }


          if ($folderName.Contains('..')) {

              throw 'Folder name cannot contain ..'

          }


          $folderName = $folderName.Trim('/').Trim('\').Trim()


          if (-not $folderName) {

              throw 'Folder name is invalid.'

          }


          # ------------------------------------------------------
          # Validate source URL.
          # ------------------------------------------------------

          try {

              $sourceUri = [System.Uri]$sourceUrl

          }
          catch {

              throw 'VWG source URL is invalid.'

          }


          if ($sourceUri.Scheme -ne 'https') {

              throw 'VWG source URL must use HTTPS.'

          }


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'MIGRATION REQUEST'

          Write-Host '========================================'


          Write-Host 'VWG source:'

          Write-Host $sourceUrl


          Write-Host 'Scout folder:'

          Write-Host $folderName


          "source_url=$sourceUrl" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "folder_name=$folderName" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append



      # ==========================================================
      # 5. CLEAN OLD JFROG CONFIGURATIONS
      # ==========================================================

      - name: Cleanup Existing JFrog Configurations

        shell: pwsh

        continue-on-error: true

        run: |

          jf c rm "$env:SOURCE_SERVER_ID" --quiet

          jf c rm "$env:SCOUT_SERVER_ID" --quiet



      # ==========================================================
      # 6. CONFIGURE VWG JFROG
      # ==========================================================

      - name: Configure VWG JFrog

        shell: pwsh

        env:

          VWG_URL: ${{ secrets.VWG_JFROG_URL }}

          VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = 'Stop'


          jf c add `
              "$env:SOURCE_SERVER_ID" `
              --url="$env:VWG_URL" `
              --access-token="$env:VWG_TOKEN" `
              --interactive=false `
              --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Failed to configure VWG JFrog.'

          }



      # ==========================================================
      # 7. VERIFY VWG CONNECTION
      # ==========================================================

      - name: Verify VWG Connection

        shell: pwsh

        run: |

          $ErrorActionPreference = 'Stop'


          jf rt ping `
              --server-id="$env:SOURCE_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw 'Unable to connect to VWG JFrog.'

          }


          Write-Host 'VWG JFrog connection verified.'



      # ==========================================================
      # 8. CONFIGURE SCOUT JFROG
      # ==========================================================

      - name: Configure Scout JFrog

        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}

          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = 'Stop'


          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Failed to configure Scout JFrog.'

          }



      # ==========================================================
      # 9. VERIFY SCOUT CONNECTION
      # ==========================================================

      - name: Verify Scout Connection

        shell: pwsh

        run: |

          $ErrorActionPreference = 'Stop'


          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw 'Unable to connect to Scout JFrog.'

          }


          Write-Host 'Scout JFrog connection verified.'



      # ==========================================================
      # 10. PARSE VWG SOURCE URL
      #
      # Example:
      #
      # https://jfrog.../artifactory/repo/path/build/
      #
      # becomes:
      #
      # repo/path/build
      # ==========================================================

      - name: Parse VWG Source URL

        id: source

        shell: pwsh

        env:

          SOURCE_URL_INPUT: ${{ steps.inputs.outputs.source_url }}

          CONFIGURED_VWG_URL: ${{ secrets.VWG_JFROG_URL }}

        run: |

          $ErrorActionPreference = 'Stop'


          $sourceUri = [System.Uri]$env:SOURCE_URL_INPUT

          $configuredUri = [System.Uri]$env:CONFIGURED_VWG_URL


          # ------------------------------------------------------
          # Make sure the user did not accidentally provide
          # a source from another Artifactory host.
          # ------------------------------------------------------

          if ($sourceUri.Host -ne $configuredUri.Host) {

              Write-Host 'Input VWG host:'

              Write-Host $sourceUri.Host


              Write-Host 'Configured VWG host:'

              Write-Host $configuredUri.Host


              throw 'Source URL does not belong to configured VWG JFrog.'

          }


          $marker = '/artifactory/'


          $position = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )


          if ($position -lt 0) {

              throw 'VWG source URL must contain /artifactory/.'

          }


          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $position + $marker.Length
          )


          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )


          $artifactPath = $artifactPath.Replace('\', '/')

          $artifactPath = $artifactPath.Trim('/')


          if (-not $artifactPath) {

              throw 'Unable to determine VWG Artifactory path.'

          }


          if ($artifactPath.Contains('..')) {

              throw 'VWG artifact path cannot contain ..'

          }


          # ------------------------------------------------------
          # Source may be either:
          #
          # - a single file
          # - a folder
          #
          # We first test the exact supplied path later.
          # ------------------------------------------------------

          Write-Host ''

          Write-Host 'Parsed VWG path:'

          Write-Host $artifactPath


          "artifact_path=$artifactPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append



      # ==========================================================
      # 11. DETERMINE SOURCE TYPE
      #
      # Try the exact path first.
      #
      # If the exact path resolves as a single artifact we treat
      # the input as a file.
      #
      # Otherwise we search recursively below it as a folder.
      # ==========================================================

      - name: Determine VWG Source Type

        id: source_type

        shell: pwsh

        env:

          ARTIFACT_PATH: ${{ steps.source.outputs.artifact_path }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host 'Checking exact VWG source:'

          Write-Host $env:ARTIFACT_PATH


          $exactOutput = & jf rt search `
              "$env:ARTIFACT_PATH" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --recursive=false `
              --include-dirs=false


          $exactExitCode = $LASTEXITCODE


          if ($exactExitCode -ne 0) {

              throw 'Unable to search VWG source.'

          }


          $exactText = (
              $exactOutput |
              Out-String
          )


          # ------------------------------------------------------
          # JFrog command output can vary between versions.
          # Instead of trusting console text alone, use the URL
          # ending to identify obvious file inputs.
          #
          # If folder input is given, recursive source verification
          # below is authoritative.
          # ------------------------------------------------------

          $leaf = (
              $env:ARTIFACT_PATH.Split('/')[-1]
          )


          $looksLikeFile = (
              $leaf.Contains('.') -and
              -not $env:ARTIFACT_PATH.EndsWith('/')
          )


          if ($looksLikeFile -and
              $exactText -notmatch 'Found 0 artifacts') {

              $sourceType = 'file'

              $searchPattern = $env:ARTIFACT_PATH

          }
          else {

              $sourceType = 'folder'

              $searchPattern = "$env:ARTIFACT_PATH/*"

          }


          Write-Host 'Detected source type:'

          Write-Host $sourceType


          Write-Host 'Search/download pattern:'

          Write-Host $searchPattern


          "source_type=$sourceType" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "search_pattern=$searchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append



      # ==========================================================
      # 12. VERIFY VWG SOURCE
      # ==========================================================

      - name: Verify VWG Source

        shell: pwsh

        env:

          SOURCE_PATTERN: ${{ steps.source_type.outputs.search_pattern }}

          SOURCE_TYPE: ${{ steps.source_type.outputs.source_type }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host 'Searching VWG:'

          Write-Host $env:SOURCE_PATTERN


          if ($env:SOURCE_TYPE -eq 'file') {

              jf rt search `
                  "$env:SOURCE_PATTERN" `
                  --server-id="$env:SOURCE_SERVER_ID" `
                  --recursive=false `
                  --include-dirs=false `
                  --fail-no-op=true

          }
          else {

              jf rt search `
                  "$env:SOURCE_PATTERN" `
                  --server-id="$env:SOURCE_SERVER_ID" `
                  --recursive=true `
                  --include-dirs=false `
                  --fail-no-op=true

          }


          if ($LASTEXITCODE -ne 0) {

              throw 'No matching VWG artifacts were found.'

          }


          Write-Host 'VWG source verified.'



      # ==========================================================
      # 13. PREPARE REQUEST-SPECIFIC STAGING
      #
      # Each run gets its own directory so an old run cannot mix
      # files with a newer migration.
      # ==========================================================

      - name: Prepare Local Staging

        id: staging

        shell: pwsh

        run: |

          $ErrorActionPreference = 'Stop'


          $requestFolder = "RUN-${{ github.run_id }}"


          $stagingPath = Join-Path `
              -Path $env:WORK_ROOT `
              -ChildPath $requestFolder


          if (Test-Path -LiteralPath $stagingPath) {

              Remove-Item `
                  -LiteralPath $stagingPath `
                  -Recurse `
                  -Force

          }


          New-Item `
              -ItemType Directory `
              -Path $stagingPath `
              -Force |
              Out-Null


          Write-Host 'Local staging directory:'

          Write-Host $stagingPath


          "staging_path=$stagingPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append



      # ==========================================================
      # 14. DOWNLOAD VWG ARTIFACTS
      #
      # Single-threaded / splitting disabled intentionally.
      #
      # We previously observed multipart download behaviour on
      # the Windows self-hosted runner. Reliability is more
      # important than throughput during this POC.
      # ==========================================================

      - name: Download VWG Artifacts

        shell: pwsh

        env:

          SOURCE_PATTERN: ${{ steps.source_type.outputs.search_pattern }}

          SOURCE_TYPE: ${{ steps.source_type.outputs.source_type }}

          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'DOWNLOADING FROM VWG'

          Write-Host '========================================'


          Write-Host 'Source:'

          Write-Host $env:SOURCE_PATTERN


          Write-Host 'Local staging:'

          Write-Host $env:STAGING_PATH


          if ($env:SOURCE_TYPE -eq 'file') {

              jf rt download `
                  "$env:SOURCE_PATTERN" `
                  "$env:STAGING_PATH/" `
                  --server-id="$env:SOURCE_SERVER_ID" `
                  --recursive=false `
                  --flat=true `
                  --fail-no-op=true `
                  --threads=1 `
                  --split-count=0 `
                  --retries=2 `
                  --retry-wait-time=10s

          }
          else {

              # --------------------------------------------------
              # For a folder we intentionally flatten only the
              # Artifactory prefix into our local staging root.
              #
              # The original hierarchy BELOW the selected folder
              # is reconstructed in the next step.
              # --------------------------------------------------

              $artifactPath = "${{ steps.source.outputs.artifact_path }}"


              $capturePattern = "$artifactPath/(**)"


              Write-Host 'Folder capture pattern:'

              Write-Host $capturePattern


              jf rt download `
                  "$capturePattern" `
                  "$env:STAGING_PATH/{1}" `
                  --server-id="$env:SOURCE_SERVER_ID" `
                  --recursive=false `
                  --flat=true `
                  --fail-no-op=true `
                  --threads=1 `
                  --split-count=0 `
                  --retries=2 `
                  --retry-wait-time=10s

          }


          if ($LASTEXITCODE -ne 0) {

              throw 'VWG artifact download failed.'

          }


          Write-Host 'VWG download completed.'



      # ==========================================================
      # 15. VERIFY LOCAL STAGING
      # ==========================================================

      - name: Verify Local Staging

        id: local

        shell: pwsh

        env:

          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}

        run: |

          $ErrorActionPreference = 'Stop'


          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_PATH `
                  -Recurse `
                  -File
          )


          if ($files.Count -eq 0) {

              throw 'No files exist in local staging after VWG download.'

          }


          Write-Host ''

          Write-Host 'Downloaded file count:'

          Write-Host $files.Count


          Write-Host ''

          Write-Host 'Downloaded hierarchy:'


          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $env:STAGING_PATH.Length
              )


              $relative = $relative.TrimStart('\')


              Write-Host $relative

          }


          "file_count=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append



      # ==========================================================
      # 16. BUILD FIXED SCOUT DESTINATION
      #
      # Secret:
      #
      # SCOUT_CLONE_REPO =
      # rvtm-vw-rvt-scout-build-binaries-clone
      #
      # User:
      #
      # folder_name = CW36
      #
      # Result:
      #
      # rvtm-vw-rvt-scout-build-binaries-clone/CW36/
      # ==========================================================

      - name: Build Scout Clone Destination

        id: target

        shell: pwsh

        env:

          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}

        run: |

          $ErrorActionPreference = 'Stop'


          $cloneRepo = (
              $env:CLONE_REPO.Trim().Trim('/')
          )


          $fvpRepo = (
              $env:FVP_REPO.Trim().Trim('/')
          )


          $folderName = (
              $env:FOLDER_NAME.Trim().Trim('/')
          )


          if (-not $cloneRepo) {

              throw 'SCOUT_CLONE_REPO is empty.'

          }


          if (-not $fvpRepo) {

              throw 'SCOUT_FVP_REPO is empty.'

          }


          $cloneTarget = "$cloneRepo/$folderName"


          # This is informational for the approval stage that
          # will be added after Step 1 is proven.
          $futureFvpTarget = "$fvpRepo/$folderName"


          Write-Host ''

          Write-Host 'Scout clone target:'

          Write-Host $cloneTarget


          Write-Host 'Future approved FVP target:'

          Write-Host $futureFvpTarget


          "clone_target=$cloneTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "future_fvp_target=$futureFvpTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append



      # ==========================================================
      # 17. PREVIEW SCOUT UPLOAD
      #
      # IMPORTANT:
      #
      # Change directory into staging and upload using "./*".
      #
      # This avoids the historical problem where:
      #
      # C:/Temp/Artifacts
      #
      # accidentally became part of the Artifactory destination.
      # ==========================================================

      - name: Preview Scout Clone Upload

        shell: pwsh

        env:

          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}

          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'UPLOAD DRY RUN'

          Write-Host '========================================'


          Write-Host 'FROM:'

          Write-Host $env:STAGING_PATH


          Write-Host 'TO:'

          Write-Host "$env:CLONE_TARGET/"


          Push-Location $env:STAGING_PATH


          try {

              jf rt upload `
                  './*' `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run


              if ($LASTEXITCODE -ne 0) {

                  throw 'Scout upload dry run failed.'

              }

          }
          finally {

              Pop-Location

          }



      # ==========================================================
      # 18. UPLOAD TO FIXED SCOUT CLONE
      # ==========================================================

      - name: Upload to Scout Clone

        shell: pwsh

        env:

          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}

          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'UPLOADING TO SCOUT CLONE'

          Write-Host '========================================'


          Write-Host 'FROM:'

          Write-Host $env:STAGING_PATH


          Write-Host 'TO:'

          Write-Host "$env:CLONE_TARGET/"


          Push-Location $env:STAGING_PATH


          try {

              jf rt upload `
                  './*' `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s


              if ($LASTEXITCODE -ne 0) {

                  throw 'Scout clone upload failed.'

              }

          }
          finally {

              Pop-Location

          }


          Write-Host 'Scout clone upload completed.'



      # ==========================================================
      # 19. VERIFY SCOUT CLONE
      # ==========================================================

      - name: Verify Scout Clone

        shell: pwsh

        env:

          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}

        run: |

          $ErrorActionPreference = 'Stop'


          $targetPattern = "$env:CLONE_TARGET/*"


          Write-Host ''

          Write-Host 'Verifying Scout destination:'

          Write-Host $targetPattern


          jf rt search `
              "$targetPattern" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Scout clone verification failed.'

          }


          Write-Host 'Scout clone verified.'



      # ==========================================================
      # 20. STEP-1 SUMMARY
      #
      # NO APPROVAL YET.
      #
      # We intentionally stop here for the first implementation
      # checkpoint.
      # ==========================================================

      - name: Migration Summary

        if: success()

        shell: pwsh

        env:

          SOURCE_URL: ${{ steps.inputs.outputs.source_url }}

          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}

          CLONE_TARGET: ${{ steps.target.outputs.clone_target }}

          FUTURE_FVP_TARGET: ${{ steps.target.outputs.future_fvp_target }}

          FILE_COUNT: ${{ steps.local.outputs.file_count }}

        run: |

          Write-Host ''

          Write-Host '========================================'

          Write-Host 'STEP 1 SUCCESSFUL'

          Write-Host 'VWG -> SCOUT CLONE COMPLETED'

          Write-Host '========================================'


          Write-Host 'VWG source:'

          Write-Host $env:SOURCE_URL


          Write-Host 'Folder name:'

          Write-Host $env:FOLDER_NAME


          Write-Host 'Scout clone location:'

          Write-Host $env:CLONE_TARGET


          Write-Host 'Files transferred:'

          Write-Host $env:FILE_COUNT


          Write-Host ''

          Write-Host 'Future FVP destination after approval:'

          Write-Host $env:FUTURE_FVP_TARGET


          Write-Host ''

          Write-Host 'Approval has NOT been added yet.'

          Write-Host 'This workflow intentionally stops after Scout verification.'



      # ==========================================================
      # 21. CLEANUP
      #
      # The artifact remains in Scout.
      #
      # Only temporary Windows files and temporary CLI configs
      # are removed.
      # ==========================================================

      - name: Cleanup

        if: always()

        shell: pwsh

        continue-on-error: true

        env:

          STAGING_PATH: ${{ steps.staging.outputs.staging_path }}

        run: |

          if (
              $env:STAGING_PATH -and
              (Test-Path -LiteralPath $env:STAGING_PATH)
          ) {

              Remove-Item `
                  -LiteralPath $env:STAGING_PATH `
                  -Recurse `
                  -Force

          }


          jf c rm "$env:SOURCE_SERVER_ID" --quiet

          jf c rm "$env:SCOUT_SERVER_ID" --quiet


          Write-Host 'Temporary staging and JFrog configurations removed.'
