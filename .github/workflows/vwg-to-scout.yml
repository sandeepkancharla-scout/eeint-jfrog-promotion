name: VWG to Scout Clone

run-name: "VWG to Scout | ${{ inputs.folder_name }}"

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Full VWG JFrog source folder URL"
        required: true
        type: string

      folder_name:
        description: "Top-level folder name to copy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vwg-to-scout-${{ inputs.folder_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy VWG Folder to Scout Clone

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60

    env:
      VWG_SERVER_ID: vwg-source
      SCOUT_SERVER_ID: scout-target
      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. VALIDATE INPUTS
      # ==========================================================

      - name: Validate Inputs
        id: inputs
        shell: pwsh
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FOLDER_NAME: ${{ inputs.folder_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceUrl = $env:SOURCE_URL.Trim()
          $folderName = $env:FOLDER_NAME.Trim()

          if (-not $sourceUrl) {
              throw 'source_url is required.'
          }

          if (-not $folderName) {
              throw 'folder_name is required.'
          }

          if ($folderName.Contains('..')) {
              throw 'folder_name cannot contain ..'
          }

          if ($folderName -notmatch '^[A-Za-z0-9._() -]+$') {
              throw 'folder_name contains unsupported characters.'
          }

          $folderName = $folderName.Trim('/').Trim('\').Trim()

          if (-not $folderName) {
              throw 'folder_name is invalid.'
          }

          Write-Host "Source URL:"
          Write-Host $sourceUrl

          Write-Host ""
          Write-Host "Folder:"
          Write-Host $folderName

          "folder_name=$folderName" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append


      # ==========================================================
      # 2. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4


      # ==========================================================
      # 3. VERIFY JFROG CLI
      # ==========================================================

      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "JFrog CLI location:"
          Get-Command jf

          Write-Host ""
          Write-Host "JFrog CLI version:"
          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI validation failed.'
          }


      # ==========================================================
      # 4. CONFIGURE VWG JFROG
      # ==========================================================

      - name: Configure VWG JFrog
        shell: pwsh
        env:
          VWG_JFROG_URL: ${{ secrets.VWG_JFROG_URL }}
          VWG_JFROG_ACCESS_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:VWG_JFROG_URL) {
              throw 'VWG_JFROG_URL secret is missing.'
          }

          if (-not $env:VWG_JFROG_ACCESS_TOKEN) {
              throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.'
          }

          jf c rm $env:VWG_SERVER_ID --quiet 2>$null

          jf c add $env:VWG_SERVER_ID `
            --url="$env:VWG_JFROG_URL" `
            --access-token="$env:VWG_JFROG_ACCESS_TOKEN" `
            --interactive=false

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure VWG JFrog.'
          }

          Write-Host "VWG JFrog configuration created."


      # ==========================================================
      # 5. CONFIGURE SCOUT JFROG
      # ==========================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          SCOUT_JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_JFROG_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SCOUT_JFROG_URL) {
              throw 'SCOUT_JFROG_URL secret is missing.'
          }

          if (-not $env:SCOUT_JFROG_ACCESS_TOKEN) {
              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'
          }

          jf c rm $env:SCOUT_SERVER_ID --quiet 2>$null

          jf c add $env:SCOUT_SERVER_ID `
            --url="$env:SCOUT_JFROG_URL" `
            --access-token="$env:SCOUT_JFROG_ACCESS_TOKEN" `
            --interactive=false

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          Write-Host "Scout JFrog configuration created."


      # ==========================================================
      # 6. RESOLVE TARGET PATHS
      # ==========================================================

      - name: Resolve Paths
        id: paths
        shell: pwsh
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
          SCOUT_CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
          SCOUT_FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SCOUT_CLONE_REPO) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (-not $env:SCOUT_FVP_REPO) {
              throw 'SCOUT_FVP_REPO secret is missing.'
          }

          $source = $env:SOURCE_URL.TrimEnd('/')
          $folder = $env:FOLDER_NAME

          $cloneTarget =
              "$($env:SCOUT_CLONE_REPO)/$folder"

          $fvpTarget =
              "$($env:SCOUT_FVP_REPO)/$folder"

          Write-Host "VWG source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Folder:"
          Write-Host $folder

          Write-Host ""
          Write-Host "Scout Clone target:"
          Write-Host $cloneTarget

          Write-Host ""
          Write-Host "FVP target:"
          Write-Host $fvpTarget

          "source=$source" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "clone_target=$cloneTarget" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "fvp_target=$fvpTarget" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append


      # ==========================================================
      # 7. VWG -> SCOUT COPY
      # ==========================================================
      #
      # IMPORTANT:
      #
      # Put your EXISTING WORKING VWG -> Scout transfer commands
      # inside this step.
      #
      # Do NOT send the approval from inside a per-file loop.
      #
      # Everything must finish first.
      #
      # ==========================================================

      - name: Copy VWG Folder to Scout Clone
        shell: pwsh
        env:
          SOURCE_URL: ${{ steps.paths.outputs.source }}
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
          CLONE_TARGET: ${{ steps.paths.outputs.clone_target }}
          VWG_JFROG_URL: ${{ secrets.VWG_JFROG_URL }}
          VWG_JFROG_ACCESS_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}
          SCOUT_JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_JFROG_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=================================="
          Write-Host " VWG -> SCOUT COPY"
          Write-Host "=================================="

          Write-Host "Source:"
          Write-Host $env:SOURCE_URL

          Write-Host ""

          Write-Host "Destination:"
          Write-Host $env:CLONE_TARGET

          Write-Host ""

          # ======================================================
          # PASTE YOUR EXISTING WORKING VWG -> SCOUT TRANSFER
          # COMMANDS HERE.
          #
          # Do NOT put Invoke-RestMethod for Power Automate here.
          # ======================================================

          Write-Host "VWG -> Scout transfer block goes here."


      # ==========================================================
      # 8. VERIFY SCOUT CLONE
      # ==========================================================

      - name: Verify Scout Clone
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.paths.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Verifying Scout Clone:"
          Write-Host $env:CLONE_TARGET

          jf rt s "$env:CLONE_TARGET/**" `
            --server-id=$env:SCOUT_SERVER_ID

          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to verify Scout Clone.'
          }

          Write-Host ""
          Write-Host "Scout Clone verification completed."


      # ==========================================================
      # 9. SEND EXACTLY ONE APPROVAL REQUEST
      # ==========================================================
      #
      # IMPORTANT:
      #
      # This is intentionally AFTER:
      #
      #   VWG -> Scout copy
      #          AND
      #   Scout Clone verification
      #
      # Therefore the Power Automate webhook is called ONCE
      # for this workflow execution.
      #
      # ==========================================================

      - name: Send ONE FVP Promotion Approval
        shell: pwsh
        env:
          APPROVAL_WEBHOOK_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
          CLONE_TARGET: ${{ steps.paths.outputs.clone_target }}
          FVP_TARGET: ${{ steps.paths.outputs.fvp_target }}
          REQUESTED_BY: ${{ github.actor }}
          REPOSITORY_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:APPROVAL_WEBHOOK_URL) {
              throw 'FVP_APPROVAL_WEBHOOK_URL secret is missing.'
          }

          Write-Host "=================================="
          Write-Host " FVP APPROVAL REQUEST"
          Write-Host "=================================="

          Write-Host "Folder:"
          Write-Host $env:FOLDER_NAME

          Write-Host ""

          Write-Host "Scout Clone:"
          Write-Host $env:CLONE_TARGET

          Write-Host ""

          Write-Host "FVP destination:"
          Write-Host $env:FVP_TARGET

          $body = @{
              folder_name       = $env:FOLDER_NAME
              clone_path        = $env:CLONE_TARGET
              fvp_path          = $env:FVP_TARGET
              requested_by      = $env:REQUESTED_BY
              repository        = $env:REPOSITORY_NAME
              migration_run_id  = $env:RUN_ID
          } | ConvertTo-Json

          Write-Host ""
          Write-Host "Sending ONE request to Power Automate..."

          Invoke-RestMethod `
            -Uri $env:APPROVAL_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

          Write-Host ""
          Write-Host "=================================="
          Write-Host " ONE APPROVAL REQUEST SENT"
          Write-Host "=================================="

          Write-Host "Folder:"
          Write-Host $env:FOLDER_NAME


      # ==========================================================
      # 10. COMPLETE
      # ==========================================================

      - name: Migration Complete
        shell: pwsh
        env:
          FOLDER_NAME: ${{ steps.inputs.outputs.folder_name }}
          CLONE_TARGET: ${{ steps.paths.outputs.clone_target }}
        run: |
          Write-Host ""
          Write-Host "=================================="
          Write-Host " VWG -> SCOUT COMPLETE"
          Write-Host "=================================="

          Write-Host "Folder:"
          Write-Host $env:FOLDER_NAME

          Write-Host ""

          Write-Host "Scout Clone:"
          Write-Host $env:CLONE_TARGET

          Write-Host ""
          Write-Host "Approval request submitted."
          Write-Host "This GitHub workflow is finished."
