name: VWG to Scout Clone

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "VWG JFrog artifact URL"
        required: true
        type: string

      build_type:
        description: "Select build type"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - official

      release_folder:
        description: "Release/CW number - required only for Official"
        required: false
        type: string

permissions:
  contents: read

jobs:
  transfer:
    name: Transfer VWG Artifact to Scout Clone
    runs-on: self-hosted
    timeout-minutes: 60

    env:
      FILE_URL: ${{ inputs.file_url }}
      BUILD_TYPE: ${{ inputs.build_type }}
      RELEASE_FOLDER: ${{ inputs.release_folder }}

      VWG_URL: ${{ secrets.VWG_JFROG_URL }}
      VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      STAGING_DIR: ${{ runner.temp }}\vwg-scout-${{ github.run_id }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Validate inputs
        shell: cmd
        run: |
          @echo off

          if "%FILE_URL%"=="" (
            echo ERROR: VWG artifact URL is required.
            exit /b 1
          )

          if "%VWG_URL%"=="" (
            echo ERROR: VWG_JFROG_URL is missing.
            exit /b 1
          )

          if "%VWG_TOKEN%"=="" (
            echo ERROR: VWG_JFROG_ACCESS_TOKEN is missing.
            exit /b 1
          )

          if "%SCOUT_URL%"=="" (
            echo ERROR: SCOUT_JFROG_URL is missing.
            exit /b 1
          )

          if "%SCOUT_TOKEN%"=="" (
            echo ERROR: SCOUT_JFROG_ACCESS_TOKEN is missing.
            exit /b 1
          )

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if /I "%BUILD_TYPE%"=="official" (
            if "%RELEASE_FOLDER%"=="" (
              echo ERROR: Release/CW number is required for Official.
              exit /b 1
            )
          )

          echo Validation successful.

      - name: Parse VWG URL
        id: parse
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "FULL_URL=%FILE_URL%"
          set "PREFIX=%VWG_URL%/artifactory/"
          set "RELATIVE=!FULL_URL:%VWG_URL%/artifactory/=!"

          if "!RELATIVE!"=="!FULL_URL!" (
            echo ERROR: Invalid VWG JFrog URL.
            echo Expected:
            echo %VWG_URL%/artifactory/REPOSITORY/PATH/FILE
            exit /b 1
          )

          for /f "tokens=1,* delims=/" %%A in ("!RELATIVE!") do (
            set "SOURCE_REPO=%%A"
            set "SOURCE_PATH=%%B"
          )

          if "!SOURCE_REPO!"=="" (
            echo ERROR: Could not determine VWG repository.
            exit /b 1
          )

          if "!SOURCE_PATH!"=="" (
            echo ERROR: Could not determine VWG artifact path.
            exit /b 1
          )

          echo Source repository:
          echo !SOURCE_REPO!

          echo Source path:
          echo !SOURCE_PATH!

          echo source_repo=!SOURCE_REPO!>>"%GITHUB_OUTPUT%"
          echo source_path=!SOURCE_PATH!>>"%GITHUB_OUTPUT%"

          endlocal

      - name: Configure VWG JFrog
        shell: cmd
        run: |
          @echo off

          jf c remove vwg-source --quiet >nul 2>&1

          jf c add vwg-source ^
            --url="%VWG_URL%" ^
            --access-token="%VWG_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure VWG JFrog.
            exit /b 1
          )

          jf rt ping --server-id=vwg-source

          if errorlevel 1 (
            echo ERROR: Cannot connect to VWG JFrog.
            exit /b 1
          )

          echo VWG JFrog connection successful.

      - name: Configure Scout JFrog
        shell: cmd
        run: |
          @echo off

          jf c remove scout-target --quiet >nul 2>&1

          jf c add scout-target ^
            --url="%SCOUT_URL%" ^
            --access-token="%SCOUT_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure Scout JFrog.
            exit /b 1
          )

          jf rt ping --server-id=scout-target

          if errorlevel 1 (
            echo ERROR: Cannot connect to Scout JFrog.
            exit /b 1
          )

          echo Scout JFrog connection successful.

      - name: Prepare local temporary folder
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          mkdir "%STAGING_DIR%"

          if errorlevel 1 (
            echo ERROR: Could not create temporary folder.
            exit /b 1
          )

          echo Temporary folder:
          echo %STAGING_DIR%

      - name: Verify VWG artifact
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          jf rt search ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --server-id=vwg-source ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Artifact not found in VWG.
            exit /b 1
          )

          echo VWG artifact found.

      - name: Download VWG artifact to local temp
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          echo Downloading:
          echo %SOURCE_REPO%/%SOURCE_PATH%

          echo To:
          echo %STAGING_DIR%

          jf rt download ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%STAGING_DIR%/" ^
            --server-id=vwg-source ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG download failed.
            exit /b 1
          )

          echo Download successful.

      - name: Calculate Scout destination
        id: destination
        shell: cmd
        env:
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          if /I "%BUILD_TYPE%"=="nightly" (
            echo destination_path=Daily_Builds/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"

            echo Nightly destination:
            echo %CLONE_REPO%/Daily_Builds/%SOURCE_PATH%

            exit /b 0
          )

          if /I "%BUILD_TYPE%"=="official" (
            echo destination_path=Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"

            echo Official destination:
            echo %CLONE_REPO%/Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%

            exit /b 0
          )

          echo ERROR: Invalid build type.
          exit /b 1

      - name: Upload Nightly to Scout Clone
        if: ${{ inputs.build_type == 'nightly' }}
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo Uploading Nightly build to:
          echo %CLONE_REPO%/%DESTINATION_PATH%

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly verification failed.
            exit /b 1
          )

          echo Nightly transfer successful.
          echo No FVP approval required.

      - name: Upload Official to Scout Clone
        if: ${{ inputs.build_type == 'official' }}
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo Uploading Official release to:
          echo %CLONE_REPO%/%DESTINATION_PATH%

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official verification failed.
            exit /b 1
          )

          echo Official transfer successful.

      - name: Request FVP approval
        if: ${{ success() && inputs.build_type == 'official' }}
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing.
            exit /b 1
          )

          echo Sending FVP approval request...

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%RELEASE_FOLDER%\",\"promotion_path\":\"%DESTINATION_PATH%\",\"requested_by\":\"${{ github.actor }}\",\"item_type\":\"artifact\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: FVP approval request failed.
            exit /b 1
          )

          echo FVP approval request submitted successfully.

      - name: Cleanup local temporary files
        if: ${{ always() }}
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          jf c remove vwg-source --quiet >nul 2>&1
          jf c remove scout-target --quiet >nul 2>&1

          echo Cleanup complete.
