name: VWG to Scout Clone

run-name: >-
  VWG to Scout |
  ${{ inputs.build_type }} |
  ${{ inputs.calendar_week }}

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Full VWG JFrog source folder URL"
        required: true
        type: string

      build_type:
        description: "Select build type"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - official

      calendar_week:
        description: "Daily: enter date YYYY-MM-DD. Official: enter CW, for example CW29"
        required: true
        type: string

      official_type:
        description: "For Official select Release. For Daily select N/A"
        required: true
        default: "N/A"
        type: choice
        options:
          - "N/A"
          - "Release"

permissions:
  contents: read

concurrency:
  group: >-
    vwg-to-scout-${{
      inputs.build_type
    }}-${{
      inputs.calendar_week
    }}

  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer VWG Folder to Scout Clone

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      FOLDER_URL: ${{ inputs.folder_url }}
      BUILD_TYPE: ${{ inputs.build_type }}
      CALENDAR_WEEK: ${{ inputs.calendar_week }}
      OFFICIAL_TYPE: ${{ inputs.official_type }}

      VWG_URL: ${{ secrets.VWG_JFROG_URL }}
      VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}

      VWG_SERVER_ID: vwg-source
      SCOUT_SERVER_ID: scout-target

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      # ==========================================================
      # 1. SET UP JFROG CLI
      # ==========================================================

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      # ==========================================================
      # 2. CREATE TEMPORARY DIRECTORY
      # ==========================================================

      - name: Set temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stagingDirectory = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "vwg-scout-${{ github.run_id }}"

          "STAGING_DIR=$stagingDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Temporary directory:"
          Write-Host $stagingDirectory

      # ==========================================================
      # 3. VALIDATE INPUTS AND SECRETS
      # ==========================================================

      - name: Validate inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:FOLDER_URL) {
              throw 'VWG folder URL is required.'
          }

          if (-not $env:VWG_URL) {
              throw 'VWG_JFROG_URL secret is missing.'
          }

          if (-not $env:VWG_TOKEN) {
              throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if (-not $env:SCOUT_URL) {
              throw 'SCOUT_JFROG_URL secret is missing.'
          }

          if (-not $env:SCOUT_TOKEN) {
              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if (-not $env:CLONE_REPO) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (
              $env:BUILD_TYPE -ne 'daily' -and
              $env:BUILD_TYPE -ne 'official'
          ) {
              throw 'Build Type must be daily or official.'
          }

          if ($env:BUILD_TYPE -eq 'daily') {
              $dailyDate = $env:CALENDAR_WEEK.Trim()

              if ($dailyDate -notmatch '^\d{4}-\d{2}-\d{2}$') {
                  throw (
                      'For Daily builds, Calendar Week must contain ' +
                      'a date in YYYY-MM-DD format.'
                  )
              }

              try {
                  $parsedDate = [datetime]::ParseExact(
                      $dailyDate,
                      'yyyy-MM-dd',
                      [System.Globalization.CultureInfo]::InvariantCulture
                  )
              }
              catch {
                  throw 'The supplied Daily build date is invalid.'
              }

              if (
                  $env:OFFICIAL_TYPE -and
                  $env:OFFICIAL_TYPE -ne 'N/A'
              ) {
                  throw 'Official Type must be N/A for Daily builds.'
              }

              Write-Host ''
              Write-Host 'Build Type: Daily'
              Write-Host "Daily Date: $dailyDate"
          }

          if ($env:BUILD_TYPE -eq 'official') {
              $calendarWeek = (
                  $env:CALENDAR_WEEK.Trim().ToUpperInvariant()
              )

              if ($calendarWeek -notmatch '^CW[0-9]{1,2}$') {
                  throw (
                      'For Official builds, Calendar Week must use ' +
                      'the format CW29, CW35, CW41, etc.'
                  )
              }

              if ($env:OFFICIAL_TYPE -ne 'Release') {
                  throw 'Official Type must be Release.'
              }

              if (-not $env:APPROVAL_URL) {
                  throw (
                      'FVP_APPROVAL_WEBHOOK_URL is required for ' +
                      'Official Release builds.'
                  )
              }

              Write-Host ''
              Write-Host 'Build Type: Official'
              Write-Host "Calendar Week: $calendarWeek"
              Write-Host 'Official Type: Release'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'INPUT VALIDATION SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Folder URL: $env:FOLDER_URL"

      # ==========================================================
      # 4. CONFIGURE VWG JFROG
      # ==========================================================

      - name: Configure VWG JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c remove "$env:VWG_SERVER_ID" --quiet 2>$null

          jf c add `
              "$env:VWG_SERVER_ID" `
              --url="$env:VWG_URL" `
              --access-token="$env:VWG_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure VWG JFrog.'
          }

          jf rt ping --server-id="$env:VWG_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to VWG JFrog.'
          }

          Write-Host 'VWG JFrog connection successful.'

      # ==========================================================
      # 5. CONFIGURE SCOUT JFROG
      # ==========================================================

      - name: Configure Scout JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          jf rt ping --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection successful.'

      # ==========================================================
      # 6. PARSE VWG FOLDER URL
      # ==========================================================

      - name: Parse VWG folder URL
        id: parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $folderUrl = $env:FOLDER_URL.Trim().TrimEnd('/')

          try {
              $sourceUri = [System.Uri]$folderUrl
          }
          catch {
              throw 'The VWG folder URL is invalid.'
          }

          try {
              $configuredUri = [System.Uri]$env:VWG_URL
          }
          catch {
              throw 'VWG_JFROG_URL is invalid.'
          }

          if ($sourceUri.Host -ne $configuredUri.Host) {
              throw (
                  'The source URL does not belong to the ' +
                  'configured VWG JFrog.'
              )
          }

          $artifactoryMarker = '/artifactory/'

          $position = $sourceUri.AbsolutePath.IndexOf(
              $artifactoryMarker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw 'The VWG folder URL must contain /artifactory/.'
          }

          $relativePath = $sourceUri.AbsolutePath.Substring(
              $position + $artifactoryMarker.Length
          )

          $relativePath = [System.Uri]::UnescapeDataString(
              $relativePath
          )

          $relativePath = $relativePath.Replace('\', '/').Trim('/')

          $segments = $relativePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          if ($segments.Count -lt 2) {
              throw (
                  'The VWG URL must include a repository and folder path.'
              )
          }

          $sourceRepo = $segments[0]

          $sourceFolderPath = (
              $segments[1..($segments.Count - 1)] -join '/'
          )

          $sourcePattern = "$sourceRepo/$sourceFolderPath/(*)"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VWG SOURCE FOLDER'
          Write-Host '========================================'
          Write-Host "Repository: $sourceRepo"
          Write-Host "Folder Path: $sourceFolderPath"
          Write-Host "Pattern: $sourcePattern"

          "source_repo=$sourceRepo" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_folder_path=$sourceFolderPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_pattern=$sourcePattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 7. VERIFY VWG SOURCE
      # ==========================================================

      - name: Verify VWG source folder
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_FOLDER_PATH: ${{ steps.parse.outputs.source_folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $searchPattern = (
              "$env:SOURCE_REPO/$env:SOURCE_FOLDER_PATH/*"
          )

          Write-Host "Searching:"
          Write-Host $searchPattern

          jf rt search `
              "$searchPattern" `
              --server-id="$env:VWG_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'No artifacts were found in the VWG folder.'
          }

          Write-Host 'VWG source folder verified.'

      # ==========================================================
      # 8. PREPARE STAGING DIRECTORY
      # ==========================================================

      - name: Prepare local staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:STAGING_DIR) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:STAGING_DIR `
              -Force |
              Out-Null

          Write-Host "Staging directory:"
          Write-Host $env:STAGING_DIR

      # ==========================================================
      # 9. CREATE DOWNLOAD FILE SPEC
      #
      # The source folder itself is not recreated locally.
      # Only its contents are placed in STAGING_DIR.
      # Nested hierarchy is preserved.
      # ==========================================================

      - name: Create VWG download specification
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.parse.outputs.source_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          $downloadSpec = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "vwg-download-${{ github.run_id }}.json"

          $localTarget = (
              $env:STAGING_DIR.TrimEnd('\') + '\{1}'
          )

          $spec = @{
              files = @(
                  @{
                      pattern = $env:SOURCE_PATTERN
                      target = $localTarget
                      recursive = $true
                      flat = $true
                  }
              )
          }

          $spec |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                  -LiteralPath $downloadSpec `
                  -Encoding utf8

          "DOWNLOAD_SPEC=$downloadSpec" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Download specification:"
          Get-Content -LiteralPath $downloadSpec

      # ==========================================================
      # 10. DOWNLOAD VWG FOLDER CONTENTS
      # ==========================================================

      - name: Download VWG folder contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt download `
              --spec="$env:DOWNLOAD_SPEC" `
              --server-id="$env:VWG_SERVER_ID" `
              --fail-no-op=true `
              --threads=1 `
              --split-count=0 `
              --retries=2 `
              --retry-wait-time=10s

          if ($LASTEXITCODE -ne 0) {
              throw 'VWG folder download failed.'
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No files were downloaded from VWG.'
          }

          Write-Host "Downloaded files: $($files.Count)"

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\')

              Write-Host $relativePath
          }

          "FILE_COUNT=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 11. CALCULATE SCOUT CLONE DESTINATION
      #
      # DAILY:
      # Daily_Builds/<YYYY-MM-DD>/
      #
      # OFFICIAL RELEASE:
      # Official_Release/<CW>/Release/
      # ==========================================================

      - name: Calculate Scout Clone destination
        id: destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')

          if ($env:BUILD_TYPE -eq 'daily') {
              $dailyDate = $env:CALENDAR_WEEK.Trim()

              if ($dailyDate -notmatch '^\d{4}-\d{2}-\d{2}$') {
                  throw (
                      'Daily date must use YYYY-MM-DD format.'
                  )
              }

              $destinationPath = "Daily_Builds/$dailyDate"

              $promotionPath = ''

              $approvalBuildType = 'daily'

              Write-Host ''
              Write-Host '========================================'
              Write-Host 'DAILY BUILD DESTINATION'
              Write-Host '========================================'
              Write-Host "Date: $dailyDate"
          }
          elseif ($env:BUILD_TYPE -eq 'official') {
              $calendarWeek = (
                  $env:CALENDAR_WEEK.Trim().ToUpperInvariant()
              )

              if ($calendarWeek -notmatch '^CW[0-9]{1,2}$') {
                  throw (
                      'Official Calendar Week must use CW format.'
                  )
              }

              $destinationPath = (
                  "Official_Release/$calendarWeek/Release"
              )

              $promotionPath = $destinationPath

              $approvalBuildType = 'official-release'

              Write-Host ''
              Write-Host '========================================'
              Write-Host 'OFFICIAL RELEASE DESTINATION'
              Write-Host '========================================'
              Write-Host "Calendar Week: $calendarWeek"
          }
          else {
              throw "Unsupported Build Type: $env:BUILD_TYPE"
          }

          $cloneTarget = "$cloneRepo/$destinationPath"

          Write-Host "Destination:"
          Write-Host $cloneTarget

          "destination_path=$destinationPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "clone_target=$cloneTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "promotion_path=$promotionPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "approval_build_type=$approvalBuildType" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 12. PREVIEW UPLOAD
      # ==========================================================

      - name: Preview Scout Clone upload
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  "./*" `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout upload dry run failed.'
              }
          }
          finally {
              Pop-Location
          }

      # ==========================================================
      # 13. UPLOAD TO SCOUT CLONE
      #
      # Existing matching files use the same target path.
      # New files are added.
      # Nested hierarchy is preserved.
      # ==========================================================

      - name: Upload folder to Scout Clone
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Source:"
          Write-Host $env:STAGING_DIR

          Write-Host "Destination:"
          Write-Host "$env:CLONE_TARGET/"

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  "./*" `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout Clone upload failed.'
              }
          }
          finally {
              Pop-Location
          }

          Write-Host 'Scout Clone upload successful.'

      # ==========================================================
      # 14. VERIFY SCOUT CLONE
      # ==========================================================

      - name: Verify Scout Clone destination
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt search `
              "$env:CLONE_TARGET/*" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout Clone verification failed.'
          }

          Write-Host 'Scout Clone destination verified.'

      # ==========================================================
      # 15. REQUEST FVP APPROVAL FOR OFFICIAL RELEASE ONLY
      #
      # This workflow never copies to FVP.
      # Power Automate is the approval gate.
      # ==========================================================

      - name: Request Official Release FVP approval
        if: ${{ success() && inputs.build_type == 'official' }}
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}

          SOURCE_FOLDER_PATH: >-
            ${{ steps.parse.outputs.source_folder_path }}

          PROMOTION_PATH: >-
            ${{ steps.destination.outputs.promotion_path }}

          APPROVAL_BUILD_TYPE: >-
            ${{ steps.destination.outputs.approval_build_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:APPROVAL_URL) {
              throw 'FVP_APPROVAL_WEBHOOK_URL is missing.'
          }

          $payload = @{
              request_type = 'fvp_root_folder_approval'
              repo_key = $env:CLONE_REPO
              source_repo = $env:SOURCE_REPO
              source_path = $env:SOURCE_FOLDER_PATH
              promotion_path = $env:PROMOTION_PATH
              folder_name = $env:PROMOTION_PATH
              path = $env:PROMOTION_PATH
              build_type = $env:APPROVAL_BUILD_TYPE
              file_count = $env:FILE_COUNT
              requested_by = '${{ github.actor }}'
              github_run_id = '${{ github.run_id }}'
          }

          $json = $payload |
              ConvertTo-Json -Depth 10 -Compress

          Invoke-RestMethod `
              -Uri $env:APPROVAL_URL `
              -Method Post `
              -ContentType 'application/json' `
              -Body $json `
              -ErrorAction Stop

          Write-Host ''
          Write-Host 'Official Release approval request submitted.'
          Write-Host 'This workflow will not copy anything to FVP.'

      # ==========================================================
      # 16. SUMMARY
      # ==========================================================

      - name: Transfer summary
        if: ${{ success() }}
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}

          PROMOTION_PATH: >-
            ${{ steps.destination.outputs.promotion_path }}
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VWG TO SCOUT CLONE SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Build Type: $env:BUILD_TYPE"
          Write-Host "Scout Destination: $env:CLONE_TARGET"
          Write-Host "Files Transferred: $env:FILE_COUNT"

          if ($env:BUILD_TYPE -eq 'official') {
              Write-Host "Promotion Path: $env:PROMOTION_PATH"
              Write-Host 'Approval: SUBMITTED TO POWER AUTOMATE'
              Write-Host 'FVP Copy: NOT PERFORMED HERE'
          }
          else {
              Write-Host 'Daily build complete.'
              Write-Host 'No FVP approval requested.'
          }

      # ==========================================================
      # 17. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if (
              $env:STAGING_DIR -and
              (Test-Path -LiteralPath $env:STAGING_DIR)
          ) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          if (
              $env:DOWNLOAD_SPEC -and
              (Test-Path -LiteralPath $env:DOWNLOAD_SPEC)
          ) {
              Remove-Item `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Force
          }

          jf c remove "$env:VWG_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          Write-Host 'Temporary files and JFrog configurations removed.'
