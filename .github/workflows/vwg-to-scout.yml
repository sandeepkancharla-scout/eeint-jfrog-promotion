name: VWG to Scout Clone

run-name: >-
  VWG to Scout Clone |
  ${{ inputs.build_type }} |
  ${{ inputs.source_repo }}/${{ inputs.source_path }}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "VWG source repository key, for example vw-build-binaries"
        required: true
        type: string

      source_path:
        description: "Artifact or folder path inside the VWG repository"
        required: true
        type: string

      item_type:
        description: "Select whether the source is an artifact or folder"
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - folder

      build_type:
        description: "Select the build type"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - official

      release_folder:
        description: "Required only for Official builds, for example 221 or CW43"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    vwg-to-scout-${{
      inputs.source_repo
    }}-${{
      inputs.source_path
    }}-${{
      inputs.build_type
    }}
  cancel-in-progress: false

jobs:
  transfer-to-scout:
    name: Transfer VWG artifact to Scout Clone
    runs-on: self-hosted
    timeout-minutes: 90

    env:
      VWG_URL: ${{ secrets.VWG_JFROG_URL }}
      VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_PATH: ${{ inputs.source_path }}
      ITEM_TYPE: ${{ inputs.item_type }}
      BUILD_TYPE: ${{ inputs.build_type }}
      RELEASE_FOLDER: ${{ inputs.release_folder }}

      STAGING_DIR: ${{ runner.temp }}\vwg-scout-${{ github.run_id }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-job-summary: true

      - name: Validate inputs and secrets
        shell: cmd
        run: |
          @echo off

          if "%VWG_URL%"=="" (
            echo ERROR: VWG_JFROG_URL is missing.
            exit /b 1
          )

          if "%VWG_TOKEN%"=="" (
            echo ERROR: VWG_JFROG_ACCESS_TOKEN is missing.
            exit /b 1
          )

          if "%SCOUT_URL%"=="" (
            echo ERROR: SCOUT_JFROG_URL is missing.
            exit /b 1
          )

          if "%SCOUT_TOKEN%"=="" (
            echo ERROR: SCOUT_JFROG_ACCESS_TOKEN is missing.
            exit /b 1
          )

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if "%SOURCE_REPO%"=="" (
            echo ERROR: source_repo is required.
            exit /b 1
          )

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          if /I not "%ITEM_TYPE%"=="artifact" (
            if /I not "%ITEM_TYPE%"=="folder" (
              echo ERROR: item_type must be artifact or folder.
              exit /b 1
            )
          )

          if /I not "%BUILD_TYPE%"=="nightly" (
            if /I not "%BUILD_TYPE%"=="official" (
              echo ERROR: build_type must be nightly or official.
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="official" (
            if "%RELEASE_FOLDER%"=="" (
              echo ERROR: release_folder is required for Official builds.
              exit /b 1
            )
          )

          echo ========================================
          echo INPUT VALIDATION SUCCESSFUL
          echo ========================================
          echo Source repository: %SOURCE_REPO%
          echo Source path: %SOURCE_PATH%
          echo Item type: %ITEM_TYPE%
          echo Build type: %BUILD_TYPE%

          if /I "%BUILD_TYPE%"=="official" (
            echo Release folder: %RELEASE_FOLDER%
          ) else (
            echo Release folder: Not required
          )

      - name: Configure VWG and Scout JFrog connections
        shell: cmd
        run: |
          @echo off

          jf c remove vwg-source --quiet >nul 2>&1
          jf c remove scout-target --quiet >nul 2>&1

          jf c add vwg-source ^
            --url="%VWG_URL%" ^
            --access-token="%VWG_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure VWG JFrog.
            exit /b 1
          )

          jf c add scout-target ^
            --url="%SCOUT_URL%" ^
            --access-token="%SCOUT_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure Scout JFrog.
            exit /b 1
          )

          echo Testing VWG JFrog connection...

          jf rt ping --server-id=vwg-source

          if errorlevel 1 (
            echo ERROR: Unable to connect to VWG JFrog.
            exit /b 1
          )

          echo Testing Scout JFrog connection...

          jf rt ping --server-id=scout-target

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo Both JFrog connections are working.

      - name: Prepare staging directory
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          mkdir "%STAGING_DIR%"

          if errorlevel 1 (
            echo ERROR: Unable to create staging directory.
            exit /b 1
          )

          echo Staging directory:
          echo %STAGING_DIR%

      - name: Verify VWG artifact exists
        if: inputs.item_type == 'artifact'
        shell: cmd
        run: |
          @echo off

          jf rt search ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --server-id=vwg-source ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG artifact was not found.
            echo Source:
            echo %SOURCE_REPO%/%SOURCE_PATH%
            exit /b 1
          )

          echo VWG artifact exists.

      - name: Verify VWG folder exists
        if: inputs.item_type == 'folder'
        shell: cmd
        run: |
          @echo off

          jf rt search ^
            "%SOURCE_REPO%/%SOURCE_PATH%/*" ^
            --server-id=vwg-source ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG folder was not found or is empty.
            echo Source:
            echo %SOURCE_REPO%/%SOURCE_PATH%/
            exit /b 1
          )

          echo VWG folder exists.

      - name: Download artifact from VWG
        if: inputs.item_type == 'artifact'
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo DOWNLOADING ARTIFACT FROM VWG
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%
          echo.

          jf rt download ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%STAGING_DIR%/" ^
            --server-id=vwg-source ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG artifact download failed.
            exit /b 1
          )

          echo Artifact downloaded successfully.

      - name: Download folder from VWG
        if: inputs.item_type == 'folder'
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo DOWNLOADING FOLDER FROM VWG
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%/
          echo.

          jf rt download ^
            "%SOURCE_REPO%/%SOURCE_PATH%/(*)" ^
            "%STAGING_DIR%/{1}" ^
            --server-id=vwg-source ^
            --flat=true ^
            --recursive=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG folder download failed.
            exit /b 1
          )

          echo Folder downloaded successfully.

      - name: Calculate Scout Clone destination
        id: destination
        shell: cmd
        run: |
          @echo off

          if /I "%BUILD_TYPE%"=="nightly" (
            echo destination_path=Daily_Builds/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"

            echo Build type: Nightly
            echo Destination:
            echo %CLONE_REPO%/Daily_Builds/%SOURCE_PATH%

            exit /b 0
          )

          if /I "%BUILD_TYPE%"=="official" (
            echo destination_path=Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"

            echo Build type: Official
            echo Release folder: %RELEASE_FOLDER%
            echo Destination:
            echo %CLONE_REPO%/Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%

            exit /b 0
          )

          echo ERROR: Unsupported build type.
          exit /b 1

      - name: Upload Nightly artifact to Scout Clone
        if: inputs.build_type == 'nightly' && inputs.item_type == 'artifact'
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo ========================================
          echo UPLOADING NIGHTLY ARTIFACT
          echo ========================================
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%
          echo.

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly artifact upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly artifact verification failed.
            exit /b 1
          )

          echo.
          echo NIGHTLY ARTIFACT TRANSFER SUCCESSFUL
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%
          echo.
          echo No FVP approval is required.

      - name: Upload Nightly folder to Scout Clone
        if: inputs.build_type == 'nightly' && inputs.item_type == 'folder'
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo ========================================
          echo UPLOADING NIGHTLY FOLDER
          echo ========================================
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%/
          echo.

          jf rt upload ^
            "%STAGING_DIR%\(*)" ^
            "%CLONE_REPO%/%DESTINATION_PATH%/{1}" ^
            --server-id=scout-target ^
            --flat=true ^
            --recursive=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly folder upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%/*" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly folder verification failed.
            exit /b 1
          )

          echo.
          echo NIGHTLY FOLDER TRANSFER SUCCESSFUL
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%/
          echo.
          echo No FVP approval is required.

      - name: Upload Official artifact to Scout Clone
        if: inputs.build_type == 'official' && inputs.item_type == 'artifact'
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo ========================================
          echo UPLOADING OFFICIAL ARTIFACT
          echo ========================================
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%
          echo.

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official artifact upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official artifact verification failed.
            exit /b 1
          )

          echo OFFICIAL ARTIFACT TRANSFER SUCCESSFUL

      - name: Upload Official folder to Scout Clone
        if: inputs.build_type == 'official' && inputs.item_type == 'folder'
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo ========================================
          echo UPLOADING OFFICIAL FOLDER
          echo ========================================
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%/
          echo.

          jf rt upload ^
            "%STAGING_DIR%\(*)" ^
            "%CLONE_REPO%/%DESTINATION_PATH%/{1}" ^
            --server-id=scout-target ^
            --flat=true ^
            --recursive=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official folder upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%/*" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official folder verification failed.
            exit /b 1
          )

          echo OFFICIAL FOLDER TRANSFER SUCCESSFUL

      - name: Request FVP approval
        if: success() && inputs.build_type == 'official'
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing.
            exit /b 1
          )

          echo Sending FVP approval request...

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%RELEASE_FOLDER%\",\"promotion_path\":\"%DESTINATION_PATH%\",\"requested_by\":\"${{ github.actor }}\",\"item_type\":\"%ITEM_TYPE%\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: FVP approval request failed.
            exit /b 1
          )

          echo.
          echo FVP approval request submitted successfully.
          echo Scout Clone path:
          echo %CLONE_REPO%/%DESTINATION_PATH%

      - name: Clean staging directory
        if: always()
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          jf c remove vwg-source --quiet >nul 2>&1
          jf c remove scout-target --quiet >nul 2>&1

          echo Staging directory and temporary JFrog configurations removed.
