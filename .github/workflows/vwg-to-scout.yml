name: VWG to Scout Clone

run-name: VWG to Scout | ${{ inputs.build_type }} | ${{ inputs.calendar_week }}

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Full VWG JFrog source folder URL"
        required: true
        type: string
      build_type:
        description: "Select build type"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - official
      calendar_week:
        description: "Daily: YYYY-MM-DD. Official: unrestricted CW/OTA folder string"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vwg-to-scout-${{ inputs.build_type }}-${{ inputs.calendar_week }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer VWG Folder to Scout Clone
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 120

    env:
      FOLDER_URL: ${{ inputs.folder_url }}
      BUILD_TYPE: ${{ inputs.build_type }}
      CALENDAR_WEEK: ${{ inputs.calendar_week }}
      VWG_URL: ${{ secrets.VWG_JFROG_URL }}
      VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}
      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
      VWG_SERVER_ID: vwg-source
      SCOUT_SERVER_ID: scout-target
      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          jf --version
          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

      - name: Set temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stagingDirectory = Join-Path $env:RUNNER_TEMP "vwg-scout-${{ github.run_id }}"
          "STAGING_DIR=$stagingDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Temporary directory: $stagingDirectory"

      - name: Validate inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @{
              'folder_url' = $env:FOLDER_URL
              'VWG_JFROG_URL' = $env:VWG_URL
              'VWG_JFROG_ACCESS_TOKEN' = $env:VWG_TOKEN
              'SCOUT_JFROG_URL' = $env:SCOUT_URL
              'SCOUT_JFROG_ACCESS_TOKEN' = $env:SCOUT_TOKEN
              'SCOUT_CLONE_REPO' = $env:CLONE_REPO
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
              if ([System.String]::IsNullOrWhiteSpace([string]$entry.Value)) {
                  throw "$($entry.Key) is missing or empty."
              }
          }

          if ($env:BUILD_TYPE -notin @('daily', 'official')) {
              throw 'Build type must be daily or official.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:CALENDAR_WEEK)) {
              throw 'calendar_week is required.'
          }

          if ($env:BUILD_TYPE -eq 'daily') {
              $dailyDate = $env:CALENDAR_WEEK.Trim()
              $parsedDate = [datetime]::MinValue
              $validDate = [datetime]::TryParseExact(
                  $dailyDate,
                  'yyyy-MM-dd',
                  [System.Globalization.CultureInfo]::InvariantCulture,
                  [System.Globalization.DateTimeStyles]::None,
                  [ref]$parsedDate
              )
              if (-not $validDate) {
                  throw 'For Daily builds, enter a valid date in YYYY-MM-DD format.'
              }
          }
          else {
              $officialFolder = $env:CALENDAR_WEEK.Trim()
              if ($officialFolder.Contains('/') -or $officialFolder.Contains('\')) {
                  throw 'Official folder input cannot contain slash characters.'
              }
              if ([System.String]::IsNullOrWhiteSpace($env:APPROVAL_URL)) {
                  throw 'FVP_APPROVAL_WEBHOOK_URL is required for Official builds.'
              }
          }

          Write-Host 'Input validation successful.'
          Write-Host "Build type: $env:BUILD_TYPE"
          Write-Host "Daily/CW input: $env:CALENDAR_WEEK"

      - name: Clean existing JFrog configurations
        shell: pwsh
        continue-on-error: true
        run: |
          jf c remove "$env:VWG_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

      - name: Configure VWG JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configArgs = @(
              'c', 'add', $env:VWG_SERVER_ID,
              "--url=$env:VWG_URL",
              "--access-token=$env:VWG_TOKEN",
              '--interactive=false',
              '--overwrite=true'
          )
          & jf @configArgs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure VWG JFrog.' }
          & jf rt ping "--server-id=$env:VWG_SERVER_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot connect to VWG JFrog.' }

      - name: Configure Scout JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configArgs = @(
              'c', 'add', $env:SCOUT_SERVER_ID,
              "--url=$env:SCOUT_URL",
              "--access-token=$env:SCOUT_TOKEN",
              '--interactive=false',
              '--overwrite=true'
          )
          & jf @configArgs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure Scout JFrog.' }
          & jf rt ping "--server-id=$env:SCOUT_SERVER_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot connect to Scout JFrog.' }

      - name: Parse VWG folder URL
        id: parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folderUrl = $env:FOLDER_URL.Trim().TrimEnd('/')
          try {
              $sourceUri = [System.Uri]$folderUrl
              $configuredUri = [System.Uri]$env:VWG_URL
          }
          catch {
              throw 'The VWG source URL or VWG_JFROG_URL is invalid.'
          }
          if (-not $sourceUri.IsAbsoluteUri -or -not $configuredUri.IsAbsoluteUri) {
              throw 'JFrog URLs must be absolute URLs.'
          }
          if ($sourceUri.Host -ne $configuredUri.Host) {
              throw 'The source URL does not belong to the configured VWG JFrog.'
          }
          $marker = '/artifactory/'
          $position = $sourceUri.AbsolutePath.IndexOf($marker, [System.StringComparison]::OrdinalIgnoreCase)
          if ($position -lt 0) { throw 'The source URL must contain /artifactory/.' }
          $relativePath = $sourceUri.AbsolutePath.Substring($position + $marker.Length)
          $relativePath = [System.Uri]::UnescapeDataString($relativePath).Replace('\', '/').Trim('/')
          $segments = $relativePath.Split('/', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($segments.Count -lt 2) { throw 'The source URL must include a repository and folder path.' }
          $sourceRepo = $segments[0]
          $sourceFolderPath = $segments[1..($segments.Count - 1)] -join '/'
          $sourcePattern = "$sourceRepo/$sourceFolderPath/*"
          Write-Host "Source repository: $sourceRepo"
          Write-Host "Source folder: $sourceFolderPath"
          Write-Host "Source pattern: $sourcePattern"
          "source_repo=$sourceRepo" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_folder_path=$sourceFolderPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_pattern=$sourcePattern" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify VWG source folder
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.parse.outputs.source_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'
          $searchArgs = @(
              'rt', 'search', $env:SOURCE_PATTERN,
              "--server-id=$env:VWG_SERVER_ID",
              '--recursive=true',
              '--include-dirs=false',
              '--fail-no-op=true',
              '--limit=1'
          )
          & jf @searchArgs
          if ($LASTEXITCODE -ne 0) { throw 'No artifacts were found in the VWG folder.' }

      - name: Prepare local staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:STAGING_DIR) {
              Remove-Item -LiteralPath $env:STAGING_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:STAGING_DIR -Force | Out-Null

      - name: Download VWG folder
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.parse.outputs.source_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadArgs = @(
              'rt', 'download',
              $env:SOURCE_PATTERN,
              "$env:STAGING_DIR/",
              "--server-id=$env:VWG_SERVER_ID",
              '--recursive=true',
              '--flat=false',
              '--include-dirs=true',
              '--fail-no-op=true',
              '--threads=1',
              '--split-count=0',
              '--retries=2',
              '--retry-wait-time=10s'
          )
          & jf @downloadArgs
          if ($LASTEXITCODE -ne 0) { throw 'VWG folder download failed.' }
          $files = @(Get-ChildItem -LiteralPath $env:STAGING_DIR -Recurse -File)
          if ($files.Count -eq 0) { throw 'No files were downloaded from VWG.' }
          "FILE_COUNT=$($files.Count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Downloaded files: $($files.Count)"

      - name: Confirm downloaded VWG hierarchy
        id: local
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $env:STAGING_DIR -Recurse -File)
          if ($files.Count -eq 0) { throw 'Downloaded staging hierarchy is empty.' }
          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring($env:STAGING_DIR.Length).TrimStart('\', '/')
              Write-Host $relativePath
          }
          "upload_root=$env:STAGING_DIR" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Calculate Scout Clone destination
        id: destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')
          if ([System.String]::IsNullOrWhiteSpace($cloneRepo)) {
              throw 'SCOUT_CLONE_REPO is empty.'
          }
          if ($env:BUILD_TYPE -eq 'daily') {
              $value = $env:CALENDAR_WEEK.Trim()
              $destinationPath = "Daily_Builds/$value"
              $promotionPath = ''
              $approvalBuildType = 'daily'
          }
          else {
              $value = $env:CALENDAR_WEEK.Trim()
              $destinationPath = "Official_Release/$value/Release"
              $promotionPath = $destinationPath
              $approvalBuildType = 'official-release'
          }
          $cloneTarget = "$cloneRepo/$destinationPath"
          Write-Host "Scout target: $cloneTarget"
          "destination_path=$destinationPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "clone_target=$cloneTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "promotion_path=$promotionPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "approval_build_type=$approvalBuildType" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check existing Daily destination
        if: ${{ inputs.build_type == 'daily' }}
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $searchPattern = "$env:CLONE_TARGET/*"
          $searchArgs = @(
              'rt', 'search', $searchPattern,
              "--server-id=$env:SCOUT_SERVER_ID",
              '--recursive=true',
              '--include-dirs=false',
              '--limit=1'
          )
          $previousLogLevel = $env:JFROG_CLI_LOG_LEVEL
          $env:JFROG_CLI_LOG_LEVEL = 'ERROR'
          try {
              $result = @(& jf @searchArgs)
              $exitCode = $LASTEXITCODE
          }
          finally {
              $env:JFROG_CLI_LOG_LEVEL = $previousLogLevel
          }
          if ($exitCode -ne 0) { throw 'Failed while checking Daily build destination.' }
          $resultText = ($result -join [System.Environment]::NewLine).Trim()
          if ([System.String]::IsNullOrWhiteSpace($resultText) -or $resultText -eq '[]') {
              Write-Host 'Daily date folder does not exist. Upload will create it.'
          }
          else {
              Write-Host 'Daily date folder exists. New content will be merged without deletion.'
          }

      - name: Preview Scout Clone upload
        shell: pwsh
        env:
          UPLOAD_ROOT: ${{ steps.local.outputs.upload_root }}
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:UPLOAD_ROOT
          try {
              $uploadArgs = @(
                  'rt', 'upload', './*', "$env:CLONE_TARGET/",
                  "--server-id=$env:SCOUT_SERVER_ID",
                  '--recursive=true',
                  '--flat=false',
                  '--dry-run'
              )
              & jf @uploadArgs
              if ($LASTEXITCODE -ne 0) { throw 'Scout Clone upload dry run failed.' }
          }
          finally {
              Pop-Location
          }

      - name: Upload folder to Scout Clone
        shell: pwsh
        env:
          UPLOAD_ROOT: ${{ steps.local.outputs.upload_root }}
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $env:UPLOAD_ROOT -Recurse -File)
          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          if ($null -eq $totalBytes) { $totalBytes = 0 }
          $totalGB = [System.Math]::Round(($totalBytes / 1GB), 2)
          Write-Host '========================================'
          Write-Host 'UPLOAD VWG HIERARCHY TO SCOUT CLONE'
          Write-Host '========================================'
          Write-Host "Files to upload: $($files.Count)"
          Write-Host "Total size: $totalGB GB"
          Write-Host "Source: $env:UPLOAD_ROOT"
          Write-Host "Destination: $env:CLONE_TARGET/"
          Write-Host 'Mode: MERGE WITHOUT REMOTE DELETE'
          Push-Location $env:UPLOAD_ROOT
          try {
              $uploadArgs = @(
                  'rt', 'upload', './*', "$env:CLONE_TARGET/",
                  "--server-id=$env:SCOUT_SERVER_ID",
                  '--recursive=true',
                  '--flat=false',
                  '--fail-no-op=true',
                  '--threads=8',
                  '--retries=3',
                  '--retry-wait-time=5s'
              )
              & jf @uploadArgs
              if ($LASTEXITCODE -ne 0) { throw 'Scout Clone upload failed.' }
          }
          finally {
              Pop-Location
          }
          Write-Host 'Scout Clone upload completed.'
          Write-Host 'Existing destination content was preserved.'

      - name: Verify Scout Clone destination
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verificationPattern = "$env:CLONE_TARGET/*"
          $searchArgs = @(
              'rt', 'search', $verificationPattern,
              "--server-id=$env:SCOUT_SERVER_ID",
              '--recursive=true',
              '--include-dirs=false',
              '--fail-no-op=true',
              '--limit=1'
          )
          & jf @searchArgs
          if ($LASTEXITCODE -ne 0) { throw 'Scout Clone destination verification failed.' }

      - name: Request Official Release FVP approval
        if: ${{ success() && inputs.build_type == 'official' }}
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_FOLDER_PATH: ${{ steps.parse.outputs.source_folder_path }}
          PROMOTION_PATH: ${{ steps.destination.outputs.promotion_path }}
          APPROVAL_BUILD_TYPE: ${{ steps.destination.outputs.approval_build_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
              request_type = 'fvp_root_folder_approval'
              repo_key = $env:CLONE_REPO
              source_repo = $env:SOURCE_REPO
              source_path = $env:SOURCE_FOLDER_PATH
              promotion_path = $env:PROMOTION_PATH
              folder_name = $env:PROMOTION_PATH
              path = $env:PROMOTION_PATH
              build_type = $env:APPROVAL_BUILD_TYPE
              file_count = $env:FILE_COUNT
              requested_by = '${{ github.actor }}'
              github_run_id = '${{ github.run_id }}'
          }
          $json = $payload | ConvertTo-Json -Depth 10 -Compress
          Invoke-RestMethod -Uri $env:APPROVAL_URL -Method Post -ContentType 'application/json' -Body $json -ErrorAction Stop
          Write-Host 'Official Release approval request submitted.'

      - name: Transfer summary
        if: ${{ success() }}
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_FOLDER_PATH: ${{ steps.parse.outputs.source_folder_path }}
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
          PROMOTION_PATH: ${{ steps.destination.outputs.promotion_path }}
        run: |
          Write-Host '========================================'
          Write-Host 'VWG TO SCOUT CLONE SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Build type: $env:BUILD_TYPE"
          Write-Host "Source: $env:SOURCE_REPO/$env:SOURCE_FOLDER_PATH"
          Write-Host "Destination: $env:CLONE_TARGET"
          Write-Host "Files transferred: $env:FILE_COUNT"
          Write-Host 'Existing destination content: PRESERVED'
          Write-Host 'Remote delete: NOT PERFORMED'
          if ($env:BUILD_TYPE -eq 'official') {
              Write-Host "Promotion path: $env:PROMOTION_PATH"
              Write-Host 'Approval: SUBMITTED TO POWER AUTOMATE'
          }

      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if ($env:STAGING_DIR -and (Test-Path -LiteralPath $env:STAGING_DIR)) {
              Remove-Item -LiteralPath $env:STAGING_DIR -Recurse -Force
          }
          jf c remove "$env:VWG_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null
          Write-Host 'Temporary local files and JFrog configurations removed.'
          Write-Host 'No remote Scout content was deleted.'
