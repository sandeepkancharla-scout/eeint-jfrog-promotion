name: VWG to Scout Clone

run-name: >-
  VWG to Scout Clone |
  ${{ inputs.build_type }} |
  ${{ inputs.file_url }}

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "VWG JFrog file URL"
        required: true
        type: string

      build_type:
        description: "Select Nightly or Official release"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - official

      release_folder:
        description: "Release / CW number - required only for Official"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vwg-to-scout-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  transfer-to-scout:
    name: Transfer VWG File to Scout Clone
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      FILE_URL: ${{ inputs.file_url }}
      BUILD_TYPE: ${{ inputs.build_type }}
      RELEASE_FOLDER: ${{ inputs.release_folder }}

      VWG_URL: ${{ secrets.VWG_JFROG_URL }}
      VWG_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      STAGING_DIR: ${{ runner.temp }}\vwg-scout-${{ github.run_id }}

    steps:

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-job-summary: true

      # =====================================================
      # VALIDATE INPUTS
      # =====================================================

      - name: Validate inputs
        shell: cmd
        run: |
          @echo off

          if "%FILE_URL%"=="" (
            echo ERROR: VWG file URL is required.
            exit /b 1
          )

          if /I not "%BUILD_TYPE%"=="nightly" (
            if /I not "%BUILD_TYPE%"=="official" (
              echo ERROR: Build type must be nightly or official.
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="official" (
            if "%RELEASE_FOLDER%"=="" (
              echo ERROR: Release / CW number is required for Official releases.
              exit /b 1
            )
          )

          echo ========================================
          echo INPUTS
          echo ========================================
          echo VWG File URL:
          echo %FILE_URL%
          echo.
          echo Build Type:
          echo %BUILD_TYPE%

          if /I "%BUILD_TYPE%"=="official" (
            echo Release / CW:
            echo %RELEASE_FOLDER%
          ) else (
            echo Release / CW:
            echo Not required for Nightly
          )

      # =====================================================
      # PARSE VWG URL
      # =====================================================

      - name: Parse VWG file URL
        id: parse
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "FULL_URL=%FILE_URL%"

          set "PREFIX=https://jfrog.rivianvw.io/artifactory/"

          set "RELATIVE=!FULL_URL:%PREFIX%=!"

          if "!RELATIVE!"=="!FULL_URL!" (
            echo ERROR: The provided URL is not a supported VWG Artifactory URL.
            echo.
            echo Expected format:
            echo https://jfrog.rivianvw.io/artifactory/REPOSITORY/PATH/FILE
            exit /b 1
          )

          for /f "tokens=1,* delims=/" %%A in ("!RELATIVE!") do (
            set "SOURCE_REPO=%%A"
            set "SOURCE_PATH=%%B"
          )

          if "!SOURCE_REPO!"=="" (
            echo ERROR: Unable to determine VWG repository from URL.
            exit /b 1
          )

          if "!SOURCE_PATH!"=="" (
            echo ERROR: Unable to determine artifact path from URL.
            exit /b 1
          )

          for %%F in ("!SOURCE_PATH!") do (
            set "FILE_NAME=%%~nxF"
          )

          echo ========================================
          echo PARSED VWG SOURCE
          echo ========================================
          echo Repository:
          echo !SOURCE_REPO!
          echo.
          echo Artifact Path:
          echo !SOURCE_PATH!
          echo.
          echo File Name:
          echo !FILE_NAME!

          echo source_repo=!SOURCE_REPO!>>"%GITHUB_OUTPUT%"
          echo source_path=!SOURCE_PATH!>>"%GITHUB_OUTPUT%"
          echo file_name=!FILE_NAME!>>"%GITHUB_OUTPUT%"

          endlocal

      # =====================================================
      # CONFIGURE BOTH JFROG INSTANCES
      # =====================================================

      - name: Configure VWG and Scout JFrog
        shell: cmd
        run: |
          @echo off

          jf c remove vwg-source --quiet >nul 2>&1
          jf c remove scout-target --quiet >nul 2>&1

          jf c add vwg-source ^
            --url="%VWG_URL%" ^
            --access-token="%VWG_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure VWG JFrog.
            exit /b 1
          )

          jf c add scout-target ^
            --url="%SCOUT_URL%" ^
            --access-token="%SCOUT_TOKEN%" ^
            --interactive=false

          if errorlevel 1 (
            echo ERROR: Failed to configure Scout JFrog.
            exit /b 1
          )

      # =====================================================
      # TEST CONNECTIONS
      # =====================================================

      - name: Test VWG JFrog connection
        shell: cmd
        run: |
          @echo off

          jf rt ping --server-id=vwg-source

          if errorlevel 1 (
            echo ERROR: Unable to connect to VWG JFrog.
            exit /b 1
          )

          echo VWG JFrog connection successful.

      - name: Test Scout JFrog connection
        shell: cmd
        run: |
          @echo off

          jf rt ping --server-id=scout-target

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo Scout JFrog connection successful.

      # =====================================================
      # CREATE TEMP STAGING DIRECTORY
      # =====================================================

      - name: Prepare staging directory
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          mkdir "%STAGING_DIR%"

          if errorlevel 1 (
            echo ERROR: Unable to create staging directory.
            exit /b 1
          )

      # =====================================================
      # CHECK SOURCE EXISTS
      # =====================================================

      - name: Verify VWG artifact exists
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          echo Checking:
          echo %SOURCE_REPO%/%SOURCE_PATH%

          jf rt search ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --server-id=vwg-source ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Artifact does not exist in VWG JFrog.
            exit /b 1
          )

          echo VWG artifact found.

      # =====================================================
      # DOWNLOAD FROM VWG
      # =====================================================

      - name: Download artifact from VWG
        shell: cmd
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          echo ========================================
          echo DOWNLOADING FROM VWG
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%
          echo.

          jf rt download ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%STAGING_DIR%/" ^
            --server-id=vwg-source ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: VWG download failed.
            exit /b 1
          )

          echo VWG download successful.

      # =====================================================
      # CALCULATE DESTINATION
      # =====================================================

      - name: Calculate Scout Clone destination
        id: destination
        shell: cmd
        env:
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
        run: |
          @echo off

          if /I "%BUILD_TYPE%"=="nightly" (
            echo destination_path=Daily_Builds/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"

            echo ========================================
            echo NIGHTLY DESTINATION
            echo ========================================
            echo %CLONE_REPO%/Daily_Builds/%SOURCE_PATH%

            exit /b 0
          )

          if /I "%BUILD_TYPE%"=="official" (
            echo destination_path=Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%>>"%GITHUB_OUTPUT%"

            echo ========================================
            echo OFFICIAL DESTINATION
            echo ========================================
            echo %CLONE_REPO%/Official_Release/%RELEASE_FOLDER%/%SOURCE_PATH%

            exit /b 0
          )

          echo ERROR: Unsupported build type.
          exit /b 1

      # =====================================================
      # NIGHTLY
      # =====================================================

      - name: Upload Nightly artifact to Scout Clone
        if: inputs.build_type == 'nightly'
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo ========================================
          echo UPLOADING NIGHTLY BUILD
          echo ========================================
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%
          echo.

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly destination verification failed.
            exit /b 1
          )

          echo.
          echo ========================================
          echo NIGHTLY TRANSFER SUCCESSFUL
          echo ========================================
          echo %CLONE_REPO%/%DESTINATION_PATH%
          echo.
          echo No FVP approval required.

      # =====================================================
      # OFFICIAL
      # =====================================================

      - name: Upload Official artifact to Scout Clone
        if: inputs.build_type == 'official'
        shell: cmd
        env:
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          echo ========================================
          echo UPLOADING OFFICIAL RELEASE
          echo ========================================
          echo Destination:
          echo %CLONE_REPO%/%DESTINATION_PATH%
          echo.

          jf rt upload ^
            "%STAGING_DIR%\*" ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official upload failed.
            exit /b 1
          )

          jf rt search ^
            "%CLONE_REPO%/%DESTINATION_PATH%" ^
            --server-id=scout-target ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official destination verification failed.
            exit /b 1
          )

          echo.
          echo OFFICIAL RELEASE TRANSFER SUCCESSFUL.

      # =====================================================
      # OFFICIAL ONLY: REQUEST FVP APPROVAL
      # =====================================================

      - name: Request FVP approval
        if: success() && inputs.build_type == 'official'
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.parse.outputs.source_path }}
          DESTINATION_PATH: ${{ steps.destination.outputs.destination_path }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing.
            exit /b 1
          )

          echo Sending FVP approval request...

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%RELEASE_FOLDER%\",\"promotion_path\":\"%DESTINATION_PATH%\",\"requested_by\":\"${{ github.actor }}\",\"item_type\":\"artifact\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: FVP approval request failed.
            exit /b 1
          )

          echo.
          echo FVP approval request submitted successfully.
          echo.
          echo Scout Clone artifact:
          echo %CLONE_REPO%/%DESTINATION_PATH%

      # =====================================================
      # CLEANUP
      # =====================================================

      - name: Cleanup
        if: always()
        shell: cmd
        run: |
          @echo off

          if exist "%STAGING_DIR%" (
            rmdir /S /Q "%STAGING_DIR%"
          )

          jf c remove vwg-source --quiet >nul 2>&1
          jf c remove scout-target --quiet >nul 2>&1

          echo Cleanup complete.
