name: POC - Approved Official to FVP

run-name: >-
  POC Clone to FVP |
  ${{ github.event.client_payload.calendar_week || inputs.calendar_week }} |
  ${{ github.event.client_payload.promotion_path || inputs.promotion_path }}

on:
  workflow_dispatch:
    inputs:
      promotion_path:
        description: "Official path inside Scout Clone"
        required: true
        type: string

      calendar_week:
        description: "Calendar week, for example CW43"
        required: true
        type: string

      requested_by:
        description: "Original requester"
        required: false
        default: "Manual GitHub run"
        type: string

      approved_by:
        description: "Approver"
        required: false
        default: "Manual GitHub run"
        type: string

  repository_dispatch:
    types:
      - poc-fvp-promotion-approved

permissions:
  contents: read

concurrency:
  group: >-
    poc-clone-to-fvp-${{
      github.event.client_payload.promotion_path ||
      inputs.promotion_path ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  promote-to-fvp:
    name: Promote approved Official artifact to FVP
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Verify required secrets
        shell: cmd
        run: |
          @echo off

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing or empty.
            exit /b 1
          )

          if "%FVP_REPO%"=="" (
            echo ERROR: SCOUT_FVP_REPO is missing or empty.
            exit /b 1
          )

          if "${{ secrets.SCOUT_JFROG_URL }}"=="" (
            echo ERROR: SCOUT_JFROG_URL is missing or empty.
            exit /b 1
          )

          if "${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}"=="" (
            echo ERROR: SCOUT_JFROG_ACCESS_TOKEN is missing or empty.
            exit /b 1
          )

          echo Required secrets are configured.

      - name: Verify JFrog connection
        shell: cmd
        run: |
          @echo off

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo JFrog connection successful.

      # =========================================================
      # REPOSITORY DISPATCH PROMOTION
      # =========================================================

      - name: Validate dispatched promotion request
        if: github.event_name == 'repository_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ github.event.client_payload.promotion_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if "%CALENDAR_WEEK%"=="" (
            echo ERROR: calendar_week is required.
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /B /I /C:"official/%CALENDAR_WEEK%/" >nul
          if errorlevel 1 (
            echo ERROR: promotion_path must start with official/%CALENDAR_WEEK%/
            echo Received: %PROMOTION_PATH%
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /C:".." >nul
          if not errorlevel 1 (
            echo ERROR: promotion_path cannot contain two consecutive dots.
            exit /b 1
          )

          echo %CALENDAR_WEEK% | findstr /R /X /C:"CW[1-9]" /C:"CW[1-4][0-9]" /C:"CW5[0-3]" >nul
          if errorlevel 1 (
            echo ERROR: Calendar Week must be CW1 through CW53.
            exit /b 1
          )

          echo Dispatched promotion request validated.

      - name: Promote dispatched Official artifact
        if: github.event_name == 'repository_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ github.event.client_payload.promotion_path }}
          FVP_PATH: ${{ github.event.client_payload.fvp_path }}
        run: |
          @echo off

          if "%FVP_PATH%"=="" (
            echo ERROR: fvp_path is required in the approval dispatch payload.
            exit /b 1
          )

          echo ========================================
          echo APPROVED OFFICIAL PROMOTION
          echo ========================================
          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%
          echo.
          echo Destination:
          echo %FVP_REPO%/%FVP_PATH%
          echo.

          jf rt s "%CLONE_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Approved Official artifact was not found.
            exit /b 1
          )

          jf rt cp ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            "%FVP_REPO%/%FVP_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP promotion copy failed.
            exit /b 1
          )

          jf rt s "%FVP_REPO%/%FVP_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP destination verification failed.
            exit /b 1
          )

          echo.
          echo FVP PROMOTION SUCCESSFUL

      # =========================================================
      # MANUAL PROMOTION
      # =========================================================

      - name: Validate manual promotion request
        if: github.event_name == 'workflow_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ inputs.promotion_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if "%CALENDAR_WEEK%"=="" (
            echo ERROR: calendar_week is required.
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /B /I /C:"official/%CALENDAR_WEEK%/" >nul
          if errorlevel 1 (
            echo ERROR: promotion_path must start with official/%CALENDAR_WEEK%/
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /C:".." >nul
          if not errorlevel 1 (
            echo ERROR: promotion_path cannot contain two consecutive dots.
            exit /b 1
          )

          echo %CALENDAR_WEEK% | findstr /R /X /C:"CW[1-9]" /C:"CW[1-4][0-9]" /C:"CW5[0-3]" >nul
          if errorlevel 1 (
            echo ERROR: Calendar Week must be CW1 through CW53.
            exit /b 1
          )

          echo Manual promotion request validated.

      - name: Promote manual Official artifact
        if: github.event_name == 'workflow_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ inputs.promotion_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "PREFIX=official/%CALENDAR_WEEK%/"
          set "RELATIVE_PATH=%PROMOTION_PATH:*official/%CALENDAR_WEEK%/=%"
          set "FVP_PATH=%CALENDAR_WEEK%/!RELATIVE_PATH!"

          if "!RELATIVE_PATH!"=="" (
            echo ERROR: Unable to determine the FVP relative path.
            exit /b 1
          )

          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%
          echo.
          echo Destination:
          echo %FVP_REPO%/!FVP_PATH!
          echo.

          jf rt s "%CLONE_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Approved Official artifact was not found.
            exit /b 1
          )

          jf rt cp ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            "%FVP_REPO%/!FVP_PATH!" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Manual FVP promotion failed.
            exit /b 1
          )

          jf rt s "%FVP_REPO%/!FVP_PATH!" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP destination verification failed.
            exit /b 1
          )

          echo.
          echo MANUAL FVP PROMOTION SUCCESSFUL

          endlocal
