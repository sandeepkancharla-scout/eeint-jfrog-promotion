name: POC - Approved Official to FVP

run-name: >-
  POC Clone to FVP |
  ${{ github.event.client_payload.calendar_week || inputs.calendar_week }} |
  ${{ github.event.client_payload.promotion_path || inputs.promotion_path }}

on:
  workflow_dispatch:
    inputs:
      promotion_path:
        description: "Official_Release path inside Scout Clone"
        required: true
        type: string

      calendar_week:
        description: "Release folder"
        required: true
        type: string

      requested_by:
        description: "Original requester"
        required: false
        default: "Manual GitHub run"
        type: string

  repository_dispatch:
    types:
      - poc-fvp-promotion-approved

permissions:
  contents: read

concurrency:
  group: >-
    poc-clone-to-fvp-${{
      github.event.client_payload.promotion_path ||
      inputs.promotion_path ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  promote-to-fvp:
    name: Promote approved Official artifact to FVP
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Verify configuration
        shell: cmd
        run: |
          @echo off

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if "%FVP_REPO%"=="" (
            echo ERROR: SCOUT_FVP_REPO is missing.
            exit /b 1
          )

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo Configuration validated successfully.

      # =====================================================
      # APPROVED REPOSITORY DISPATCH
      # =====================================================

      - name: Validate approved promotion request
        if: github.event_name == 'repository_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ github.event.client_payload.promotion_path }}
          RELEASE_FOLDER: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if "%RELEASE_FOLDER%"=="" (
            echo ERROR: Release folder is required.
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /B /I /C:"Official_Release/%RELEASE_FOLDER%/" >nul

          if errorlevel 1 (
            echo ERROR: promotion_path does not match the Official Release folder.
            echo Expected prefix:
            echo Official_Release/%RELEASE_FOLDER%/
            echo Received:
            echo %PROMOTION_PATH%
            exit /b 1
          )

          echo Promotion request validated.
          echo Release Folder: %RELEASE_FOLDER%
          echo Promotion Path: %PROMOTION_PATH%

      - name: Promote approved Official artifact to FVP
        if: github.event_name == 'repository_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ github.event.client_payload.promotion_path }}
          RELEASE_FOLDER: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "RELATIVE_PATH=%PROMOTION_PATH:*Official_Release/%RELEASE_FOLDER%/=%"
          set "FVP_PATH=%RELEASE_FOLDER%/!RELATIVE_PATH!"

          if "!RELATIVE_PATH!"=="" (
            echo ERROR: Unable to calculate FVP relative path.
            exit /b 1
          )

          echo ========================================
          echo APPROVED FVP PROMOTION
          echo ========================================
          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%
          echo.
          echo Destination:
          echo %FVP_REPO%/!FVP_PATH!
          echo.

          jf rt s ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Approved artifact does not exist in Scout Clone.
            exit /b 1
          )

          jf rt cp ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            "%FVP_REPO%/!FVP_PATH!" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP promotion failed.
            exit /b 1
          )

          jf rt s ^
            "%FVP_REPO%/!FVP_PATH!" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP destination verification failed.
            exit /b 1
          )

          echo.
          echo FVP PROMOTION SUCCESSFUL
          echo Destination:
          echo %FVP_REPO%/!FVP_PATH!

          endlocal

      # =====================================================
      # MANUAL TEST
      # =====================================================

      - name: Validate manual promotion
        if: github.event_name == 'workflow_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ inputs.promotion_path }}
          RELEASE_FOLDER: ${{ inputs.calendar_week }}
        run: |
          @echo off

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if "%RELEASE_FOLDER%"=="" (
            echo ERROR: Release folder is required.
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /B /I /C:"Official_Release/%RELEASE_FOLDER%/" >nul

          if errorlevel 1 (
            echo ERROR: promotion_path does not match Official_Release/%RELEASE_FOLDER%/
            exit /b 1
          )

          echo Manual promotion request validated.

      - name: Promote manual Official artifact
        if: github.event_name == 'workflow_dispatch'
        shell: cmd
        env:
          PROMOTION_PATH: ${{ inputs.promotion_path }}
          RELEASE_FOLDER: ${{ inputs.calendar_week }}
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "RELATIVE_PATH=%PROMOTION_PATH:*Official_Release/%RELEASE_FOLDER%/=%"
          set "FVP_PATH=%RELEASE_FOLDER%/!RELATIVE_PATH!"

          if "!RELATIVE_PATH!"=="" (
            echo ERROR: Unable to calculate FVP relative path.
            exit /b 1
          )

          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%
          echo.
          echo Destination:
          echo %FVP_REPO%/!FVP_PATH!
          echo.

          jf rt s ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Approved artifact does not exist.
            exit /b 1
          )

          jf rt cp ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            "%FVP_REPO%/!FVP_PATH!" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP promotion failed.
            exit /b 1
          )

          jf rt s ^
            "%FVP_REPO%/!FVP_PATH!" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP destination verification failed.
            exit /b 1
          )

          echo.
          echo FVP PROMOTION SUCCESSFUL

          endlocal
