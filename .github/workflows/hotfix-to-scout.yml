name: Rivian to Scout Hotfix

run-name: >-
  Rivian Hotfix |
  ${{ inputs.calendar_week }} |
  ${{ inputs.hotfix_name }}

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Full Rivian/VWG JFrog source folder URL"
        required: true
        type: string
      calendar_week:
        description: "Target CW/OTA folder, for example CW41 (OTA 2026.39.100)"
        required: true
        type: string
      hotfix_name:
        description: "Hotfix folder, for example HF01"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    rivian-scout-hotfix-${{
      inputs.calendar_week
    }}-${{
      inputs.hotfix_name
    }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Merge Rivian Hotfix into Scout

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      FOLDER_URL: ${{ inputs.folder_url }}
      CALENDAR_WEEK: ${{ inputs.calendar_week }}
      HOTFIX_NAME: ${{ inputs.hotfix_name }}

      SOURCE_URL: ${{ secrets.VWG_JFROG_URL }}
      SOURCE_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      SOURCE_SERVER_ID: rivian-source
      SCOUT_SERVER_ID: scout-target

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      # 1. SET UP JFROG CLI
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      # 2. VERIFY JFROG CLI
      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

      # 3. VALIDATE INPUTS AND SET TEMPORARY PATHS
      - name: Validate inputs and set temporary paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @(
              @{
                  Name = 'folder_url input'
                  Value = $env:FOLDER_URL
              },
              @{
                  Name = 'calendar_week input'
                  Value = $env:CALENDAR_WEEK
              },
              @{
                  Name = 'hotfix_name input'
                  Value = $env:HOTFIX_NAME
              },
              @{
                  Name = 'VWG_JFROG_URL secret'
                  Value = $env:SOURCE_URL
              },
              @{
                  Name = 'VWG_JFROG_ACCESS_TOKEN secret'
                  Value = $env:SOURCE_TOKEN
              },
              @{
                  Name = 'SCOUT_JFROG_URL secret'
                  Value = $env:SCOUT_URL
              },
              @{
                  Name = 'SCOUT_JFROG_ACCESS_TOKEN secret'
                  Value = $env:SCOUT_TOKEN
              },
              @{
                  Name = 'SCOUT_CLONE_REPO secret'
                  Value = $env:CLONE_REPO
              }
          )

          foreach ($requiredValue in $requiredValues) {
              $value = [string]$requiredValue.Value

              if ([string]::IsNullOrWhiteSpace($value)) {
                  throw "$($requiredValue.Name) is missing or empty."
              }
          }

          $calendarWeek = $env:CALENDAR_WEEK.Trim()
          $hotfixName = $env:HOTFIX_NAME.Trim()

          if (
              $calendarWeek.Contains('/') -or
              $calendarWeek.Contains('\')
          ) {
              throw (
                  'The CW/OTA folder name cannot contain ' +
                  'slash characters.'
              )
          }

          if (
              $hotfixName.Contains('/') -or
              $hotfixName.Contains('\')
          ) {
              throw (
                  'The hotfix folder name cannot contain ' +
                  'slash characters.'
              )
          }

          $stagingDirectory = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "rivian-hotfix-${{ github.run_id }}"

          $downloadSpec = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "rivian-download-${{ github.run_id }}.json"

          "STAGING_DIR=$stagingDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "DOWNLOAD_SPEC=$downloadSpec" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RIVIAN HOTFIX INPUT'
          Write-Host '========================================'
          Write-Host "CW/OTA Folder: $calendarWeek"
          Write-Host "Hotfix Folder: $hotfixName"
          Write-Host "Temporary Directory: $stagingDirectory"
          Write-Host 'Upload mode: merge without remote deletion'

      # 4. REMOVE STALE JFROG CONFIGURATIONS
      - name: Remove stale JFrog configurations
        shell: pwsh
        continue-on-error: true
        run: |
          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

      # 5. CONFIGURE SOURCE JFROG
      - name: Configure source JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c add `
              "$env:SOURCE_SERVER_ID" `
              --url="$env:SOURCE_URL" `
              --access-token="$env:SOURCE_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure source JFrog.'
          }

          jf rt ping `
              --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to source JFrog.'
          }

          Write-Host 'Source JFrog connection successful.'

      # 6. CONFIGURE SCOUT JFROG
      - name: Configure Scout JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection successful.'

      # 7. PARSE SOURCE AND CALCULATE DESTINATION
      - name: Parse source and calculate destination
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $folderUrl = $env:FOLDER_URL.Trim().TrimEnd('/')

          try {
              $sourceUri = [System.Uri]$folderUrl
          }
          catch {
              throw 'The source folder URL is invalid.'
          }

          try {
              $configuredUri = [System.Uri]$env:SOURCE_URL
          }
          catch {
              throw 'VWG_JFROG_URL is invalid.'
          }

          if (
              -not $sourceUri.IsAbsoluteUri -or
              -not $configuredUri.IsAbsoluteUri
          ) {
              throw 'Source and configured JFrog URLs must be absolute URLs.'
          }

          if (
              $sourceUri.Host -ne $configuredUri.Host
          ) {
              throw (
                  'The source folder URL does not belong to the ' +
                  'configured source JFrog instance.'
              )
          }

          $marker = '/artifactory/'

          $position = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw 'The source URL must contain /artifactory/.'
          }

          $relativePath = $sourceUri.AbsolutePath.Substring(
              $position + $marker.Length
          )

          $relativePath = [System.Uri]::UnescapeDataString(
              $relativePath
          )

          $relativePath = $relativePath.Replace('\', '/').Trim('/')

          $segments = $relativePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          if ($segments.Count -lt 2) {
              throw (
                  'The source URL must include an Artifactory ' +
                  'repository and a folder path.'
              )
          }

          $sourceRepo = $segments[0]

          $sourceFolderPath = (
              $segments[1..($segments.Count - 1)] -join '/'
          )

          $sourceSearchPattern = (
              "$sourceRepo/$sourceFolderPath/*"
          )

          $sourceDownloadPattern = (
              "$sourceRepo/$sourceFolderPath/(*)"
          )

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')

          $destinationPath = (
              "$($env:CALENDAR_WEEK.Trim())/" +
              "Hotfixes/" +
              "$($env:HOTFIX_NAME.Trim())"
          )

          $cloneTarget = "$cloneRepo/$destinationPath"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'TRANSFER PATHS'
          Write-Host '========================================'
          Write-Host "Source Repository: $sourceRepo"
          Write-Host "Source Folder: $sourceFolderPath"
          Write-Host "Source Pattern: $sourceSearchPattern"
          Write-Host "Scout Target: $cloneTarget"

          "source_repo=$sourceRepo" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_folder_path=$sourceFolderPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_search_pattern=$sourceSearchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_download_pattern=$sourceDownloadPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "destination_path=$destinationPath" |
              Out-File `
         -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "clone_target=$cloneTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # 8. VERIFY SOURCE CONTENT
      - name: Verify source content
        shell: pwsh
        env:
          SOURCE_SEARCH_PATTERN: >-
            ${{ steps.paths.outputs.source_search_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt search `
              "$env:SOURCE_SEARCH_PATTERN" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true `
              --limit=1

          if ($LASTEXITCODE -ne 0) {
              throw 'No artifacts were found in the source folder.'
          }

          Write-Host 'Source folder contains artifacts.'

      # 9. PREPARE STAGING AND DOWNLOAD SPEC
      - name: Prepare staging and download specification
        shell: pwsh
        env:
          SOURCE_DOWNLOAD_PATTERN: >-
            ${{ steps.paths.outputs.source_download_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:STAGING_DIR) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:STAGING_DIR `
              -Force |
              Out-Null

          $targetPath = (
              $env:STAGING_DIR.Replace('\', '/') +
              '/{1}'
          )

          $downloadSpecObject = @{
              files = @(
                  @{
                      pattern = $env:SOURCE_DOWNLOAD_PATTERN
                      target = $targetPath
                      recursive = "true"
                      flat = "false"
                  }
              )
          }

          $downloadSpecJson = $downloadSpecObject |
              ConvertTo-Json -Depth 10

          $downloadSpecJson |
              Set-Content `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Encoding utf8

          Write-Host 'Generated JFrog download specification:'
          Get-Content -LiteralPath $env:DOWNLOAD_SPEC

      # 10. DOWNLOAD SOURCE HOTFIX CONTENT
      - name: Download Rivian hotfix content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD RIVIAN HOTFIX CONTENT'
          Write-Host '========================================'

          jf rt download `
              --spec="$env:DOWNLOAD_SPEC" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --fail-no-op=true `
              --threads=1 `
              --split-count=0 `
              --retries=3 `
              --retry-wait-time=10s

          if ($LASTEXITCODE -ne 0) {
              throw 'Rivian hotfix download failed.'
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No files were downloaded from the source.'
          }

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\', '/').Replace('\', '/')

              Write-Host "DOWNLOADED: $relativePath"
          }

          "FILE_COUNT=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # 11. CHECK EVERY INCOMING ARTIFACT
      - name: Check incoming artifacts in Scout
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.paths.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CHECK INCOMING ARTIFACTS'
          Write-Host '========================================'

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          $newCount = 0
          $existingCount = 0

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\', '/').Replace('\', '/')

              $targetArtifactPath = (
                  "$env:CLONE_TARGET/$relativePath"
              )

              $searchOutput = @(
                  & jf rt search `
                      "$targetArtifactPath" `
                      --server-id="$env:SCOUT_SERVER_ID" `
                      --recursive=false `
                      --include-dirs=false `
                      --limit=1 2>&1
              )

              $searchExitCode = $LASTEXITCODE

              if ($searchExitCode -ne 0) {
                  Write-Host (
                      $searchOutput -join :NewLine
                  )

                  throw (
                      'Failed to check Scout artifact: ' +
                      $targetArtifactPath
                  )
              }

              $searchText = (
                  $searchOutput -join :NewLine
              ).Trim()

              $artifactExists = $false

              if (-not :IsNullOrWhiteSpace($searchText)) {
                  try {
                      $searchResult = $searchText |
                          ConvertFrom-Json

                      if (@($searchResult).Count -gt 0) {
                          $artifactExists = $true
                      }
                  }
                  catch {
                      Write-Host 'Raw JFrog response:'
                      Write-Host $searchText

                      throw (
                          'Could not parse the JFrog search response ' +
                          "for $targetArtifactPath."
                      )
                  }
              }

              if ($artifactExists) {
                  $existingCount++
                  Write-Host "EXISTS, SAME PATH WILL BE USED: $relativePath"
              }
              else {
                  $newCount++
                  Write-Host "NEW, WILL BE ADDED: $relativePath"
              }
          }

          "NEW_FILE_COUNT=$newCount" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "EXISTING_FILE_COUNT=$existingCount" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ''
          Write-Host "New files: $newCount"
          Write-Host "Existing matching paths: $existingCount"
          Write-Host "Total incoming files: $($files.Count)"
          Write-Host 'No Scout content has been deleted.'

      # 12. PREVIEW MERGE
      - name: Preview Scout hotfix merge
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.paths.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  './*' `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout hotfix merge dry run failed.'
              }
          }
          finally {
              Pop-Location
          }

      # 13. MERGE CONTENT INTO EXISTING HOTFIX
      - name: Merge hotfix content into Scout
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.paths.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'MERGE HOTFIX CONTENT INTO SCOUT'
          Write-Host '========================================'
          Write-Host "Destination: $env:CLONE_TARGET/"
          Write-Host "New files: $env:NEW_FILE_COUNT"
          Write-Host (
              "Existing matching paths: " +
              $env:EXISTING_FILE_COUNT
          )
          Write-Host 'No remote delete operation will be performed.'

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  './*' `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout hotfix upload failed.'
              }
          }
          finally {
              Pop-Location
          }

          Write-Host 'Hotfix content successfully merged into Scout.'

      # 14. VERIFY EVERY INCOMING ARTIFACT
      - name: Verify merged artifacts in Scout
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.paths.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          $verifiedCount = 0

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\', '/').Replace('\', '/')

              $targetArtifactPath = (
                  "$env:CLONE_TARGET/$relativePath"
              )

              $searchOutput = @(
                  & jf rt search `
                      "$targetArtifactPath" `
                      --server-id="$env:SCOUT_SERVER_ID" `
                      --recursive=false `
                      --include-dirs=false `
                      --fail-no-op=true `
                      --limit=1 2>&1
              )

              if ($LASTEXITCODE -ne 0) {
                  Write-Host (
                      $searchOutput -join :NewLine
                  )

                  throw (
                      'Artifact verification failed: ' +
                      $targetArtifactPath
                  )
              }

              $searchText = (
                  $searchOutput -join :NewLine
              ).Trim()

              if (:IsNullOrWhiteSpace($searchText)) {
                  throw (
                      'Artifact was not found after upload: ' +
                      $targetArtifactPath
                  )
              }

              try {
                  $searchResult = $searchText |
                      ConvertFrom-Json
              }
              catch {
                  throw (
                      'Could not parse the verification response for: ' +
                      $targetArtifactPath
                  )
              }

              if (@($searchResult).Count -eq 0) {
                  throw (
                      'Artifact was not found after upload: ' +
                      $targetArtifactPath
                  )
              }

              $verifiedCount++
              Write-Host "VERIFIED: $relativePath"
          }

          if ($verifiedCount -ne $files.Count) {
              throw (
                  'Not all incoming artifacts were verified in Scout.'
              )
          }

          Write-Host "Verified artifacts: $verifiedCount"

      # 15. SUMMARY
      - name: Transfer summary
        if: ${{ success() }}
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.paths.outputs.source_repo }}
          SOURCE_FOLDER_PATH: >-
            ${{ steps.paths.outputs.source_folder_path }}
          CLONE_TARGET: ${{ steps.paths.outputs.clone_target }}
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RIVIAN HOTFIX TRANSFER SUCCESSFUL'
          Write-Host '========================================'
          Write-Host (
              "Source: $env:SOURCE_REPO/" +
              $env:SOURCE_FOLDER_PATH
          )
          Write-Host "Destination: $env:CLONE_TARGET"
          Write-Host "Total incoming files: $env:FILE_COUNT"
          Write-Host "New files: $env:NEW_FILE_COUNT"
          Write-Host (
              "Existing matching paths: " +
              $env:EXISTING_FILE_COUNT
          )
          Write-Host 'Existing unrelated hotfix content: PRESERVED'
          Write-Host 'Release content: NOT MODIFIED'
          Write-Host 'Remote delete: NOT PERFORMED'

      # 16. CLEAN LOCAL TEMPORARY FILES
      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if (
              $env:STAGING_DIR -and
              (Test-Path -LiteralPath $env:STAGING_DIR)
          ) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          if (
              $env:DOWNLOAD_SPEC -and
              (Test-Path -LiteralPath $env:DOWNLOAD_SPEC)
          ) {
              Remove-Item `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Force
          }

          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          Write-Host 'Local temporary files removed.'
          Write-Host 'No remote Scout content was deleted.'
