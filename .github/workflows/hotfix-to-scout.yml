name: Rivian to Scout Hotfix

run-name: >-
  Rivian Hotfix |
  ${{ inputs.calendar_week }} |
  ${{ inputs.hotfix_name }}

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Full Rivian/VWG JFrog source folder URL"
        required: true
        type: string

      calendar_week:
        description: "Target CW/OTA folder, for example CW41 (OTA 2026.39.100)"
        required: true
        type: string

      hotfix_name:
        description: "Hotfix folder, for example HF01"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    rivian-scout-hotfix-${{
      inputs.calendar_week
    }}-${{
      inputs.hotfix_name
    }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Add Rivian Hotfix Content to Scout

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      FOLDER_URL: ${{ inputs.folder_url }}
      CALENDAR_WEEK: ${{ inputs.calendar_week }}
      HOTFIX_NAME: ${{ inputs.hotfix_name }}

      SOURCE_URL: ${{ secrets.VWG_JFROG_URL }}
      SOURCE_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      SOURCE_SERVER_ID: rivian-source
      SCOUT_SERVER_ID: scout-target

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      # 1. SET UP JFROG CLI
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      # 2. VERIFY JFROG CLI
      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

      # 3. SET TEMPORARY PATHS
      - name: Set temporary paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stagingDirectory = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "rivian-hotfix-${{ github.run_id }}"

          $downloadSpec = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "rivian-download-${{ github.run_id }}.json"

          "STAGING_DIR=$stagingDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "DOWNLOAD_SPEC=$downloadSpec" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host 'Temporary staging directory:'
          Write-Host $stagingDirectory

          Write-Host ''
          Write-Host 'Temporary download specification:'
          Write-Host $downloadSpec

      # 4. VALIDATE INPUTS AND SECRETS
      - name: Validate inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredValues = @(
              @{
                  Name = 'folder_url input'
                  Value = $env:FOLDER_URL
              },
              @{
                  Name = 'calendar_week input'
                  Value = $env:CALENDAR_WEEK
              },
              @{
                  Name = 'hotfix_name input'
                  Value = $env:HOTFIX_NAME
              },
              @{
                  Name = 'VWG_JFROG_URL secret'
                  Value = $env:SOURCE_URL
              },
              @{
                  Name = 'VWG_JFROG_ACCESS_TOKEN secret'
                  Value = $env:SOURCE_TOKEN
              },
              @{
                  Name = 'SCOUT_JFROG_URL secret'
                  Value = $env:SCOUT_URL
              },
              @{
                  Name = 'SCOUT_JFROG_ACCESS_TOKEN secret'
                  Value = $env:SCOUT_TOKEN
              },
              @{
                  Name = 'SCOUT_CLONE_REPO secret'
                  Value = $env:CLONE_REPO
              }
          )

          foreach ($requiredValue in $requiredValues) {
              if (
                  [string]::IsNullOrWhiteSpace(
                      [string]$requiredValue.Value
                  )
              ) {
                  throw "$($requiredValue.Name) is missing or empty."
              }
          }

          $folderUrl = $env:FOLDER_URL.Trim()
          $calendarWeek = $env:CALENDAR_WEEK.Trim()
          $hotfixName = $env:HOTFIX_NAME.Trim()

          if (
              $calendarWeek.Contains('/') -or
              $calendarWeek.Contains('\')
          ) {
              throw (
                  'The CW/OTA folder name cannot contain ' +
                  'slash characters.'
              )
          }

          if (
              $hotfixName.Contains('/') -or
              $hotfixName.Contains('\')
          ) {
              throw (
                  'The hotfix folder name cannot contain ' +
                  'slash characters.'
              )
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RIVIAN HOTFIX INPUT'
          Write-Host '========================================'

          Write-Host 'Rivian Source URL:'
          Write-Host $folderUrl

          Write-Host ''
          Write-Host 'CW/OTA Folder:'
          Write-Host $calendarWeek

          Write-Host ''
          Write-Host 'Hotfix Folder:'
          Write-Host $hotfixName

          Write-Host ''
          Write-Host 'Existing Scout content:'
          Write-Host 'PRESERVED'

          Write-Host ''
          Write-Host 'Matching existing artifact:'
          Write-Host 'UPLOAD TO THE SAME PATH'

      # 5. CLEAN EXISTING JFROG CONFIGURATIONS
      - name: Clean existing JFrog configurations
        shell: pwsh
        continue-on-error: true
        run: |
          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

      # 6. CONFIGURE SOURCE JFROG
      - name: Configure source JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c add `
              "$env:SOURCE_SERVER_ID" `
              --url="$env:SOURCE_URL" `
              --access-token="$env:SOURCE_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure source JFrog.'
          }

          jf rt ping `
              --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to source JFrog.'
          }

          Write-Host 'Source JFrog connection successful.'

      # 7. CONFIGURE SCOUT JFROG
      - name: Configure Scout JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection successful.'

      # 8. PARSE SOURCE FOLDER URL
      - name: Parse source folder URL
        id: parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $folderUrl = $env:FOLDER_URL.Trim().TrimEnd('/')

          try {
              $sourceUri = [System.Uri]$folderUrl
          }
          catch {
              throw 'The source folder URL is invalid.'
          }

          try {
              $configuredUri = [System.Uri]$env:SOURCE_URL
          }
          catch {
              throw 'VWG_JFROG_URL is invalid.'
          }

          if ($sourceUri.Host -ne $configuredUri.Host) {
              Write-Host 'Input source host:'
              Write-Host $sourceUri.Host

              Write-Host ''
              Write-Host 'Configured source host:'
              Write-Host $configuredUri.Host

              throw (
                  'The source URL does not belong to the ' +
                  'configured source JFrog instance.'
              )
          }

          $artifactoryMarker = '/artifactory/'

          $position = $sourceUri.AbsolutePath.IndexOf(
              $artifactoryMarker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw (
                  'The source URL must contain /artifactory/.'
              )
          }

          $relativePath = $sourceUri.AbsolutePath.Substring(
              $position + $artifactoryMarker.Length
          )

          $relativePath = [System.Uri]::UnescapeDataString(
              $relativePath
          )

          $relativePath = $relativePath.Replace('\', '/')
          $relativePath = $relativePath.Trim('/')

          $segments = $relativePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          if ($segments.Count -lt 2) {
              throw (
                  'The source URL must include a repository ' +
                  'and folder path.'
              )
          }

          $sourceRepo = $segments[0]

          $sourceFolderPath = (
              $segments[1..($segments.Count - 1)] -join '/'
          )

          $sourceSearchPattern = (
              "$sourceRepo/$sourceFolderPath/*"
          )

          $sourceDownloadPattern = (
              "$sourceRepo/$sourceFolderPath/(*)"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RIVIAN SOURCE'
          Write-Host '========================================'

          Write-Host 'Source Repository:'
          Write-Host $sourceRepo

          Write-Host ''
          Write-Host 'Source Folder Path:'
          Write-Host $sourceFolderPath

          Write-Host ''
          Write-Host 'Source Search Pattern:'
          Write-Host $sourceSearchPattern

          Write-Host ''
          Write-Host 'Source Download Pattern:'
          Write-Host $sourceDownloadPattern

          "source_repo=$sourceRepo" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_folder_path=$sourceFolderPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_search_pattern=$sourceSearchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_download_pattern=$sourceDownloadPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # 9. VERIFY SOURCE FOLDER
      - name: Verify source folder
        shell: pwsh
        env:
          SOURCE_SEARCH_PATTERN: >-
            ${{ steps.parse.outputs.source_search_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching source folder:'
          Write-Host $env:SOURCE_SEARCH_PATTERN

          jf rt search `
              "$env:SOURCE_SEARCH_PATTERN" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'No artifacts were found in the source folder.'
              )
          }

          Write-Host ''
          Write-Host 'Source folder verified successfully.'

      # 10. CALCULATE SCOUT HOTFIX DESTINATION
      - name: Calculate Scout hotfix destination
        id: destination
        shell: pwsh
 n: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')
          $calendarWeek = $env:CALENDAR_WEEK.Trim()
          $hotfixName = $env:HOTFIX_NAME.Trim()

          $destinationPath = (
              "$calendarWeek/Hotfixes/$hotfixName"
          )

          $cloneTarget = (
              "$cloneRepo/$destinationPath"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SCOUT HOTFIX DESTINATION'
          Write-Host '========================================'

          Write-Host 'CW/OTA Folder:'
          Write-Host $calendarWeek

          Write-Host ''
          Write-Host 'Hotfix Folder:'
          Write-Host $hotfixName

          Write-Host ''
          Write-Host 'Destination Path:'
          Write-Host $destinationPath

          Write-Host ''
          Write-Host 'Complete Scout Target:'
          Write-Host $cloneTarget

          Write-Host ''
          Write-Host 'Upload Mode:'
          Write-Host 'MERGE WITHOUT REMOTE DELETE'

          "destination_path=$destinationPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "clone_target=$cloneTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # 11. INSPECT EXISTING SCOUT HOTFIX
      - name: Inspect existing Scout hotfix
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          $searchPattern = "$env:CLONE_TARGET/*"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'INSPECT EXISTING SCOUT HOTFIX'
          Write-Host '========================================'

          Write-Host 'Destination:'
          Write-Host $env:CLONE_TARGET

          Write-Host ''
          Write-Host (
              'Existing content is allowed and will not be deleted.'
          )

          jf rt search `
              "$searchPattern" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --limit=20

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Failed to inspect the Scout hotfix destination.'
              )
          }

          Write-Host ''
          Write-Host 'Inspection complete.'
          Write-Host 'The workflow will continue.'

      # 12. PREPARE LOCAL STAGING DIRECTORY
      - name: Prepare local staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:STAGING_DIR) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:STAGING_DIR `
              -Force |
              Out-Null

          Write-Host 'Staging directory:'
          Write-Host $env:STAGING_DIR

      # 13. CREATE CORRECTED JFROG DOWNLOAD SPECIFICATION
      - name: Create source download specification
        shell: pwsh
        env:
          SOURCE_DOWNLOAD_PATTERN: >-
            ${{ steps.parse.outputs.source_download_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPath = (
              $env:STAGING_DIR.Replace('\', '/') +
              '/{1}'
          )

          $downloadSpecObject = @{
              files = @(
                  @{
                      pattern = $env:SOURCE_DOWNLOAD_PATTERN
                      target = $targetPath
                      recursive = "true"
                      flat = "false"
                  }
              )
          }

          $downloadSpecJson = $downloadSpecObject |
              ConvertTo-Json -Depth 10

          $downloadSpecJson |
              Set-Content `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Encoding utf8

          Write-Host ''
          Write-Host 'Source download pattern:'
          Write-Host $env:SOURCE_DOWNLOAD_PATTERN

          Write-Host ''
          Write-Host 'Local download target:'
          Write-Host $targetPath

          Write-Host ''
          Write-Host 'Generated JFrog Download Spec:'
          Get-Content -LiteralPath $env:DOWNLOAD_SPEC

      # 14. DOWNLOAD RIVIAN HOTFIX CONTENT
      - name: Download Rivian hotfix content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD RIVIAN HOTFIX CONTENT'
          Write-Host '========================================'

          jf rt download `
              --spec="$env:DOWNLOAD_SPEC" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --fail-no-op=true `
              --threads=1 `
              --split-count=0 `
              --retries=2 `
              --retry-wait-time=10s

          if ($LASTEXITCODE -ne 0) {
              throw 'Rivian hotfix download failed.'
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No files were downloaded from the source.'
          }

          Write-Host ''
          Write-Host 'Downloaded files:'
          Write-Host $files.Count

          Write-Host ''
          Write-Host 'Downloaded hierarchy:'

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\')

              Write-Host $relativePath
          }

          "FILE_COUNT=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # 15. CHECK EACH INCOMING FILE IN SCOUT
      - name: Check incoming file names in Scout
        id: file_check
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CHECK INCOMING FILES IN SCOUT'
          Write-Host '========================================'

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No local files are available for comparison.'
          }

          $newCount = 0
          $existingCount = 0

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\', '/')

              $relativePath = $relativePath.Replace('\', '/')

              $targetArtifactPath = (
                  "$env:CLONE_TARGET/$relativePath"
              )

              $searchOutput = & jf rt search `
                  "$targetArtifactPath" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=false `
                  --include-dirs=false `
                  --limit=1 `
                  --quiet 2>&1

              $searchExitCode = $LASTEXITCODE

              if ($searchExitCode -ne 0) {
                  Write-Host ''
                  Write-Host 'Unable to check:'
                  Write-Host $targetArtifactPath

                  Write-Host ''
                  Write-Host ($searchOutput -join :NewLine)

                  throw (
                      'Failed while checking an incoming artifact ' +
                      'in Scout.'
                  )
              }

              $searchText = (
                  $searchOutput -join :NewLine
              ).Trim()

              $artifactExists = $false

              if ($searchText) {
                  try {
                      $searchResult = $searchText |
                          ConvertFrom-Json

                      if (@($searchResult).Count -gt 0) {
                          $artifactExists = $true
                      }
                  }
                  catch {
                      throw (
                          'Could not interpret the JFrog search ' +
                          "response for $targetArtifactPath."
                      )
                  }
              }

              if ($artifactExists) {
                  $existingCount++

                  Write-Host ''
                  Write-Host 'EXISTS - UPLOAD TO EXISTING PATH:'
                  Write-Host $targetArtifactPath
              }
              else {
                  $newCount++

                  Write-Host ''
                  Write-Host 'NEW - ADD TO HOTFIX:'
                  Write-Host $targetArtifactPath
              }
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FILE CHECK SUMMARY'
          Write-Host '========================================'

          Write-Host 'New files:'
          Write-Host $newCount

          Write-Host ''
          Write-Host 'Existing matching paths:'
          Write-Host $existingCount

          Write-Host ''
          Write-Host 'Total incoming files:'
          Write-Host $files.Count

          Write-Host ''
          Write-Host (
              'No existing Scout artifact has been deleted.'
          )

          "NEW_FILE_COUNT=$newCount" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "EXISTING_FILE_COUNT=$existingCount" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # 16. PREVIEW SCOUT HOTFIX MERGE
      - name: Preview Scout hotfix merge
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PREVIEW SCOUT HOTFIX MERGE'
          Write-Host '========================================'

          Write-Host 'Upload Root:'
          Write-Host $env:STAGING_DIR

          Write-Host ''
          Write-Host 'Scout Destination:'
          Write-Host "$env:CLONE_TARGET/"

          Write-Host ''
          Write-Host (
              'New files will be added. Files with the same ' +
              'relative path will be uploaded to that path.'
          )

          Write-Host ''
          Write-Host (
              'No remote delete operation will be performed.'
          )

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  './*' `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout hotfix merge dry run failed.'
              }
          }
          finally {
              Pop-Location
          }

      # 17. ADD HOTFIX CONTENT TO SCOUT
      - name: Add hotfix content to Scout
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'ADD RIVIAN HOTFIX CONTENT TO SCOUT'
          Write-Host '========================================'

          Write-Host 'Source:'
          Write-Host $env:STAGING_DIR

          Write-Host ''
          Write-Host 'Destination:'
          Write-Host "$env:CLONE_TARGET/"

          Write-Host ''
          Write-Host 'New files:'
          Write-Host $env:NEW_FILE_COUNT

          Write-Host ''
          Write-Host 'Existing matching paths:'
          Write-Host $env:EXISTING_FILE_COUNT

          Write-Host ''
          Write-Host (
              'Existing folders and unrelated files will remain.'
          )

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  './*' `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout hotfix upload failed.'
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ''
          Write-Host 'Hotfix content successfully added to Scout.'
          Write-Host 'No unrelated Scout content was removed.'

      # 18. VERIFY EVERY UPLOADED FILE
      - name: Verify uploaded Scout files
        shell: pwsh
        env:
          CLONE_TARGET: >-
            ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VERIFY UPLOADED SCOUT FILES'
          Write-Host '========================================'

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No local files are available for verification.'
          }

          $verifiedCount = 0

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              ).TrimStart('\', '/')

              $relativePath = $relativePath.Replace('\', '/')

              $targetArtifactPath = (
                  "$env:CLONE_TARGET/$relativePath"
              )

              $searchOutput = & jf rt search `
                  "$targetArtifactPath" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=false `
                  --include-dirs=false `
                  --limit=1 `
                  --quiet 2>&1

              $searchExitCode = $LASTEXITCODE

              if ($searchExitCode -ne 0) {
                  throw (
                      'JFrog verification failed for: ' +
                      $targetArtifactPath
                  )
              }

              $searchText = (
                  $searchOutput -join :NewLine
              ).Trim()

              if (-not $searchText) {
                  throw (
                      'Uploaded artifact was not found: ' +
                      $targetArtifactPath
                  )
              }

              try {
                  $searchResult = $searchText |
                      ConvertFrom-Json
              }
              catch {
                  throw (
                      'Could not interpret the verification ' +
                      "response for $targetArtifactPath."
                  )
              }

              if (@($searchResult).Count -eq 0) {
                  throw (
                      'Uploaded artifact was not found: ' +
                      $targetArtifactPath
                  )
              }

              $verifiedCount++

              Write-Host 'VERIFIED:'
              Write-Host $targetArtifactPath
          }

          Write-Host ''
          Write-Host 'Verified files:'
          Write-Host $verifiedCount

          if ($verifiedCount -ne $files.Count) {
              throw (
                  'Not all incoming files were verified in Scout.'
              )
          }

          Write-Host ''
          Write-Host 'All uploaded Scout files were verified.'

      # 19. TRANSFER SUMMARY
      - name: Hotfix transfer summary
        if: ${{ success() }}
        shell: pwsh
        env:
          SOURCE_REPO: >-
            ${{ steps.parse.outputs.source_repo }}

          SOURCE_FOLDER_PATH: >-
            ${{ steps.parse.outputs.source_folder_path }}

          CLONE_TARGET: >-
            ${{ steps.destination.outputs.clone_target }}
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RIVIAN TO SCOUT HOTFIX SUCCESSFUL'
          Write-Host '========================================'

          Write-Host 'Rivian Source:'
          Write-Host (
              "$env:SOURCE_REPO/" +
              "$env:SOURCE_FOLDER_PATH"
          )

          Write-Host ''
          Write-Host 'CW/OTA Folder:'
          Write-Host $env:CALENDAR_WEEK

          Write-Host ''
          Write-Host 'Hotfix Folder:'
          Write-Host $env:HOTFIX_NAME

          Write-Host ''
          Write-Host 'Scout Destination:'
          Write-Host $env:CLONE_TARGET

          Write-Host ''
          Write-Host 'Total incoming files:'
          Write-Host $env:FILE_COUNT

          Write-Host ''
          Write-Host 'New file paths:'
          Write-Host $env:NEW_FILE_COUNT

          Write-Host ''
          Write-Host 'Existing matching file paths:'
          Write-Host $env:EXISTING_FILE_COUNT

          Write-Host ''
          Write-Host 'Destination hierarchy:'
          Write-Host (
              "$env:CALENDAR_WEEK/" +
              "Hotfixes/" +
              "$env:HOTFIX_NAME"
          )

          Write-Host ''
          Write-Host 'Existing Hotfix Content:'
          Write-Host 'PRESERVED'

          Write-Host ''
          Write-Host 'Existing Release Content:'
          Write-Host 'NOT MODIFIED'

          Write-Host ''
          Write-Host 'Remote Delete:'
          Write-Host 'NOT PERFORMED'

      # 20. CLEAN LOCAL TEMPORARY FILES
      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if (
              $env:STAGING_DIR -and
              (Test-Path -LiteralPath $env:STAGING_DIR)
          ) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          if (
              $env:DOWNLOAD_SPEC -and
              (Test-Path -LiteralPath $env:DOWNLOAD_SPEC)
          ) {
              Remove-Item `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Force
          }

          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          Write-Host ''
          Write-Host 'Local temporary files removed.'
          Write-Host 'Temporary JFrog configurations removed.'
          Write-Host 'No remote Scout content was deleted.'
