name: Hotfix to Scout Clone

run-name: >-
  Hotfix to Scout |
  ${{ inputs.calendar_week }} |
  ${{ inputs.hotfix_folder }}

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Full source JFrog hotfix folder URL"
        required: true
        type: string

      calendar_week:
        description: "Calendar Week, for example CW29"
        required: true
        type: string

      hotfix_folder:
        description: "Hotfix folder name, for example HF01"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    hotfix-to-scout-${{
      inputs.calendar_week
    }}-${{
      inputs.hotfix_folder
    }}

  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer Hotfix Folder to Scout Clone

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      FOLDER_URL: ${{ inputs.folder_url }}
      CALENDAR_WEEK: ${{ inputs.calendar_week }}
      HOTFIX_FOLDER: ${{ inputs.hotfix_folder }}

      SOURCE_URL: ${{ secrets.VWG_JFROG_URL }}
      SOURCE_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}

      SOURCE_SERVER_ID: hotfix-source
      SCOUT_SERVER_ID: scout-target

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      # ==========================================================
      # 1. SET UP JFROG CLI
      # ==========================================================

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      # ==========================================================
      # 2. CREATE TEMPORARY DIRECTORY
      # ==========================================================

      - name: Set temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stagingDirectory = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "hotfix-scout-${{ github.run_id }}"

          "STAGING_DIR=$stagingDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Temporary directory:"
          Write-Host $stagingDirectory

      # ==========================================================
      # 3. VALIDATE INPUTS AND SECRETS
      #
      # Calendar Week is text input and therefore supports future
      # values such as CW42, CW47, CW52 without YAML changes.
      # ==========================================================

      - name: Validate inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:FOLDER_URL) {
              throw 'Hotfix folder URL is required.'
          }

          if (-not $env:SOURCE_URL) {
              throw 'VWG_JFROG_URL secret is missing.'
          }

          if (-not $env:SOURCE_TOKEN) {
              throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if (-not $env:SCOUT_URL) {
              throw 'SCOUT_JFROG_URL secret is missing.'
          }

          if (-not $env:SCOUT_TOKEN) {
              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if (-not $env:CLONE_REPO) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (-not $env:APPROVAL_URL) {
              throw 'FVP_APPROVAL_WEBHOOK_URL secret is missing.'
          }

          $calendarWeek = (
              $env:CALENDAR_WEEK.Trim().ToUpperInvariant()
          )

          if ($calendarWeek -notmatch '^CW[0-9]{1,2}$') {
              throw (
                  'Calendar Week must use CW format, ' +
                  'for example CW29, CW41, CW47.'
              )
          }

          $hotfixFolder = (
              $env:HOTFIX_FOLDER.Trim().ToUpperInvariant()
          )

          if ($hotfixFolder -notmatch '^HF[0-9]{2,}$') {
              throw (
                  'Hotfix Folder must use HF format, ' +
                  'for example HF01, HF02, HF10.'
              )
          }

          "CALENDAR_WEEK=$calendarWeek" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "HOTFIX_FOLDER=$hotfixFolder" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'HOTFIX INPUT VALIDATION SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Calendar Week: $calendarWeek"
          Write-Host "Hotfix Folder: $hotfixFolder"
          Write-Host "Source URL: $env:FOLDER_URL"

      # ==========================================================
      # 4. CONFIGURE SOURCE JFROG
      # ==========================================================

      - name: Configure source JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null

          jf c add `
              "$env:SOURCE_SERVER_ID" `
              --url="$env:SOURCE_URL" `
              --access-token="$env:SOURCE_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure source JFrog.'
          }

          jf rt ping --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to the source JFrog.'
          }

          Write-Host 'Source JFrog connection successful.'

      # ==========================================================
      # 5. CONFIGURE SCOUT JFROG
      # ==========================================================

      - name: Configure Scout JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          jf rt ping --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection successful.'

      # ==========================================================
      # 6. PARSE SOURCE HOTFIX FOLDER URL
      # ==========================================================

      - name: Parse source hotfix folder URL
        id: parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $folderUrl = $env:FOLDER_URL.Trim().TrimEnd('/')

          try {
              $sourceUri = [System.Uri]$folderUrl
          }
          catch {
              throw 'The hotfix source folder URL is invalid.'
          }

          try {
              $configuredUri = [System.Uri]$env:SOURCE_URL
          }
          catch {
              throw 'VWG_JFROG_URL is invalid.'
          }

          if ($sourceUri.Host -ne $configuredUri.Host) {
              throw (
                  'The hotfix source URL does not belong to the ' +
                  'configured source JFrog.'
              )
          }

          $artifactoryMarker = '/artifactory/'

          $position = $sourceUri.AbsolutePath.IndexOf(
              $artifactoryMarker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw (
                  'The hotfix folder URL must contain /artifactory/.'
              )
          }

          $relativePath = $sourceUri.AbsolutePath.Substring(
              $position + $artifactoryMarker.Length
          )

          $relativePath = [System.Uri]::UnescapeDataString(
              $relativePath
          )

          $relativePath = $relativePath.Replace('\', '/').Trim('/')

          $segments = $relativePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          if ($segments.Count -lt 2) {
              throw (
                  'The source URL must include a repository and folder path.'
              )
          }

          $sourceRepo = $segments[0]

          $sourceFolderPath = (
              $segments[1..($segments.Count - 1)] -join '/'
          )

          $sourcePattern = "$sourceRepo/$sourceFolderPath/(*)"

          "source_repo=$sourceRepo" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_folder_path=$sourceFolderPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_pattern=$sourcePattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          Write-Host "Source Repository: $sourceRepo"
          Write-Host "Source Folder: $sourceFolderPath"

      # ==========================================================
      # 7. VERIFY SOURCE HOTFIX FOLDER
      # ==========================================================

      - name: Verify source hotfix folder
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}

          SOURCE_FOLDER_PATH: >-
            ${{ steps.parse.outputs.source_folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $searchPattern = (
              "$env:SOURCE_REPO/$env:SOURCE_FOLDER_PATH/*"
          )

          jf rt search `
              "$searchPattern" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'No artifacts were found in the hotfix folder.'
          }

          Write-Host 'Hotfix source folder verified.'

      # ==========================================================
      # 8. PREPARE STAGING DIRECTORY
      # ==========================================================

      - name: Prepare local staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:STAGING_DIR) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:STAGING_DIR `
              -Force |
              Out-Null

      # ==========================================================
      # 9. CREATE DOWNLOAD FILE SPEC
      # ==========================================================

      - name: Create hotfix download specification
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.parse.outputs.source_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          $downloadSpec = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "hotfix-download-${{ github.run_id }}.json"

          $localTarget = (
              $env:STAGING_DIR.TrimEnd('\') + '\{1}'
          )

          $spec = @{
              files = @(
                  @{
                      pattern = $env:SOURCE_PATTERN
                      target = $localTarget
                      recursive = $true
                      flat = $true
                  }
              )
          }

          $spec |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                  -LiteralPath $downloadSpec `
                  -Encoding utf8

          "DOWNLOAD_SPEC=$downloadSpec" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 10. DOWNLOAD HOTFIX FOLDER
      # ==========================================================

      - name: Download hotfix folder contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt download `
              --spec="$env:DOWNLOAD_SPEC" `
              --server-id="$env:SOURCE_SERVER_ID" `
              --fail-no-op=true `
              --threads=1 `
              --split-count=0 `
              --retries=2 `
              --retry-wait-time=10s

          if ($LASTEXITCODE -ne 0) {
              throw 'Hotfix folder download failed.'
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No files were downloaded for the hotfix.'
          }

          "FILE_COUNT=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Downloaded hotfix files: $($files.Count)"

      # ==========================================================
      # 11. CALCULATE DYNAMIC HOTFIX DESTINATION
      #
      # Any future CW entered by the user is accepted.
      #
      # Example:
      # Official_Release/CW47/Hotfixes/HF01/
      # ==========================================================

      - name: Calculate Scout hotfix destination
        id: destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')

          $calendarWeek = (
              $env:CALENDAR_WEEK.Trim().ToUpperInvariant()
          )

          $hotfixFolder = (
              $env:HOTFIX_FOLDER.Trim().ToUpperInvariant()
          )

          $destinationPath = (
              "Official_Release/" +
              "$calendarWeek/" +
              "Hotfixes/" +
              "$hotfixFolder"
          )

          $cloneTarget = "$cloneRepo/$destinationPath"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'HOTFIX DESTINATION'
          Write-Host '========================================'
          Write-Host "Calendar Week: $calendarWeek"
          Write-Host "Hotfix: $hotfixFolder"
          Write-Host "Destination: $cloneTarget"

          "destination_path=$destinationPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "clone_target=$cloneTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "promotion_path=$destinationPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 12. PREVIEW HOTFIX UPLOAD
      # ==========================================================

      - name: Preview hotfix upload
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  "./*" `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run

              if ($LASTEXITCODE -ne 0) {
                  throw 'Hotfix upload dry run failed.'
              }
          }
          finally {
              Pop-Location
          }

      # ==========================================================
      # 13. UPLOAD HOTFIX TO SCOUT CLONE
      # ==========================================================

      - name: Upload hotfix to Scout Clone
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Source: $env:STAGING_DIR"
          Write-Host "Destination: $env:CLONE_TARGET/"

          Push-Location $env:STAGING_DIR

          try {
              jf rt upload `
                  "./*" `
                  "$env:CLONE_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) {
                  throw 'Hotfix upload to Scout Clone failed.'
              }
          }
          finally {
              Pop-Location
          }

          Write-Host 'Hotfix upload completed.'

      # ==========================================================
      # 14. VERIFY HOTFIX IN SCOUT CLONE
      # ==========================================================

      - name: Verify Scout hotfix destination
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt search `
              "$env:CLONE_TARGET/*" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout Hotfix destination verification failed.'
          }

          Write-Host 'Scout Hotfix destination verified.'

      # ==========================================================
      # 15. REQUEST HOTFIX FVP APPROVAL
      #
      # This workflow never copies directly to FVP.
      # ==========================================================

      - name: Request Hotfix FVP approval
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.parse.outputs.source_repo }}

          SOURCE_FOLDER_PATH: >-
            ${{ steps.parse.outputs.source_folder_path }}

          PROMOTION_PATH: >-
            ${{ steps.destination.outputs.promotion_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $payload = @{
              request_type = 'fvp_root_folder_approval'
              repo_key = $env:CLONE_REPO
              source_repo = $env:SOURCE_REPO
              source_path = $env:SOURCE_FOLDER_PATH
              promotion_path = $env:PROMOTION_PATH
              folder_name = $env:PROMOTION_PATH
              path = $env:PROMOTION_PATH
              build_type = 'official-hotfix'
              file_count = $env:FILE_COUNT
              requested_by = '${{ github.actor }}'
              github_run_id = '${{ github.run_id }}'
          }

          $json = $payload |
              ConvertTo-Json -Depth 10 -Compress

          Invoke-RestMethod `
              -Uri $env:APPROVAL_URL `
              -Method Post `
              -ContentType 'application/json' `
              -Body $json `
              -ErrorAction Stop

          Write-Host 'Hotfix FVP approval request submitted.'
          Write-Host 'This workflow will not copy to FVP.'

      # ==========================================================
      # 16. SUMMARY
      # ==========================================================

      - name: Hotfix transfer summary
        if: ${{ success() }}
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}

          PROMOTION_PATH: >-
            ${{ steps.destination.outputs.promotion_path }}
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'HOTFIX TO SCOUT CLONE SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Calendar Week: $env:CALENDAR_WEEK"
          Write-Host "Hotfix: $env:HOTFIX_FOLDER"
          Write-Host "Scout Destination: $env:CLONE_TARGET"
          Write-Host "Files Transferred: $env:FILE_COUNT"
          Write-Host "Promotion Path: $env:PROMOTION_PATH"
          Write-Host 'Approval: SUBMITTED TO POWER AUTOMATE'
          Write-Host 'FVP Copy: NOT PERFORMED HERE'

      # ==========================================================
      # 17. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if (
              $env:STAGING_DIR -and
              (Test-Path -LiteralPath $env:STAGING_DIR)
          ) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          if (
              $env:DOWNLOAD_SPEC -and
              (Test-Path -LiteralPath $env:DOWNLOAD_SPEC)
          ) {
              Remove-Item `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Force
          }

          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          Write-Host 'Temporary files and JFrog configurations removed.'
