name: Rivian to Scout Hotfix

run-name: Rivian Hotfix | ${{ inputs.calendar_week }} | ${{ inputs.hotfix_name }}

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Full Rivian/VWG JFrog source folder URL"
        required: true
        type: string
      calendar_week:
        description: "Official Release CW/OTA folder, example CW41 (OTA 2026.39.100)"
        required: true
        type: string
      hotfix_name:
        description: "Hotfix folder, example HF01"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rivian-hotfix-${{ inputs.calendar_week }}-${{ inputs.hotfix_name }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Rivian Hotfix to Scout Official Release
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      FOLDER_URL: ${{ inputs.folder_url }}
      CALENDAR_WEEK: ${{ inputs.calendar_week }}
      HOTFIX_NAME: ${{ inputs.hotfix_name }}

      SOURCE_URL: ${{ secrets.VWG_JFROG_URL }}
      SOURCE_TOKEN: ${{ secrets.VWG_JFROG_ACCESS_TOKEN }}

      SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
      SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      SOURCE_SERVER_ID: rivian-source
      SCOUT_SERVER_ID: scout-target

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      # 1. SET UP JFROG CLI
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

      # 2. VERIFY JFROG CLI
      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

      # 3. VALIDATE INPUTS AND SECRETS
      - name: Validate inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([System.String]::IsNullOrWhiteSpace($env:FOLDER_URL)) {
              throw 'folder_url is required.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:CALENDAR_WEEK)) {
              throw 'calendar_week is required.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:HOTFIX_NAME)) {
              throw 'hotfix_name is required.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:SOURCE_URL)) {
              throw 'VWG_JFROG_URL secret is missing.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:SOURCE_TOKEN)) {
              throw 'VWG_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:SCOUT_URL)) {
              throw 'SCOUT_JFROG_URL secret is missing.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:SCOUT_TOKEN)) {
              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:CLONE_REPO)) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          $calendarWeek = $env:CALENDAR_WEEK.Trim()
          $hotfixName = $env:HOTFIX_NAME.Trim()

          if ($calendarWeek.Contains('/') -or $calendarWeek.Contains('\')) {
              throw 'calendar_week cannot contain slash characters.'
          }

          if ($hotfixName.Contains('/') -or $hotfixName.Contains('\')) {
              throw 'hotfix_name cannot contain slash characters.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'INPUT VALIDATION SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "CW/OTA: $calendarWeek"
          Write-Host "Hotfix: $hotfixName"

      # 4. SET TEMPORARY PATHS
      - name: Set temporary paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stagingDirectory = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "rivian-hotfix-${{ github.run_id }}"

          $downloadSpec = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "rivian-download-${{ github.run_id }}.json"

          "STAGING_DIR=$stagingDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "DOWNLOAD_SPEC=$downloadSpec" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Staging directory: $stagingDirectory"

      # 5. CLEAN OLD JFROG CONFIGURATIONS
      - name: Clean old JFrog configurations
        shell: pwsh
        continue-on-error: true
        run: |
          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

      # 6. CONFIGURE SOURCE JFROG
      - name: Configure source JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $argsList = @(
              'c'
              'add'
              $env:SOURCE_SERVER_ID
              "--url=$env:SOURCE_URL"
              "--access-token=$env:SOURCE_TOKEN"
              '--interactive=false'
              '--overwrite=true'
          )

          & jf @argsList

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure source JFrog.'
          }

          & jf rt ping "--server-id=$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to source JFrog.'
          }

      # 7. CONFIGURE SCOUT JFROG
      - name: Configure Scout JFrog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $argsList = @(
              'c'
              'add'
              $env:SCOUT_SERVER_ID
              "--url=$env:SCOUT_URL"
              "--access-token=$env:SCOUT_TOKEN"
              '--interactive=false'
              '--overwrite=true'
          )

          & jf @argsList

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          & jf rt ping "--server-id=$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot connect to Scout JFrog.'
          }

      # 8. PARSE SOURCE URL
      - name: Parse source URL
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $folderUrl = $env:FOLDER_URL.Trim().TrimEnd('/')

          try {
              $sourceUri = [System.Uri]$folderUrl
              $configuredUri = [System.Uri]$env:SOURCE_URL
          }
          catch {
              throw 'Source JFrog URL is invalid.'
          }

          if (-not $sourceUri.IsAbsoluteUri) {
              throw 'Source folder URL must be absolute.'
          }

          if ($sourceUri.Host -ne $configuredUri.Host) {
              throw (
                  'Source URL does not belong to the configured ' +
                  'source JFrog instance.'
              )
          }

          $marker = '/artifactory/'

          $position = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw 'Source URL must contain /artifactory/.'
          }

          $relativePath = $sourceUri.AbsolutePath.Substring(
              $position + $marker.Length
          )

          $relativePath = [System.Uri]::UnescapeDataString(
              $relativePath
          )

          $relativePath = $relativePath.Replace('\', '/')
          $relativePath = $relativePath.Trim('/')

          $segments = $relativePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          if ($segments.Count -lt 2) {
              throw 'Source URL must contain repository and folder path.'
          }

          $sourceRepo = $segments[0]

          $sourceFolderPath = (
              $segments[1..($segments.Count - 1)] -join '/'
          )

          $searchPattern = "$sourceRepo/$sourceFolderPath/*"
          $downloadPattern = "$sourceRepo/$sourceFolderPath/(*)"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SOURCE'
          Write-Host '========================================'
          Write-Host "Repository: $sourceRepo"
          Write-Host "Folder: $sourceFolderPath"
          Write-Host "Search pattern: $searchPattern"

          "source_repo=$sourceRepo" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_folder_path=$sourceFolderPath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "search_pattern=$searchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "download_pattern=$downloadPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # 9. VERIFY SOURCE CONTENT
      - name: Verify source content
        shell: pwsh
        env:
          SEARCH_PATTERN: ${{ steps.source.outputs.search_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          $searchArgs = @(
              'rt'
              'search'
              $env:SEARCH_PATTERN
              "--server-id=$env:SOURCE_SERVER_ID"
              '--recursive=true'
              '--include-dirs=false'
              '--fail-no-op=true'
              '--limit=1'
          )

          & jf @searchArgs

          if ($LASTEXITCODE -ne 0) {
              throw 'No artifacts were found in source folder.'
          }

          Write-Host 'Source content verified.'

      # 10. CALCULATE OFFICIAL RELEASE HOTFIX DESTINATION
      - name: Calculate Official Release hotfix destination
        id: destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')
          $calendarWeek = $env:CALENDAR_WEEK.Trim()
          $hotfixName = $env:HOTFIX_NAME.Trim()

          $officialRoot = (
              "Official_Release/$calendarWeek"
          )

          $hotfixRoot = (
              "$officialRoot/Hotfixes/$hotfixName"
          )

          $cloneTarget = (
              "$cloneRepo/$hotfixRoot"
          )

          $cwTarget = (
              "$cloneRepo/$officialRoot"
          )

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'OFFICIAL RELEASE HOTFIX DESTINATION'
          Write-Host '========================================'
          Write-Host "CW/OTA: $calendarWeek"
          Write-Host "Hotfix: $hotfixName"
          Write-Host "Official Root: $cwTarget"
          Write-Host "Hotfix Target: $cloneTarget"

          "official_root=$officialRoot" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "cw_target=$cwTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "hotfix_root=$hotfixRoot" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "clone_target=$cloneTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      # 11. CHECK EXISTING OFFICIAL RELEASE CW
      - name: Check existing Official Release CW
        shell: pwsh
        env:
          CW_TARGET: ${{ steps.destination.outputs.cw_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CHECK OFFICIAL RELEASE CW'
          Write-Host '========================================'
          Write-Host "CW target: $env:CW_TARGET"

          $searchPattern = "$env:CW_TARGET/*"

          $searchArgs = @(
              'rt'
              'search'
              $searchPattern
              "--server-id=$env:SCOUT_SERVER_ID"
              '--recursive=true'
              '--include-dirs=false'
              '--limit=1'
          )

          $previousLogLevel = $env:JFROG_CLI_LOG_LEVEL
          $env:JFROG_CLI_LOG_LEVEL = 'ERROR'

          try {
              $result = @(& jf @searchArgs)
              $exitCode = $LASTEXITCODE
          }
          finally {
              $env:JFROG_CLI_LOG_LEVEL = $previousLogLevel
          }

          if ($exitCode -ne 0) {
              throw 'Failed while checking the Official Release CW.'
          }

          $resultText = (
              $result -join [System.Environment]::NewLine
          ).Trim()

          if (
              [System.String]::IsNullOrWhiteSpace(
                  $resultText
              ) -or
              $resultText -eq '[]'
          ) {
              Write-Host ''
              Write-Host 'Official Release CW does not exist yet.'
              Write-Host 'The hotfix upload will create the path.'
          }
          else {
              Write-Host ''
              Write-Host 'Official Release CW already exists.'
              Write-Host 'Existing content will be preserved.'
          }

      # 12. PREPARE STAGING DIRECTORY
      - name: Prepare staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:STAGING_DIR) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $env:STAGING_DIR `
              -Force |
              Out-Null

      # 13. CREATE DOWNLOAD SPECIFICATION
      - name: Create download specification
        shell: pwsh
        env:
          DOWNLOAD_PATTERN: ${{ steps.source.outputs.download_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPath = (
              $env:STAGING_DIR.Replace('\', '/') +
              '/{1}'
          )

          $downloadSpec = @{
              files = @(
                  @{
                      pattern = $env:DOWNLOAD_PATTERN
                      target = $targetPath
                      recursive = "true"
                      flat = "false"
                  }
              )
          }

          $json = $downloadSpec |
              ConvertTo-Json -Depth 10

          $json |
              Set-Content `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Encoding utf8

          Write-Host 'Download specification:'
          Get-Content -LiteralPath $env:DOWNLOAD_SPEC

      # 14. DOWNLOAD RIVIAN HOTFIX
      - name: Download Rivian hotfix content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'DOWNLOAD RIVIAN HOTFIX'
          Write-Host '========================================'

          $downloadArgs = @(
              'rt'
              'download'
              "--spec=$env:DOWNLOAD_SPEC"
              "--server-id=$env:SOURCE_SERVER_ID"
              '--fail-no-op=true'
              '--threads=1'
              '--split-count=0'
              '--retries=3'
              '--retry-wait-time=10s'
          )

          & jf @downloadArgs

          if ($LASTEXITCODE -ne 0) {
              throw 'Rivian hotfix download failed.'
          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'No files were downloaded.'
          }

          Write-Host "Downloaded files: $($files.Count)"

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              )

              $relativePath = $relativePath.TrimStart('\', '/')
              $relativePath = $relativePath.Replace('\', '/')

              Write-Host "DOWNLOADED: $relativePath"
          }

          "FILE_COUNT=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # 15. CHECK EXISTING HOTFIX CONTENT
      - name: Check incoming files against Scout
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'CHECK EXISTING HOTFIX CONTENT'
          Write-Host '========================================'
          Write-Host "Target: $env:CLONE_TARGET"

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -File
          )

          $searchPattern = "$env:CLONE_TARGET/*"

          $searchArgs = @(
              'rt'
              'search'
              $searchPattern
              "--server-id=$env:SCOUT_SERVER_ID"
              '--recursive=true'
              '--include-dirs=false'
              '--limit=10000'
          )

          $previousLogLevel = $env:JFROG_CLI_LOG_LEVEL
          $env:JFROG_CLI_LOG_LEVEL = 'ERROR'

          try {
              $searchOutput = @(& jf @searchArgs)
              $searchExitCode = $LASTEXITCODE
          }
          finally {
              $env:JFROG_CLI_LOG_LEVEL = $previousLogLevel
          }

          if ($searchExitCode -ne 0) {
              throw 'Failed to inspect existing hotfix content.'
          }

          $searchText = (
              $searchOutput -join [System.Environment]::NewLine
          ).Trim()

          $existingPaths = @{}

          if (
              -not [System.String]::IsNullOrWhiteSpace(
                  $searchText
              ) -and
              $searchText -ne '[]'
          ) {
              try {
                  $results = @(
                      $searchText |
                          ConvertFrom-Json
                  )

                  foreach ($result in $results) {
                      if ($null -ne $result.path) {
                          $path = (
                              [string]$result.path
                          ).Replace('\', '/')

                          $existingPaths[
                              $path.ToLowerInvariant()
                          ] = $true
                      }
                  }
              }
              catch {
                  Write-Host $searchText
                  throw 'Unable to parse Scout search response.'
              }
          }

          $newCount = 0
          $existingCount = 0

          foreach ($file in $files) {
              $relativePath = $file.FullName.Substring(
                  $env:STAGING_DIR.Length
              )

              $relativePath = $relativePath.TrimStart('\', '/')
              $relativePath = $relativePath.Replace('\', '/')

              $targetPath = "$env:CLONE_TARGET/$relativePath"
              $lookupPath = $targetPath.ToLowerInvariant()

              if ($existingPaths.ContainsKey($lookupPath)) {
                  $existingCount++
                  Write-Host "EXISTS -> $relativePath"
              }
              else {
                  $newCount++
                  Write-Host "NEW -> $relativePath"
              }
          }

          "NEW_FILE_COUNT=$newCount" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "EXISTING_FILE_COUNT=$existingCount" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ''
          Write-Host "New files: $newCount"
          Write-Host "Existing paths: $existingCount"
          Write-Host 'Existing content will not be deleted.'

      # 16. PREVIEW OFFICIAL RELEASE HOTFIX UPLOAD
      - name: Preview Official Release hotfix upload
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'HOTFIX UPLOAD DRY RUN'
          Write-Host '========================================'
          Write-Host "Target: $env:CLONE_TARGET/"

          Push-Location $env:STAGING_DIR

          try {
              $uploadArgs = @(
                  'rt'
                  'upload'
                  './*'
                  "$env:CLONE_TARGET/"
                  "--server-id=$env:SCOUT_SERVER_ID"
                  '--recursive=true'
                  '--flat=false'
                  '--dry-run'
              )

              & jf @uploadArgs

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout hotfix dry run failed.'
              }
          }
          finally {
              Pop-Location
          }

      # 17. MERGE HOTFIX INTO OFFICIAL RELEASE
      - name: Merge hotfix into Official Release
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'MERGE HOTFIX INTO OFFICIAL RELEASE'
          Write-Host '========================================'
          Write-Host "Destination: $env:CLONE_TARGET/"
          Write-Host "New files: $env:NEW_FILE_COUNT"
          Write-Host "Existing matching paths: $env:EXISTING_FILE_COUNT"
          Write-Host 'Existing unrelated content: PRESERVED'
          Write-Host 'Release folder: NOT MODIFIED'
          Write-Host 'Remote delete: DISABLED'

          Push-Location $env:STAGING_DIR

          try {
              $uploadArgs = @(
                  'rt'
                  'upload'
                  './*'
                  "$env:CLONE_TARGET/"
                  "--server-id=$env:SCOUT_SERVER_ID"
                  '--recursive=true'
                  '--flat=false'
                  '--fail-no-op=true'
                  '--threads=4'
                  '--retries=3'
                  '--retry-wait-time=5s'
              )

              & jf @uploadArgs

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout hotfix upload failed.'
              }
          }
          finally {
              Pop-Location
          }

          Write-Host 'Official Release hotfix merge completed.'

      # 18. VERIFY OFFICIAL RELEASE HOTFIX
      - name: Verify Official Release hotfix
        shell: pwsh
        env:
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          $verificationPattern = "$env:CLONE_TARGET/*"

          $searchArgs = @(
              'rt'
              'search'
              $verificationPattern
              "--server-id=$env:SCOUT_SERVER_ID"
              '--recursive=true'
              '--include-dirs=false'
              '--fail-no-op=true'
          )

          & jf @searchArgs

          if ($LASTEXITCODE -ne 0) {
              throw 'Official Release hotfix verification failed.'
          }

          Write-Host 'Official Release hotfix verified.'

      # 19. SUMMARY
      - name: Transfer summary
        if: ${{ success() }}
        shell: pwsh
        env:
          SOURCE_REPO: ${{ steps.source.outputs.source_repo }}
          SOURCE_FOLDER: ${{ steps.source.outputs.source_folder_path }}
          CW_TARGET: ${{ steps.destination.outputs.cw_target }}
          CLONE_TARGET: ${{ steps.destination.outputs.clone_target }}
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'RIVIAN HOTFIX TRANSFER SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Source Repository: $env:SOURCE_REPO"
          Write-Host "Source Folder: $env:SOURCE_FOLDER"
          Write-Host "CW/OTA: $env:CALENDAR_WEEK"
          Write-Host "Hotfix: $env:HOTFIX_NAME"
          Write-Host "Official CW Root: $env:CW_TARGET"
          Write-Host "Hotfix Target: $env:CLONE_TARGET"
          Write-Host "Incoming files: $env:FILE_COUNT"
          Write-Host "New files: $env:NEW_FILE_COUNT"
          Write-Host "Existing paths: $env:EXISTING_FILE_COUNT"
          Write-Host 'Existing hotfix content: PRESERVED'
          Write-Host 'Release content: NOT MODIFIED'
          Write-Host 'Remote delete: NOT PERFORMED'

      # 20. CLEANUP LOCAL FILES ONLY
      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if (
              $env:STAGING_DIR -and
              (Test-Path -LiteralPath $env:STAGING_DIR)
          ) {
              Remove-Item `
                  -LiteralPath $env:STAGING_DIR `
                  -Recurse `
                  -Force
          }

          if (
              $env:DOWNLOAD_SPEC -and
              (Test-Path -LiteralPath $env:DOWNLOAD_SPEC)
          ) {
              Remove-Item `
                  -LiteralPath $env:DOWNLOAD_SPEC `
                  -Force
          }

          jf c remove "$env:SOURCE_SERVER_ID" --quiet 2>$null
          jf c remove "$env:SCOUT_SERVER_ID" --quiet 2>$null

          Write-Host 'Local temporary files removed.'
          Write-Host 'No remote Scout artifacts were deleted.'
