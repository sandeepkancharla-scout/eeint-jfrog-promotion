name: Hotfix SharePoint to Scout Clone

on:
  workflow_dispatch:
    inputs:

      sharepoint_sync_path:
        description: "Local synced SharePoint path on the runner"
        required: true
        type: string

      hotfix_folder:
        description: "Folder name inside the SharePoint location"
        required: true
        type: string

      cw_path:
        description: "Calendar Week folder, for example CW11"
        required: true
        type: string

      hf_name:
        description: "Hotfix name, for example HF01"
        required: true
        type: string


jobs:

  upload-hotfix:

    name: Upload SharePoint Hotfix to Scout

    runs-on: self-hosted

    env:
      SCOUT_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

    steps:

      # ============================================================
      # 1. Resolve inputs
      # ============================================================

      - name: Resolve Hotfix paths
        id: paths
        shell: pwsh
        env:
          SHAREPOINT_ROOT: ${{ inputs.sharepoint_sync_path }}
          HOTFIX_FOLDER: ${{ inputs.hotfix_folder }}
          CW_PATH: ${{ inputs.cw_path }}
          HF_NAME: ${{ inputs.hf_name }}

        run: |
          $ErrorActionPreference = 'Stop'

          $sharePointRoot = "$env:SHAREPOINT_ROOT".Trim().TrimEnd('\', '/')
          $folderName     = "$env:HOTFIX_FOLDER".Trim().Trim('\', '/')
          $cwPath         = "$env:CW_PATH".Trim().Trim('\', '/')
          $hfName         = "$env:HF_NAME".Trim().Trim('\', '/')

          if ([string]::IsNullOrWhiteSpace($sharePointRoot)) {
              throw "SharePoint Sync Path cannot be empty."
          }

          if ([string]::IsNullOrWhiteSpace($folderName)) {
              throw "Hotfix Folder cannot be empty."
          }

          if ($folderName.Contains('\') -or $folderName.Contains('/')) {
              throw "Hotfix Folder must contain only the folder name."
          }

          if ([string]::IsNullOrWhiteSpace($cwPath)) {
              throw "CW Path cannot be empty."
          }

          if ($cwPath -notmatch '^CW.+$') {
              throw "CW Path must start with CW. Received: $cwPath"
          }

          if ($cwPath.Contains('\') -or $cwPath.Contains('/')) {
              throw "CW Path must be one folder name."
          }

          if ([string]::IsNullOrWhiteSpace($hfName)) {
              throw "HF Name cannot be empty."
          }

          if ($hfName -notmatch '^HF.+$') {
              throw "HF Name must start with HF. Received: $hfName"
          }

          if ($hfName.Contains('\') -or $hfName.Contains('/')) {
              throw "HF Name must be one folder name."
          }

          # --------------------------------------------------------
          # Construct local SharePoint-synced source folder
          # --------------------------------------------------------

          $localFolder = Join-Path `
              $sharePointRoot `
              $folderName

          Write-Host ""
          Write-Host "Runner computer:"
          Write-Host "$env:COMPUTERNAME"

          Write-Host ""
          Write-Host "Runner user:"
          Write-Host "$env:USERNAME"

          Write-Host ""
          Write-Host "SharePoint root:"
          Write-Host "$sharePointRoot"

          Write-Host ""
          Write-Host "Requested Hotfix folder:"
          Write-Host "$folderName"

          Write-Host ""
          Write-Host "Expected local source:"
          Write-Host "$localFolder"


          # --------------------------------------------------------
          # Validate synced SharePoint location
          # --------------------------------------------------------

          if (-not (Test-Path -LiteralPath $sharePointRoot -PathType Container)) {

              throw "SharePoint sync location is not accessible by the runner: $sharePointRoot"
          }

          if (-not (Test-Path -LiteralPath $localFolder -PathType Container)) {

              throw "Hotfix folder was not found under the SharePoint sync location: $localFolder"
          }


          # --------------------------------------------------------
          # Count files
          # --------------------------------------------------------

          $files = @(
              Get-ChildItem `
                  -LiteralPath $localFolder `
                  -File `
                  -Recurse
          )

          if ($files.Count -eq 0) {
              throw "Hotfix folder contains no files: $localFolder"
          }


          # --------------------------------------------------------
          # Construct Scout paths
          # --------------------------------------------------------

          $promotionPath = "Official_Release/$cwPath/Hotfixes/$hfName"

          $targetPath = "$promotionPath/$folderName"


          Write-Host ""
          Write-Host "============================================"
          Write-Host "SHAREPOINT HOTFIX -> SCOUT"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Source:"
          Write-Host "$localFolder"

          Write-Host ""
          Write-Host "Files:"
          Write-Host "$($files.Count)"

          Write-Host ""
          Write-Host "Calendar Week:"
          Write-Host "$cwPath"

          Write-Host ""
          Write-Host "Hotfix:"
          Write-Host "$hfName"

          Write-Host ""
          Write-Host "Scout Destination:"
          Write-Host "$env:SCOUT_REPO/$targetPath"

          Write-Host ""
          Write-Host "============================================"


          # --------------------------------------------------------
          # GitHub step outputs
          # --------------------------------------------------------

          "local_folder=$localFolder" >> $env:GITHUB_OUTPUT
          "folder_name=$folderName" >> $env:GITHUB_OUTPUT
          "cw_path=$cwPath" >> $env:GITHUB_OUTPUT
          "hf_name=$hfName" >> $env:GITHUB_OUTPUT
          "promotion_path=$promotionPath" >> $env:GITHUB_OUTPUT
          "target_path=$targetPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 2. Setup JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4


      # ============================================================
      # 3. Configure Scout JFrog
      # ============================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JFROG_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:JFROG_URL)) {
              throw "SCOUT_JFROG_URL secret is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:JFROG_TOKEN)) {
              throw "SCOUT_JFROG_ACCESS_TOKEN secret is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:SCOUT_REPO)) {
              throw "SCOUT_CLONE_REPO secret is empty."
          }

          Write-Host ""
          Write-Host "Configuring Scout JFrog..."

          & jf c remove scout-hotfix --quiet 2>$null
          $global:LASTEXITCODE = 0

          & jf c add scout-hotfix `
              --url="$env:JFROG_URL" `
              --access-token="$env:JFROG_TOKEN" `
              --interactive=false

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout JFrog."
          }

          Write-Host ""
          Write-Host "Testing Scout JFrog..."

          & jf rt ping `
              --server-id=scout-hotfix

          if ($LASTEXITCODE -ne 0) {
              throw "Scout JFrog connection failed."
          }

          Write-Host ""
          Write-Host "Scout JFrog connection successful." `
              -ForegroundColor Green


      # ============================================================
      # 4. Create JFrog upload spec
      #
      # Example:
      #
      # SharePoint synced:
      # Hotfixes-upload\TSG_BFS\...
      #
      # Inputs:
      # CW29
      # HF03
      #
      # Scout:
      # Official_Release/
      #   CW29/
      #     Hotfixes/
      #       HF03/
      #         TSG_BFS/
      #           ...
      #
      # Existing HF03 is NOT deleted.
      # ============================================================

      - name: Create Hotfix upload spec
        id: upload_spec
        shell: pwsh
        env:
          LOCAL_FOLDER: ${{ steps.paths.outputs.local_folder }}
          FOLDER_NAME: ${{ steps.paths.outputs.folder_name }}
          PROMOTION_PATH: ${{ steps.paths.outputs.promotion_path }}

        run: |
          $ErrorActionPreference = 'Stop'

          $localFolder = $env:LOCAL_FOLDER.Replace('\', '/').TrimEnd('/')

          $sourcePattern = "$localFolder/(*)"

          $targetPattern = (
              "$env:SCOUT_REPO/" +
              "$env:PROMOTION_PATH/" +
              "$env:FOLDER_NAME/{1}"
          )

          $specPath = Join-Path `
              $env:RUNNER_TEMP `
              "hotfix-sharepoint-upload.json"

          $spec = [ordered]@{
              files = @(
                  [ordered]@{
                      pattern   = $sourcePattern
                      target    = $targetPattern
                      recursive = "true"
                      flat      = "true"
                  }
              )
          }

          $specJson = $spec | ConvertTo-Json -Depth 10

          Set-Content `
              -LiteralPath $specPath `
              -Value $specJson `
              -Encoding UTF8

          Write-Host ""
          Write-Host "============================================"
          Write-Host "JFROG UPLOAD SPEC"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Source Pattern:"
          Write-Host "$sourcePattern"

          Write-Host ""
          Write-Host "Target Pattern:"
          Write-Host "$targetPattern"

          Write-Host ""
          Write-Host "============================================"

          "spec_path=$specPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 5. Upload complete folder to Scout
      #
      # Existing HF folder is not deleted.
      #
      # Existing:
      # HF03/ECU_A
      # HF03/ECU_B
      #
      # Upload TSG_BFS:
      #
      # HF03/
      #   ECU_A/
      #   ECU_B/
      #   TSG_BFS/
      #
      # ============================================================

      - name: Upload Hotfix to Scout Clone
        shell: pwsh
        env:
          SPEC_PATH: ${{ steps.upload_spec.outputs.spec_path }}
          TARGET_PATH: ${{ steps.paths.outputs.target_path }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "============================================"
          Write-Host "UPLOADING HOTFIX TO SCOUT"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Destination:"
          Write-Host "$env:SCOUT_REPO/$env:TARGET_PATH"

          Write-Host ""

          & jf rt upload `
              --spec="$env:SPEC_PATH" `
              --server-id=scout-hotfix `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Hotfix upload to Scout failed."
          }

          Write-Host ""
          Write-Host "Hotfix upload completed successfully." `
              -ForegroundColor Green


      # ============================================================
      # 6. Verify Scout
      # ============================================================

      - name: Verify Scout Hotfix
        shell: pwsh
        env:
          TARGET_PATH: ${{ steps.paths.outputs.target_path }}

        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern =
              "$env:SCOUT_REPO/$env:TARGET_PATH/*"

          Write-Host ""
          Write-Host "Verifying Scout:"
          Write-Host "$targetPattern"

          Write-Host ""

          & jf rt search `
              "$targetPattern" `
              --server-id=scout-hotfix `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Hotfix verification failed."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "HOTFIX UPLOAD SUCCESSFUL"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Scout Location:"
          Write-Host "$env:SCOUT_REPO/$env:TARGET_PATH"

          Write-Host ""
          Write-Host "Promotion Root:"
          Write-Host "${{ steps.paths.outputs.promotion_path }}"

          Write-Host ""
          Write-Host "============================================" `
              -ForegroundColor Green


      # ============================================================
      # 7. Cleanup
      # ============================================================

      - name: Cleanup
        if: always()
        continue-on-error: true
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Continue'

          & jf c remove scout-hotfix --quiet 2>$null
          $global:LASTEXITCODE = 0

          $specPath = Join-Path `
              $env:RUNNER_TEMP `
              "hotfix-sharepoint-upload.json"

          if (Test-Path -LiteralPath $specPath) {

              Remove-Item `
                  -LiteralPath $specPath `
                  -Force `
                  -ErrorAction SilentlyContinue
          }

          Write-Host "Cleanup completed."

          exit 0
