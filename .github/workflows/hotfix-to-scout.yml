name: Hotfix to Scout Clone

on:
  workflow_dispatch:
    inputs:
      staging_asset:
        description: "Temporary private GitHub Release asset"
        required: true
        type: string

      original_folder_name:
        description: "Original local root folder name"
        required: true
        type: string

      cw_path:
        description: "Existing CW folder name, for example CW11"
        required: true
        type: string

      hf_name:
        description: "Hotfix folder name, for example HF01"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-hotfix:
    name: Upload Hotfix to Scout Clone
    runs-on: ubuntu-latest

    env:
      STAGING_TAG: hotfix-staging
      SCOUT_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

    steps:
      # ============================================================
      # 1. Validate inputs
      # ============================================================

      - name: Validate inputs
        id: inputs
        shell: bash
        env:
          STAGING_ASSET: ${{ inputs.staging_asset }}
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
          CW_PATH: ${{ inputs.cw_path }}
          HF_NAME: ${{ inputs.hf_name }}
        run: |
          set -euo pipefail

          if [[ -z "$STAGING_ASSET" ]]; then
            echo "staging_asset cannot be empty."
            exit 1
          fi

          if [[ -z "$ORIGINAL_FOLDER_NAME" ]]; then
            echo "original_folder_name cannot be empty."
            exit 1
          fi

          if [[ ! "$CW_PATH" =~ ^CW.+$ ]]; then
            echo "CW path must start with CW. Received: $CW_PATH"
            exit 1
          fi

          if [[ "$CW_PATH" == *"/"* || "$CW_PATH" == *"\\"* ]]; then
            echo "CW path must be one folder name."
            exit 1
          fi

          if [[ ! "$HF_NAME" =~ ^HF.+$ ]]; then
            echo "HF name must start with HF. Received: $HF_NAME"
            exit 1
          fi

          if [[ "$HF_NAME" == *"/"* || "$HF_NAME" == *"\\"* ]]; then
            echo "HF name must be one folder name."
            exit 1
          fi

          promotion_path="Official_Release/$CW_PATH/Hotfixes/$HF_NAME"

          echo "promotion_path=$promotion_path" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "HOTFIX INPUTS"
          echo "============================================"
          echo "Asset       : $STAGING_ASSET"
          echo "Root Folder : $ORIGINAL_FOLDER_NAME"
          echo "CW Path     : $CW_PATH"
          echo "HF Name     : $HF_NAME"
          echo "Target Root : $promotion_path"
          echo "============================================"

      # ============================================================
      # 2. Download temporary ZIP from private draft release
      # ============================================================

      - name: Download staged Hotfix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ASSET: ${{ inputs.staging_asset }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/hotfix-download"

          gh release download "$STAGING_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$STAGING_ASSET" \
            --dir "$RUNNER_TEMP/hotfix-download"

          zip_path="$RUNNER_TEMP/hotfix-download/$STAGING_ASSET"

          if [[ ! -f "$zip_path" ]]; then
            echo "Staged ZIP was not downloaded: $zip_path"
            exit 1
          fi

          echo "Downloaded: $zip_path"

      # ============================================================
      # 3. Extract ZIP
      # ============================================================

      - name: Extract Hotfix package
        id: extract
        shell: bash
        env:
          STAGING_ASSET: ${{ inputs.staging_asset }}
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
        run: |
          set -euo pipefail

          zip_path="$RUNNER_TEMP/hotfix-download/$STAGING_ASSET"
          extract_root="$RUNNER_TEMP/hotfix-extracted"

          mkdir -p "$extract_root"
          unzip -q "$zip_path" -d "$extract_root"

          source_folder="$extract_root/$ORIGINAL_FOLDER_NAME"

          if [[ ! -d "$source_folder" ]]; then
            echo "Expected extracted root folder was not found:"
            echo "$source_folder"
            echo "Extracted contents:"
            find "$extract_root" -maxdepth 3 -print
            exit 1
          fi

          if ! find "$source_folder" -type f -print -quit | grep -q .; then
            echo "Extracted folder contains no files."
            exit 1
          fi

          echo "source_folder=$source_folder" >> "$GITHUB_OUTPUT"

          echo "Extracted Hotfix root:"
          echo "$source_folder"

      # ============================================================
      # 4. Setup JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      # ============================================================
      # 5. Configure Scout JFrog
      # ============================================================

      - name: Configure Scout JFrog
        shell: bash
        env:
          JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JFROG_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$JFROG_URL" ]]; then
            echo "SCOUT_JFROG_URL secret is empty."
            exit 1
          fi

          if [[ -z "$JFROG_TOKEN" ]]; then
            echo "SCOUT_JFROG_ACCESS_TOKEN secret is empty."
            exit 1
          fi

          if [[ -z "$SCOUT_REPO" ]]; then
            echo "SCOUT_CLONE_REPO secret is empty."
            exit 1
          fi

          jf c remove scout-hotfix --quiet 2>/dev/null || true

          jf c add scout-hotfix \
            --url="$JFROG_URL" \
            --access-token="$JFROG_TOKEN" \
            --interactive=false

          jf rt ping --server-id=scout-hotfix

      # ============================================================
      # 6. Create upload spec
      #
      # Existing HF content is not deleted.
      # ============================================================

      - name: Create upload spec
        id: upload_spec
        shell: bash
        env:
          SOURCE_FOLDER: ${{ steps.extract.outputs.source_folder }}
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
        run: |
          set -euo pipefail

          spec_path="$RUNNER_TEMP/hotfix-upload-spec.json"

          python3 - "$spec_path" <<'PY'
          import json
          import os
          import sys

          spec_path = sys.argv[1]

          source_folder = os.environ["SOURCE_FOLDER"].rstrip("/")
          root_name = os.environ["ORIGINAL_FOLDER_NAME"]
          repo = os.environ["SCOUT_REPO"]
          promotion_path = os.environ["PROMOTION_PATH"]

          spec = {
              "files": [
                  {
                      "pattern": f"{source_folder}/(*)",
                      "target": (
                          f"{repo}/{promotion_path}/"
                          f"{root_name}/{{1}}"
                      ),
                      "recursive": "true",
                      "flat": "true"
                  }
              ]
          }

          with open(spec_path, "w", encoding="utf-8") as handle:
              json.dump(spec, handle, indent=2)
          PY

          cat "$spec_path"
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. Upload complete folder to Scout Clone
      # ============================================================

      - name: Upload Hotfix to Scout Clone
        shell: bash
        env:
          SPEC_PATH: ${{ steps.upload_spec.outputs.spec_path }}
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
        run: |
          set -euo pipefail

          echo "============================================"
          echo "UPLOADING HOTFIX TO SCOUT CLONE"
          echo "============================================"
          echo "Destination:"
          echo "$SCOUT_REPO/$PROMOTION_PATH/$ORIGINAL_FOLDER_NAME"
          echo "============================================"

          jf rt upload \
            --spec="$SPEC_PATH" \
            --server-id=scout-hotfix \
            --fail-no-op

      # ============================================================
      # 8. Verify Scout upload
      # ============================================================

      - name: Verify Scout Clone Hotfix
        shell: bash
        env:
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
        run: |
          set -euo pipefail

          target_pattern="$SCOUT_REPO/$PROMOTION_PATH/$ORIGINAL_FOLDER_NAME/*"

          jf rt search \
            "$target_pattern" \
            --server-id=scout-hotfix \
            --recursive=true \
            --limit=1 \
            --fail-no-op

          echo "Hotfix verified in Scout Clone."

      # ============================================================
      # 9. Trigger existing Power Automate exactly once
      # ============================================================

      - name: Trigger existing FVP approval flow
        shell: bash
        env:
          APPROVAL_WEBHOOK_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
          CW_PATH: ${{ inputs.cw_path }}
          HF_NAME: ${{ inputs.hf_name }}
        run: |
          set -euo pipefail

          if [[ -z "$APPROVAL_WEBHOOK_URL" ]]; then
            echo "FVP_APPROVAL_WEBHOOK_URL secret is empty."
            exit 1
          fi

          payload=$(
            jq -n \
              --arg promotion_path "$PROMOTION_PATH" \
              --arg cw "$CW_PATH" \
              --arg hf_name "$HF_NAME" \
              --arg folder "$ORIGINAL_FOLDER_NAME" \
              --arg actor "$GITHUB_ACTOR" \
              --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{
                promotion_path: $promotion_path,
                build_type: "official",
                promotion_type: "hotfix",
                cw: $cw,
                hf_name: $hf_name,
                uploaded_folder: $folder,
                requested_by: $actor,
                source: "Hotfix to Scout Clone",
                github_run_url: $run_url
              }'
          )

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$APPROVAL_WEBHOOK_URL"

          echo
          echo "Power Automate triggered successfully."
          echo "One approval has been requested."

      # ============================================================
      # 10. Delete temporary GitHub staging ZIP
      #
      # Only after Scout upload and Power Automate trigger succeed.
      # ============================================================

      - name: Delete temporary staging asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ASSET: ${{ inputs.staging_asset }}
        run: |
          set -euo pipefail

          asset_id=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$STAGING_TAG" \
              --jq ".assets[] | select(.name == \"$STAGING_ASSET\") | .id"
          )

          if [[ -n "$asset_id" ]]; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"

            echo "Temporary staging asset deleted."
          else
            echo "Temporary staging asset was already absent."
          fi

      # ============================================================
      # 11. Summary
      # ============================================================

      - name: Summary
        shell: bash
        env:
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
          ORIGINAL_FOLDER_NAME: ${{ inputs.original_folder_name }}
        run: |
          set -euo pipefail

          echo "============================================"
          echo "HOTFIX UPLOAD SUCCESSFUL"
          echo "============================================"
          echo "Scout Clone:"
          echo "$SCOUT_REPO/$PROMOTION_PATH/$ORIGINAL_FOLDER_NAME"
          echo
          echo "Power Automate approval root:"
          echo "$PROMOTION_PATH"
          echo "============================================"

      # ============================================================
      # 12. Cleanup JFrog configuration
      # ============================================================

      - name: Cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          jf c remove scout-hotfix --quiet 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/hotfix-download"
          rm -rf "$RUNNER_TEMP/hotfix-extracted"
          rm -f "$RUNNER_TEMP/hotfix-upload-spec.json"
