name: Hotfix to Scout Clone

on:
  workflow_dispatch:
    inputs:
      local_folder_path:
        description: "Local folder path on the Windows self-hosted runner"
        required: true
        type: string

      cw_path:
        description: "Existing CW folder name, for example CW11"
        required: true
        type: string

      hf_name:
        description: "Hotfix name, for example HF01"
        required: true
        type: string

jobs:
  upload-hotfix:
    name: Upload Hotfix to Scout Clone
    runs-on: self-hosted

    env:
      TARGET_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

    steps:

      # ============================================================
      # 1. Validate inputs
      # ============================================================

      - name: Validate inputs
        id: inputs
        shell: pwsh
        env:
          LOCAL_FOLDER_INPUT: ${{ inputs.local_folder_path }}
          CW_INPUT: ${{ inputs.cw_path }}
          HF_INPUT: ${{ inputs.hf_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $localFolder = "$env:LOCAL_FOLDER_INPUT".Trim()
          $cwPath      = "$env:CW_INPUT".Trim().Trim('/').Trim('\')
          $hfName      = "$env:HF_INPUT".Trim().Trim('/').Trim('\')

          if ([string]::IsNullOrWhiteSpace($localFolder)) {
              throw "Local Folder Path cannot be empty."
          }

          if (-not (Test-Path -LiteralPath $localFolder -PathType Container)) {
              throw "Local folder does not exist on the runner: $localFolder"
          }

          if ([string]::IsNullOrWhiteSpace($cwPath)) {
              throw "CW Path cannot be empty."
          }

          if ([string]::IsNullOrWhiteSpace($hfName)) {
              throw "HF Name cannot be empty."
          }

          if ($cwPath -notmatch '^CW.+') {
              throw "CW Path must start with CW. Received: $cwPath"
          }

          if ($hfName -notmatch '^HF.+') {
              throw "HF Name must start with HF. Received: $hfName"
          }

          $localFolderItem = Get-Item -LiteralPath $localFolder
          $localFolderName = $localFolderItem.Name

          $promotionPath = "Official_Release/$cwPath/Hotfixes/$hfName"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "HOTFIX UPLOAD"
          Write-Host "============================================"
          Write-Host "Local Folder   : $localFolder"
          Write-Host "Folder Name    : $localFolderName"
          Write-Host "CW             : $cwPath"
          Write-Host "Hotfix         : $hfName"
          Write-Host "Promotion Path : $promotionPath"
          Write-Host "============================================"

          "local_folder=$localFolder" >> $env:GITHUB_OUTPUT
          "local_folder_name=$localFolderName" >> $env:GITHUB_OUTPUT
          "cw_path=$cwPath" >> $env:GITHUB_OUTPUT
          "hf_name=$hfName" >> $env:GITHUB_OUTPUT
          "promotion_path=$promotionPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 2. Setup JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4


      # ============================================================
      # 3. Configure Scout JFrog
      # ============================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JFROG_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace("$env:JFROG_URL")) {
              throw "SCOUT_JFROG_URL secret is empty."
          }

          if ([string]::IsNullOrWhiteSpace("$env:JFROG_TOKEN")) {
              throw "SCOUT_JFROG_ACCESS_TOKEN secret is empty."
          }

          & jf c remove scout-hotfix --quiet 2>$null
          $global:LASTEXITCODE = 0

          & jf c add scout-hotfix `
              --url="$env:JFROG_URL" `
              --access-token="$env:JFROG_TOKEN" `
              --interactive=false

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to configure Scout JFrog."
          }

          & jf rt ping --server-id=scout-hotfix

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to connect to Scout JFrog."
          }

          Write-Host "Scout JFrog connection successful." -ForegroundColor Green


      # ============================================================
      # 4. Upload complete local folder
      #
      # Example:
      #
      # Local:
      # C:\Hotfixes\TSG_BFS
      #
      # Scout:
      # Official_Release/CW11/Hotfixes/HF01/TSG_BFS/...
      #
      # Existing HF01 is NOT deleted.
      # ============================================================

      - name: Upload complete Hotfix folder
        shell: pwsh
        env:
          LOCAL_FOLDER: ${{ steps.inputs.outputs.local_folder }}
          LOCAL_FOLDER_NAME: ${{ steps.inputs.outputs.local_folder_name }}
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $normalizedLocal = $env:LOCAL_FOLDER.TrimEnd('\', '/')

          $sourcePattern = "$normalizedLocal\*"

          $targetPath = "$env:TARGET_REPO/$env:PROMOTION_PATH/$env:LOCAL_FOLDER_NAME/"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "UPLOADING HOTFIX"
          Write-Host "============================================"
          Write-Host "Source:"
          Write-Host "$normalizedLocal"
          Write-Host ""
          Write-Host "Target:"
          Write-Host "$targetPath"
          Write-Host ""

          & jf rt upload `
              "$sourcePattern" `
              "$targetPath" `
              --server-id=scout-hotfix `
              --recursive=true `
              --flat=false `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Hotfix upload failed."
          }

          Write-Host ""
          Write-Host "Hotfix upload completed." -ForegroundColor Green


      # ============================================================
      # 5. Verify Hotfix exists in Scout Clone
      # ============================================================

      - name: Verify Scout Clone Hotfix
        shell: pwsh
        env:
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $pattern = "$env:TARGET_REPO/$env:PROMOTION_PATH/*"

          Write-Host ""
          Write-Host "Verifying:"
          Write-Host "$pattern"

          & jf rt search `
              "$pattern" `
              --server-id=scout-hotfix `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Hotfix verification failed."
          }

          Write-Host ""
          Write-Host "Hotfix verified in Scout Clone." -ForegroundColor Green


      # ============================================================
      # 6. Trigger EXISTING Power Automate flow ONCE
      #
      # This happens only after the complete upload succeeds.
      # ============================================================

      - name: Trigger FVP approval
        shell: pwsh
        env:
          APPROVAL_WEBHOOK_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          PROMOTION_PATH: ${{ steps.inputs.outputs.promotion_path }}
          CW_PATH: ${{ steps.inputs.outputs.cw_path }}
          HF_NAME: ${{ steps.inputs.outputs.hf_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace("$env:APPROVAL_WEBHOOK_URL")) {
              throw "FVP_APPROVAL_WEBHOOK_URL secret is empty."
          }

          $payload = @{
              promotion_path = $env:PROMOTION_PATH
              build_type     = "official"
              promotion_type = "hotfix"
              cw             = $env:CW_PATH
              hf_name        = $env:HF_NAME
              requested_by   = "Hotfix to Scout Clone"
          }

          $json = $payload | ConvertTo-Json -Depth 10

          Write-Host ""
          Write-Host "============================================"
          Write-Host "TRIGGERING FVP APPROVAL"
          Write-Host "============================================"
          Write-Host "Promotion Path:"
          Write-Host "$env:PROMOTION_PATH"
          Write-Host ""
          Write-Host "One Power Automate approval will be requested."
          Write-Host ""

          Invoke-RestMethod `
              -Uri "$env:APPROVAL_WEBHOOK_URL" `
              -Method POST `
              -ContentType "application/json" `
              -Body $json `
              -ErrorAction Stop

          Write-Host ""
          Write-Host "Power Automate approval triggered successfully." `
              -ForegroundColor Green


      # ============================================================
      # 7. Cleanup
      # ============================================================

      - name: Cleanup
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          & jf c remove scout-hotfix --quiet 2>$null
          $global:LASTEXITCODE = 0

          Write-Host "Cleanup completed."

          exit 0
