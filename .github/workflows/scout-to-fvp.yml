name: Scout Clone to FVP

run-name: >-
  Scout to FVP |
  ${{ github.event.client_payload.build_type }} |
  ${{ github.event.client_payload.promotion_path }}


# ================================================================
# IMPORTANT
#
# This workflow can only be started through repository_dispatch.
#
# Power Automate sends the dispatch only after all required
# approvers approve the promotion.
#
# There is intentionally no workflow_dispatch/manual trigger.
# ================================================================

on:
  repository_dispatch:
    types:
      - fvp-promotion-approved


permissions:
  contents: read


concurrency:
  group: >-
    scout-to-fvp-${{
      github.event.client_payload.promotion_path ||
      github.run_id
    }}

  cancel-in-progress: false


jobs:

  promote:

    name: Promote Approved Scout Folder to FVP

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120


    env:

      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

      PROMOTION_PATH: >-
        ${{ github.event.client_payload.promotion_path }}

      BUILD_TYPE: >-
        ${{ github.event.client_payload.build_type }}

      REQUESTED_BY: >-
        ${{ github.event.client_payload.requested_by }}

      APPROVAL_ID: >-
        ${{ github.event.client_payload.approval_id }}

      SCOUT_SERVER_ID: scout-fvp-promotion

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO


    steps:


      # ==========================================================
      # 1. SET UP JFROG CLI
      # ==========================================================

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true

        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}

          JF_ACCESS_TOKEN: >-
            ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}


      # ==========================================================
      # 2. VALIDATE POWER AUTOMATE DISPATCH
      # ==========================================================

      - name: Validate Power Automate promotion request
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')
          $fvpRepo = $env:FVP_REPO.Trim().Trim('/')
          $promotionPath = $env:PROMOTION_PATH.Trim().Trim('/')
          $buildType = $env:BUILD_TYPE.Trim().ToLowerInvariant()

          if (-not $cloneRepo) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (-not $fvpRepo) {
              throw 'SCOUT_FVP_REPO secret is missing.'
          }

          if (-not $promotionPath) {
              throw 'Power Automate did not provide promotion_path.'
          }

          if (-not $buildType) {
              throw 'Power Automate did not provide build_type.'
          }

          if ($buildType -ne 'official-release' -and
              $buildType -ne 'official-hotfix') {

              throw (
                  'build_type must be official-release ' +
                  'or official-hotfix.'
              )
          }

          if ($promotionPath.Contains('..')) {
              throw 'promotion_path cannot contain ..'
          }

          if ($promotionPath.StartsWith('/')) {
              throw 'promotion_path cannot start with /.'
          }

          if ($promotionPath.EndsWith('/')) {
              $promotionPath = $promotionPath.TrimEnd('/')
          }

          if (
              -not $promotionPath.StartsWith(
                  'Official_Release/',
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {
              throw (
                  'Approved promotion_path must begin with ' +
                  'Official_Release/.'
              )
          }

          if ($buildType -eq 'official-release') {

              if (
                  $promotionPath -notmatch
                  '^Official_Release/CW[0-9]+ \(OTA [^)]+\)/Release$'
              ) {
                  throw (
                      'Official Release path must follow: ' +
                      'Official_Release/CWxx (OTA version)/Release'
                  )
              }
          }

          if ($buildType -eq 'official-hotfix') {

              if (
                  $promotionPath -notmatch
                  '^Official_Release/CW[0-9]+ \(OTA [^)]+\)/Hotfixes/HF[0-9]{2,}$'
              ) {
                  throw (
                      'Official Hotfix path must follow: ' +
                      'Official_Release/CWxx (OTA version)/' +
                      'Hotfixes/HFxx'
                  )
              }
          }

          $sourcePath = "$cloneRepo/$promotionPath"
          $targetPath = "$fvpRepo/$promotionPath"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POWER AUTOMATE APPROVAL VALIDATED'
          Write-Host '========================================'

          Write-Host 'Build Type:'
          Write-Host $buildType

          Write-Host ''
          Write-Host 'Approved Promotion Path:'
          Write-Host $promotionPath

          Write-Host ''
          Write-Host 'Scout Clone Source:'
          Write-Host $sourcePath

          Write-Host ''
          Write-Host 'FVP Destination:'
          Write-Host $targetPath

          if ($env:REQUESTED_BY) {
              Write-Host ''
              Write-Host 'Requested By:'
              Write-Host $env:REQUESTED_BY
          }

          if ($env:APPROVAL_ID) {
              Write-Host ''
              Write-Host 'Approval ID:'
              Write-Host $env:APPROVAL_ID
          }

          "PROMOTION_PATH=$promotionPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "BUILD_TYPE=$buildType" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "SOURCE_PATH=$sourcePath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 3. VERIFY JFROG CLI AND CONNECTION
      # ==========================================================

      - name: Verify Scout JFrog connection
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

          jf rt ping

          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection successful.'


      # ==========================================================
      # 4. VERIFY THE EXACT APPROVED SOURCE PATH
      #
      # Examples:
      #
      # Official_Release/
      # CW29 (OTA 2026.27.100)/
      # Release/
      #
      # or:
      #
      # Official_Release/
      # CW41 (OTA 2026.39.100)/
      # Hotfixes/
      # HF03/
      # ==========================================================

      - name: Verify approved Scout Clone folder
        id: source
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_PATH/*"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VERIFY APPROVED SCOUT CLONE FOLDER'
          Write-Host '========================================'

          Write-Host 'Searching:'
          Write-Host $sourcePattern

          $searchResult = jf rt search `
              "$sourcePattern" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'No artifacts were found under the approved ' +
                  'Scout Clone promotion path.'
              )
          }

          $items = @(
              $searchResult |
                  ConvertFrom-Json
          )

          $realArtifacts = @(
              $items |
                  Where-Object {
                      $path = $_.path.Replace('\', '/')

                      -not $path.EndsWith(
                          '/promotion.ready',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  }
          )

          if ($realArtifacts.Count -eq 0) {
              throw (
                  'The approved folder contains no real artifacts. ' +
                  'Only promotion.ready may be present.'
              )
          }

          Write-Host ''
          Write-Host 'Real artifact count:'
          Write-Host $realArtifacts.Count

          Write-Host ''
          Write-Host 'Artifacts approved for FVP:'

          foreach ($item in $realArtifacts) {
              Write-Host $item.path
          }

          "ARTIFACT_COUNT=$($realArtifacts.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 5. CREATE COPY FILE SPEC
      #
      # Copies the entire approved hierarchy.
      #
      # promotion.ready is excluded because it is a control file,
      # not an FVP release artifact.
      # ==========================================================

      - name: Create FVP copy specification
        id: spec
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $specFile = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "fvp-copy-${{ github.run_id }}.json"

          $pattern = "$env:SOURCE_PATH/(*)"
          $target = "$env:TARGET_PATH/{1}"

          $spec = @{
              files = @(
                  @{
                      pattern = $pattern
                      target = $target
                      recursive = $true
                      flat = $true
                      excludePatterns = @(
                          '**/promotion.ready'
                      )
                  }
              )
          }

          $spec |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                  -LiteralPath $specFile `
                  -Encoding utf8

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP COPY SPECIFICATION'
          Write-Host '========================================'

          Write-Host 'Pattern:'
          Write-Host $pattern

          Write-Host ''
          Write-Host 'Target:'
          Write-Host $target

          Write-Host ''
          Write-Host 'Excluded:'
          Write-Host '**/promotion.ready'

          Write-Host ''
          Write-Host 'Spec file:'
          Write-Host $specFile

          Get-Content -LiteralPath $specFile

          "SPEC_FILE=$specFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 6. PREVIEW FVP COPY
      # ==========================================================

      - name: Preview approved folder copy to FVP
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP COPY DRY RUN'
          Write-Host '========================================'

          Write-Host 'Source:'
          Write-Host "$env:SOURCE_PATH/"

          Write-Host ''
          Write-Host 'Destination:'
          Write-Host "$env:TARGET_PATH/"

          jf rt copy `
              --spec="$env:SPEC_FILE" `
              --dry-run

          if ($LASTEXITCODE -ne 0) {
              throw 'FVP copy dry run failed.'
          }


      # ==========================================================
      # 7. COPY APPROVED FOLDER TO FVP
      #
      # Existing files at the same destination paths are replaced
      # with the newly approved Scout Clone versions.
      #
      # Files not present in the incoming Scout folder are not
      # deleted from FVP by this step.
      #
      # Scout Clone remains unchanged.
      # ==========================================================

      - name: Promote approved folder to FVP
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP APPROVED FOLDER PROMOTION'
          Write-Host '========================================'

          Write-Host 'Source:'
          Write-Host "$env:SOURCE_PATH/"

          Write-Host ''
          Write-Host 'Destination:'
          Write-Host "$env:TARGET_PATH/"

          Write-Host ''
          Write-Host 'Copying all approved artifacts.'
          Write-Host 'Nested hierarchy will be preserved.'
          Write-Host 'promotion.ready will not be copied.'

          jf rt copy `
              --spec="$env:SPEC_FILE" `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Approved folder promotion to FVP failed.'
          }

          Write-Host ''
          Write-Host 'Approved folder copy completed.'


      # ==========================================================
      # 8. VERIFY FVP DESTINATION
      # ==========================================================

      - name: Verify FVP destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_PATH/*"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VERIFY FVP DESTINATION'
          Write-Host '========================================'

          Write-Host 'Searching:'
          Write-Host $targetPattern

          $targetResult = jf rt search `
              "$targetPattern" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'FVP destination verification failed.'
          }

          $targetItems = @(
              $targetResult |
                  ConvertFrom-Json
          )

          $markerInFvp = @(
              $targetItems |
                  Where-Object {
                      $_.path.Replace('\', '/').EndsWith(
                          '/promotion.ready',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  }
          )

          if ($markerInFvp.Count -gt 0) {
              throw (
                  'promotion.ready was found in FVP. ' +
                  'The control file must not be promoted.'
              )
          }

          Write-Host ''
          Write-Host 'FVP destination verified.'
          Write-Host 'promotion.ready is not present in FVP.'


      # ==========================================================
      # 9. VERIFY SCOUT CLONE SOURCE REMAINS
      # ==========================================================

      - name: Verify Scout Clone source remains
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf rt search `
              "$env:SOURCE_PATH/*" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Scout Clone verification failed after promotion.'
              )
          }

          Write-Host ''
          Write-Host 'Scout Clone source remains unchanged.'


      # ==========================================================
      # 10. SUMMARY
      # ==========================================================

      - name: Promotion summary
        if: ${{ success() }}
        shell: pwsh

        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP PROMOTION SUCCESSFUL'
          Write-Host '========================================'

          Write-Host 'Build Type:'
          Write-Host $env:BUILD_TYPE

          Write-Host ''
          Write-Host 'Approved Promotion Path:'
          Write-Host $env:PROMOTION_PATH

          Write-Host ''
          Write-Host 'Scout Clone Source:'
          Write-Host "$env:SOURCE_PATH/"

          Write-Host ''
          Write-Host 'Final FVP Location:'
          Write-Host "$env:TARGET_PATH/"

          Write-Host ''
          Write-Host 'Artifacts Promoted:'
          Write-Host $env:ARTIFACT_COUNT

          Write-Host ''
          Write-Host 'Scout Clone Source:'
          Write-Host 'RETAINED'

          Write-Host ''
          Write-Host 'promotion.ready:'
          Write-Host 'NOT COPIED TO FVP'


      # ==========================================================
      # 11. CLEANUP
      # ==========================================================

      - name: Cleanup temporary copy specification
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true

        run: |
          if (
              $env:SPEC_FILE -and
              (Test-Path -LiteralPath $env:SPEC_FILE)
          ) {

              Remove-Item `
                  -LiteralPath $env:SPEC_FILE `
                  -Force
          }

          Write-Host 'Temporary FVP copy specification removed.'
