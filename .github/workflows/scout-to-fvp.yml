name: Scout Clone to FVP

run-name: >-
  Scout to FVP |
  ${{ github.event.client_payload.build_type }} |
  ${{ github.event.client_payload.promotion_path }}

# ================================================================
# POWER AUTOMATE APPROVAL ONLY
#
# This workflow CANNOT be manually started.
#
# It starts only when Power Automate sends:
#
# repository_dispatch
# event_type:
#   fvp-promotion-approved
#
# Expected Release payload:
#
# {
#   "promotion_path": "Official_Release/CW29/Release",
#   "build_type": "official-release",
#   "requested_by": "Power Automate"
# }
#
# Expected Hotfix payload:
#
# {
#   "promotion_path": "Official_Release/CW29/Hotfixes/HF01",
#   "build_type": "official-hotfix",
#   "requested_by": "Power Automate"
# }
#
# Legacy:
# build_type = official
#
# is normalized to:
# official-release
# ================================================================

on:
  repository_dispatch:
    types:
      - fvp-promotion-approved

permissions:
  contents: read

concurrency:
  group: >-
    scout-to-fvp-${{
      github.event.client_payload.promotion_path ||
      github.run_id
    }}

  cancel-in-progress: false

jobs:
  promote:
    name: Promote Approved Scout Folder to FVP

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

      PROMOTION_PATH_INPUT: >-
        ${{ github.event.client_payload.promotion_path }}

      BUILD_TYPE_INPUT: >-
        ${{ github.event.client_payload.build_type }}

      REQUESTED_BY: >-
        ${{ github.event.client_payload.requested_by }}

      APPROVAL_ID: >-
        ${{ github.event.client_payload.approval_id }}

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. SET UP JFROG CLI
      # ==========================================================

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true

        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}

          JF_ACCESS_TOKEN: >-
            ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      # ==========================================================
      # 2. VALIDATE + NORMALIZE POWER AUTOMATE REQUEST
      #
      # Accepted build types:
      #
      # official-release
      # official-hotfix
      #
      # Legacy:
      # official -> official-release
      # ==========================================================

      - name: Validate Power Automate promotion request
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')

          $fvpRepo = $env:FVP_REPO.Trim().Trim('/')

          $promotionPath = $env:PROMOTION_PATH_INPUT.Trim()
          $promotionPath = $promotionPath.Replace('\', '/')
          $promotionPath = $promotionPath.Trim('/')

          $buildType = $env:BUILD_TYPE_INPUT.Trim().ToLowerInvariant()

          if (-not $cloneRepo) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (-not $fvpRepo) {
              throw 'SCOUT_FVP_REPO secret is missing.'
          }

          if (-not $promotionPath) {
              throw 'Power Automate did not provide promotion_path.'
          }

          if (-not $buildType) {
              throw 'Power Automate did not provide build_type.'
          }

          # ------------------------------------------------------
          # Backward compatibility
          #
          # Your existing Power Automate may still send:
          #
          # official
          #
          # Normalize that to:
          #
          # official-release
          # ------------------------------------------------------

          if ($buildType -eq 'official') {

              Write-Host ''
              Write-Host 'Legacy build_type detected: official'
              Write-Host 'Normalizing to: official-release'

              $buildType = 'official-release'
          }

          if (
              $buildType -ne 'official-release' -and
              $buildType -ne 'official-hotfix'
          ) {
              throw (
                  'Unsupported build_type: ' +
                  $buildType +
                  '. Expected official-release or official-hotfix.'
              )
          }

          if ($promotionPath.Contains('..')) {
              throw 'promotion_path cannot contain ..'
          }

          if (
              -not $promotionPath.StartsWith(
                  'Official_Release/',
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {
              throw (
                  'promotion_path must begin with ' +
                  'Official_Release/.'
              )
          }

          # ------------------------------------------------------
          # Validate Release path
          #
          # Official_Release/CW29/Release
          # Official_Release/CW47/Release
          #
          # Future CW values work automatically.
          # ------------------------------------------------------

          if ($buildType -eq 'official-release') {

              if (
                  $promotionPath -notmatch
                  '^Official_Release/CW[0-9]{1,2}/Release$'
              ) {
                  throw (
                      'Official Release promotion_path must follow: ' +
                      'Official_Release/CWxx/Release. ' +
                      'Received: ' +
                      $promotionPath
                  )
              }
          }

          # ------------------------------------------------------
          # Validate Hotfix path
          #
          # Official_Release/CW29/Hotfixes/HF01
          # Official_Release/CW47/Hotfixes/HF10
          #
          # Future CW and HF values work automatically.
          # ------------------------------------------------------

          if ($buildType -eq 'official-hotfix') {

              if (
                  $promotionPath -notmatch
                  '^Official_Release/CW[0-9]{1,2}/Hotfixes/HF[0-9]{2,}$'
              ) {
                  throw (
                      'Official Hotfix promotion_path must follow: ' +
                      'Official_Release/CWxx/Hotfixes/HFxx. ' +
                      'Received: ' +
                      $promotionPath
                  )
              }
          }

          $sourcePath = "$cloneRepo/$promotionPath"

          $targetPath = "$fvpRepo/$promotionPath"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POWER AUTOMATE APPROVAL VALIDATED'
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Build Type:'
          Write-Host $buildType

          Write-Host ''
          Write-Host 'Approved Promotion Path:'
          Write-Host $promotionPath

          Write-Host ''
          Write-Host 'Scout Clone Source:'
          Write-Host $sourcePath

          Write-Host ''
          Write-Host 'FVP Destination:'
          Write-Host $targetPath

          if ($env:REQUESTED_BY) {

              Write-Host ''
              Write-Host 'Requested By:'
              Write-Host $env:REQUESTED_BY
          }

          if ($env:APPROVAL_ID) {

              Write-Host ''
              Write-Host 'Approval ID:'
              Write-Host $env:APPROVAL_ID
          }

          "PROMOTION_PATH=$promotionPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "BUILD_TYPE=$buildType" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "SOURCE_PATH=$sourcePath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 3. VERIFY JFROG CONNECTION
      # ==========================================================

      - name: Verify Scout JFrog connection
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

          jf rt ping

          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to connect to Scout JFrog.'
          }

          Write-Host ''
          Write-Host 'Scout JFrog connection successful.'

      # ==========================================================
      # 4. VERIFY EXACT APPROVED SOURCE PATH
      #
      # Release example:
      #
      # Scout Clone/
      # Official_Release/
      # CW29/
      # Release/
      # vw-group-commit-vault/
      # ...
      #
      # Hotfix example:
      #
      # Scout Clone/
      # Official_Release/
      # CW29/
      # Hotfixes/
      # HF01/
      # ...
      # ==========================================================

      - name: Verify approved Scout Clone folder
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_PATH/*"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VERIFY APPROVED SCOUT CLONE FOLDER'
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Searching:'
          Write-Host $sourcePattern

          $searchOutput = & jf rt search `
              "$sourcePattern" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'No artifacts were found under the approved ' +
                  'Scout Clone promotion path.'
              )
          }

          $jsonText = $searchOutput -join [Environment]::NewLine

          if (-not $jsonText) {
              throw 'JFrog search returned no content.'
          }

          try {
              $items = @(
                  $jsonText |
                      ConvertFrom-Json
              )
          }
          catch {

              Write-Host ''
              Write-Host 'Raw JFrog search output:'
              Write-Host $jsonText

              throw 'Unable to parse JFrog search output.'
          }

          $realArtifacts = @(
              $items |
                  Where-Object {

                      if (-not $_.path) {
                          return $true
                      }

                      $normalizedPath = $_.path.Replace('\', '/')

                      return (
                          -not $normalizedPath.EndsWith(
                              '/promotion.ready',
                              [System.StringComparison]::OrdinalIgnoreCase
                          ) -and
                          $normalizedPath -ne 'promotion.ready'
                      )
                  }
          )

          if ($realArtifacts.Count -eq 0) {
              throw (
                  'The approved folder contains no real artifacts.'
              )
          }

          Write-Host ''
          Write-Host 'Artifacts approved for FVP:'
          Write-Host $realArtifacts.Count

          Write-Host ''

          foreach ($item in $realArtifacts) {

              if ($item.path) {
                  Write-Host $item.path
              }
          }

          "ARTIFACT_COUNT=$($realArtifacts.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 5. CREATE COPY SPECIFICATION
      #
      # Copy everything under the approved path.
      #
      # Example Release:
      #
      # Scout:
      # Official_Release/CW29/Release/
      # └── vw-group-commit-vault/
      #     └── ...
      #
      # FVP:
      # Official_Release/CW29/Release/
      # └── vw-group-commit-vault/
      #     └── ...
      #
      # promotion.ready is excluded.
      # ==========================================================

      - name: Create FVP copy specification
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $specFile = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "fvp-copy-${{ github.run_id }}.json"

          $pattern = "$env:SOURCE_PATH/(*)"

          $target = "$env:TARGET_PATH/{1}"

          $spec = @{
              files = @(
                  @{
                      pattern = $pattern

                      target = $target

                      recursive = $true

                      flat = $true

                      excludePatterns = @(
                          'promotion.ready',
                          '**/promotion.ready'
                      )
                  }
              )
          }

          $spec |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                  -LiteralPath $specFile `
                  -Encoding utf8

          "SPEC_FILE=$specFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP COPY SPECIFICATION'
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Source Pattern:'
          Write-Host $pattern

          Write-Host ''
          Write-Host 'Target:'
          Write-Host $target

          Write-Host ''
          Write-Host 'Excluded:'
          Write-Host 'promotion.ready'

          Write-Host ''
          Write-Host 'Generated specification:'

          Get-Content `
              -LiteralPath $specFile

      # ==========================================================
      # 6. PREVIEW FVP COPY
      # ==========================================================

      - name: Preview approved folder copy to FVP
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP COPY DRY RUN'
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Source:'
          Write-Host "$env:SOURCE_PATH/"

          Write-Host ''
          Write-Host 'Destination:'
          Write-Host "$env:TARGET_PATH/"

          jf rt copy `
              --spec="$env:SPEC_FILE" `
              --dry-run

          if ($LASTEXITCODE -ne 0) {
              throw 'FVP copy dry run failed.'
          }

      # ==========================================================
      # 7. PROMOTE APPROVED FOLDER
      #
      # Behavior:
      #
      # File does not exist in FVP:
      #   copied
      #
      # File exists at same path:
      #   approved Scout version is copied to that path
      #
      # Other unrelated FVP files:
      #   unchanged
      #
      # Scout Clone:
      #   unchanged
      # ==========================================================

      - name: Promote approved folder to FVP
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PROMOTE APPROVED FOLDER TO FVP'
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Source:'
          Write-Host "$env:SOURCE_PATH/"

          Write-Host ''
          Write-Host 'Destination:'
          Write-Host "$env:TARGET_PATH/"

          jf rt copy `
              --spec="$env:SPEC_FILE" `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Approved folder promotion to FVP failed.'
          }

          Write-Host ''
          Write-Host 'Approved folder copied successfully.'

      # ==========================================================
      # 8. VERIFY FVP DESTINATION
      # ==========================================================

      - name: Verify FVP destination
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_PATH/*"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VERIFY FVP DESTINATION'
          Write-================================'

          Write-Host ''
          Write-Host 'Searching:'
          Write-Host $targetPattern

          $searchOutput = & jf rt search `
              "$targetPattern" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'FVP destination verification failed.'
          }

          $jsonText = $searchOutput -join :NewLine

          try {
              $targetItems = @(
                  $jsonText |
                      ConvertFrom-Json
              )
          }
          catch {
              throw 'Unable to parse FVP search response.'
          }

          $markerInFvp = @(
              $targetItems |
                  Where-Object {

                      if (-not $_.path) {
                          return $false
                      }

                      $normalizedPath = $_.path.Replace('\', '/')

                      return (
                          $normalizedPath.EndsWith(
                              '/promotion.ready',
                              [System.StringComparison]::OrdinalIgnoreCase
                          ) -or
                          $normalizedPath -eq 'promotion.ready'
                      )
                  }
          )

          if ($markerInFvp.Count -gt 0) {
              throw (
                  'promotion.ready was found in FVP. ' +
                  'The control file must never be promoted.'
              )
          }

          Write-Host ''
          Write-Host 'FVP destination verified successfully.'

          Write-Host ''
          Write-Host 'promotion.ready is not present in FVP.'

      # ==========================================================
      # 9. VERIFY SCOUT CLONE SOURCE STILL EXISTS
      # ==========================================================

      - name: Verify Scout Clone source remains
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'VERIFY SCOUT CLONE SOURCE'
          Write-Host '========================================'

          jf rt search `
              "$env:SOURCE_PATH/*" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Scout Clone source verification failed ' +
                  'after FVP promotion.'
              )
          }

          Write-Host ''
          Write-Host 'Scout Clone source remains unchanged.'

      # ==========================================================
      # 10. SUMMARY
      # ==========================================================

      - name: Promotion summary
        if: ${{ success() }}
        shell: pwsh

        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP PROMOTION SUCCESSFUL'
          Write-Host '========================================'

          Write-Host ''
          Write-Host 'Build Type:'
          Write-Host $env:BUILD_TYPE

          Write-Host ''
          Write-Host 'Approved Promotion Path:'
          Write-Host $env:PROMOTION_PATH

          Write-Host ''
          Write-Host 'Scout Clone Source:'
          Write-Host "$env:SOURCE_PATH/"

          Write-Host ''
          Write-Host 'FVP Destination:'
          Write-Host "$env:TARGET_PATH/"

          Write-Host ''
          Write-Host 'Artifacts Promoted:'
          Write-Host $env:ARTIFACT_COUNT

          Write-Host ''
          Write-Host 'Scout Clone Source:'
          Write-Host 'RETAINED'

          Write-Host ''
          Write-Host 'promotion.ready:'
          Write-Host 'NOT COPIED TO FVP'

          Write-Host ''
          Write-Host 'Trigger:'
          Write-Host 'POWER AUTOMATE APPROVAL / REPOSITORY_DISPATCH'

      # ==========================================================
      # 11. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true

        run: |
          if (
              $env:SPEC_FILE -and
              (Test-Path -LiteralPath $env:SPEC_FILE)
          ) {
              Remove-Item `
                  -LiteralPath $env:SPEC_FILE `
                  -Force
          }

          Write-Host ''
          Write-Host 'Temporary FVP copy specification removed.'
