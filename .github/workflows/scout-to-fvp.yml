name: Scout Clone to FVP

on:
  workflow_dispatch:
    inputs:
      folder_path:
        description: "Exact folder path inside Scout Clone"
        required: true
        type: string

      build_type:
        description: "Promotion type"
        required: true
        type: choice
        options:
          - official-release
          - official-hotfix

  repository_dispatch:
    types:
      - scout-to-fvp

jobs:
  promote-to-fvp:
    name: Promote Scout Clone to FVP
    runs-on: self-hosted

    env:
      SOURCE_REPO: rvtm-vw-rvt-scout-build-binaries-clone
      TARGET_REPO: eeint2-Scout-FVP-Release

    steps:

      # ============================================================
      # Resolve inputs
      # Supports:
      # 1. Manual workflow_dispatch
      # 2. Power Automate / repository_dispatch
      # ============================================================

      - name: Resolve promotion inputs
        id: inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {

              $folderPath = "${{ inputs.folder_path }}"
              $buildType  = "${{ inputs.build_type }}"

          } elseif ("${{ github.event_name }}" -eq "repository_dispatch") {

              $folderPath = "${{ github.event.client_payload.folder_path }}"
              $buildType  = "${{ github.event.client_payload.build_type }}"

          } else {

              throw "Unsupported trigger: ${{ github.event_name }}"

          }

          $folderPath = $folderPath.Trim()
          $folderPath = $folderPath.Replace('\', '/')
          $folderPath = $folderPath.Trim('/')

          $buildType = $buildType.Trim().ToLower()

          if ([string]::IsNullOrWhiteSpace($folderPath)) {
              throw "folder_path cannot be empty."
          }

          Write-Host "============================================"
          Write-Host "Scout -> FVP Promotion"
          Write-Host "============================================"
          Write-Host "Trigger     : ${{ github.event_name }}"
          Write-Host "Build Type  : $buildType"
          Write-Host "Folder Path : $folderPath"
          Write-Host "============================================"

          switch ($buildType) {

              "official-release" {

                  if ($folderPath -notmatch '(^|/)Official_Release(/|$)' -or
                      $folderPath -notmatch '(^|/)Release(/|$)') {

                      throw "official-release requires an Official_Release/.../Release path. Received: $folderPath"
                  }

              }

              "official-hotfix" {

                  if ($folderPath -notmatch '(^|/)Official_Release(/|$)' -or
                      $folderPath -notmatch '(^|/)Hotfixes(/|$)') {

                      throw "official-hotfix requires an Official_Release/.../Hotfixes/... path. Received: $folderPath"
                  }

              }

              "daily" {

                  throw "Daily builds are not permitted for FVP promotion."

              }

              default {

                  throw "Unsupported build_type: $buildType. Expected official-release or official-hotfix."

              }
          }

          "folder_path=$folderPath" >> $env:GITHUB_OUTPUT
          "build_type=$buildType"   >> $env:GITHUB_OUTPUT


      # ============================================================
      # Configure JFrog
      #
      # Both repositories are Scout JFrog Cloud.
      # Only one server configuration is required.
      # ============================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          JFROG_URL: ${{ secrets.TARGET_URL }}
          JFROG_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf c remove scout-fvp --quiet 2>$null

          jf c add scout-fvp `
            --url="$env:JFROG_URL" `
            --access-token="$env:JFROG_TOKEN" `
            --interactive=false

          jf rt ping --server-id=scout-fvp


      # ============================================================
      # Show exact source -> destination
      # ============================================================

      - name: Show promotion mapping
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.inputs.outputs.folder_path }}
          BUILD_TYPE: ${{ steps.inputs.outputs.build_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:SOURCE_REPO/$env:FOLDER_PATH"
          $target = "$env:TARGET_REPO/$env:FOLDER_PATH"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION"
          Write-Host "============================================"
          Write-Host "Build Type:"
          Write-Host "  $env:BUILD_TYPE"
          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "  $source"
          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "  $target"
          Write-Host "============================================"


      # ============================================================
      # Verify source exists
      # ============================================================

      - name: Verify source folder
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.inputs.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_REPO/$env:FOLDER_PATH/*"

          Write-Host "Checking:"
          Write-Host $sourcePattern

          jf rt search `
            "$sourcePattern" `
            --server-id=scout-fvp `
            --limit=1 `
            --fail-no-op


      # ============================================================
      # Scout Clone -> FVP
      #
      # IMPORTANT:
      # Destination receives EXACT same relative folder path.
      #
      # Clone:
      #   Official_Release/CWxx/Release/...
      #
      # FVP:
      #   Official_Release/CWxx/Release/...
      #
      # Clone:
      #   Official_Release/CWxx/Hotfixes/HF01/...
      #
      # FVP:
      #   Official_Release/CWxx/Hotfixes/HF01/...
      # ============================================================

      - name: Copy Scout Clone to FVP
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.inputs.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:SOURCE_REPO/$env:FOLDER_PATH/"
          $target = "$env:TARGET_REPO/$env:FOLDER_PATH/"

          Write-Host ""
          Write-Host "Copying Scout Clone -> FVP"
          Write-Host ""
          Write-Host "Source:"
          Write-Host $source
          Write-Host ""
          Write-Host "Target:"
          Write-Host $target
          Write-Host ""

          jf rt cp `
            "$source*" `
            "$target" `
            --server-id=scout-fvp `
            --recursive=true `
            --flat=false `
            --fail-no-op

          Write-Host ""
          Write-Host "Promotion completed successfully." -ForegroundColor Green


      # ============================================================
      # Verify destination
      # ============================================================

      - name: Verify FVP destination
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.inputs.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_REPO/$env:FOLDER_PATH/*"

          Write-Host ""
          Write-Host "Verifying FVP:"
          Write-Host $targetPattern

          jf rt search `
            "$targetPattern" `
            --server-id=scout-fvp `
            --limit=1 `
            --fail-no-op

          Write-Host ""
          Write-Host "FVP verification successful." -ForegroundColor Green


      # ================================== # Cleanup
      # ============================================================

      - name: Cleanup JFrog configuration
        if: always()
        shell: pwsh
        run: |
          jf c remove scout-fvp --quiet 2>$null
          exit 0
