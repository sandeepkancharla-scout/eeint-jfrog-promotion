name: Scout Clone to FVP

run-name: "FVP Promotion | ${{ github.event.client_payload.folder_name }}"

on:
  repository_dispatch:
    types:
      - fvp-promotion-approved

  # Keep manual execution while we are testing.
  workflow_dispatch:
    inputs:
      folder_name:
        description: "Scout folder to promote to FVP"
        required: true
        type: string


permissions:
  contents: read


# Prevent duplicate promotion jobs for the same folder.
concurrency:
  group: fvp-promotion-${{ github.event.client_payload.folder_name || inputs.folder_name }}
  cancel-in-progress: false


jobs:

  promote:

    name: Copy Approved Scout Folder to FVP

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 60


    env:

      SCOUT_SERVER_ID: scout-fvp-promotion

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO


    steps:


      # ==========================================================
      # 1. RESOLVE FOLDER NAME
      # ==========================================================

      - name: Resolve Approved Folder

        id: request

        shell: pwsh

        env:

          EVENT_NAME: ${{ github.event_name }}

          DISPATCH_FOLDER: ${{ github.event.client_payload.folder_name }}

          MANUAL_FOLDER: ${{ inputs.folder_name }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host 'Trigger:'

          Write-Host $env:EVENT_NAME


          if ($env:EVENT_NAME -eq 'repository_dispatch') {

              $folderName = $env:DISPATCH_FOLDER

          }
          else {

              $folderName = $env:MANUAL_FOLDER

          }


          if (-not $folderName) {

              throw 'folder_name was not provided.'

          }


          $folderName = $folderName.Trim()


          if ($folderName -notmatch '^[A-Za-z0-9._() -]+$') {

              throw 'folder_name contains unsupported characters.'

          }


          if ($folderName.Contains('..')) {

              throw 'folder_name cannot contain ..'

          }


          $folderName = $folderName.Trim('/').Trim('\').Trim()


          if (-not $folderName) {

              throw 'folder_name is invalid.'

          }


          Write-Host ''

          Write-Host 'Approved folder:'

          Write-Host $folderName


          "folder_name=$folderName" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 2. VALIDATE REQUIRED SECRETS
      # ==========================================================

      - name: Validate Scout Configuration

        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}

          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

        run: |

          $ErrorActionPreference = 'Stop'


          if (-not $env:SCOUT_URL) {

              throw 'SCOUT_JFROG_URL secret is missing.'

          }


          if (-not $env:SCOUT_TOKEN) {

              throw 'SCOUT_JFROG_ACCESS_TOKEN secret is missing.'

          }


          if (-not $env:CLONE_REPO) {

              throw 'SCOUT_CLONE_REPO secret is missing.'

          }


          if (-not $env:FVP_REPO) {

              throw 'SCOUT_FVP_REPO secret is missing.'

          }


          Write-Host 'Scout FVP promotion configuration is available.'


      # ==========================================================
      # 3. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI

        uses: jfrog/setup-jfrog-cli@v4

        with:

          disable-auto-build-publish: true


      # ==========================================================
      # 4. VERIFY JFROG CLI
      # ==========================================================

      - name: Verify JFrog CLI

        shell: pwsh

        run: |

          $ErrorActionPreference = 'Stop'


          jf --version


          if ($LASTEXITCODE -ne 0) {

              throw 'JFrog CLI is unavailable.'

          }


      # ==========================================================
      # 5. CLEAN OLD CONFIGURATION
      # ==========================================================

      - name: Cleanup Existing Scout Configuration

        shell: pwsh

        continue-on-error: true

        run: |

          jf c rm `
              "$env:SCOUT_SERVER_ID" `
              --quiet


      # ==========================================================
      # 6. CONFIGURE SCOUT
      #
      # Only ONE Scout connection is required because both
      # repositories are on the same Scout JFrog instance.
      # ==========================================================

      - name: Configure Scout JFrog

        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}

          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = 'Stop'


          jf c add `
              "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Failed to configure Scout JFrog.'

          }


      # ==========================================================
      # 7. VERIFY CONNECTION
      # ==========================================================

      - name: Verify Scout Connection

        shell: pwsh

        run: |

          $ErrorActionPreference = 'Stop'


          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw 'Unable to connect to Scout JFrog.'

          }


          Write-Host 'Scout JFrog connection verified.'


      # ==========================================================
      # 8. BUILD SOURCE AND TARGET PATHS
      #
      # Example:
      #
      # folder_name:
      # POC-001
      #
      # Source:
      # clone-repo/POC-001
      #
      # Target:
      # fvp-repo/POC-001
      #
      # Copy mapping:
      #
      # clone-repo/POC-001/(**)
      #             |
      #             +----------> {1}
      #
      # fvp-repo/POC-001/{1}
      #
      # The source root folder is NOT duplicated.
      # ==========================================================

      - name: Build Promotion Paths

        id: paths

        shell: pwsh

        env:

          CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

          FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

          FOLDER_NAME: ${{ steps.request.outputs.folder_name }}

        run: |

          $ErrorActionPreference = 'Stop'


          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')

          $fvpRepo = $env:FVP_REPO.Trim().Trim('/')

          $folderName = $env:FOLDER_NAME.Trim().Trim('/')


          if (-not $cloneRepo) {

              throw 'Scout Clone repository is empty.'

          }


          if (-not $fvpRepo) {

              throw 'Scout FVP repository is empty.'

          }


          if ($cloneRepo -eq $fvpRepo) {

              throw 'Scout Clone and FVP repositories cannot be identical.'

          }


          $sourceRoot = "$cloneRepo/$folderName"

          $targetRoot = "$fvpRepo/$folderName"


          # Used only for source verification.
          $sourceSearchPattern = "$sourceRoot/*"


          # Explicit mapping prevents:
          #
          # POC-001/POC-001/...
          #
          # Everything BELOW the approved folder is captured and
          # reconstructed under the corresponding FVP folder.
          $copySourcePattern = "$sourceRoot/(**)"

          $copyTargetPattern = "$targetRoot/{1}"


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'APPROVED FVP PROMOTION PLAN'

          Write-Host '========================================'


          Write-Host 'Folder:'

          Write-Host $folderName


          Write-Host 'Scout Clone source:'

          Write-Host $sourceRoot


          Write-Host 'FVP destination:'

          Write-Host $targetRoot


          Write-Host 'Source search pattern:'

          Write-Host $sourceSearchPattern


          Write-Host 'Copy source pattern:'

          Write-Host $copySourcePattern


          Write-Host 'Copy target pattern:'

          Write-Host $copyTargetPattern


          "source_root=$sourceRoot" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "target_root=$targetRoot" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "source_search_pattern=$sourceSearchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "copy_source_pattern=$copySourcePattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "copy_target_pattern=$copyTargetPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 9. VERIFY APPROVED SOURCE EXISTS IN SCOUT CLONE
      # ==========================================================

      - name: Verify Scout Clone Source

        shell: pwsh

        env:

          SOURCE_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host 'Verifying Scout Clone source:'

          Write-Host $env:SOURCE_PATTERN


          jf rt search `
              "$env:SOURCE_PATTERN" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Approved Scout Clone folder contains no artifacts.'

          }


          Write-Host 'Scout Clone source verified.'


      # ==========================================================
      # 10. DRY RUN COPY
      #
      # JFrog placeholders explicitly map the hierarchy beneath
      # the approved folder into the corresponding FVP folder.
      # ==========================================================

      - name: Preview Scout to FVP Copy

        shell: pwsh

        env:

          COPY_SOURCE_PATTERN: ${{ steps.paths.outputs.copy_source_pattern }}

          COPY_TARGET_PATTERN: ${{ steps.paths.outputs.copy_target_pattern }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'FVP COPY DRY RUN'

          Write-Host '========================================'


          Write-Host 'FROM:'

          Write-Host $env:COPY_SOURCE_PATTERN


          Write-Host 'TO:'

          Write-Host $env:COPY_TARGET_PATTERN


          jf rt copy `
              "$env:COPY_SOURCE_PATTERN" `
              "$env:COPY_TARGET_PATTERN" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=false `
              --flat=true `
              --dry-run


          if ($LASTEXITCODE -ne 0) {

              throw 'Scout to FVP copy dry run failed.'

          }


          Write-Host 'FVP copy preview completed.'


      # ==========================================================
      # 11. COPY APPROVED FOLDER TO FVP
      #
      # COPY, NOT MOVE.
      #
      # Scout Clone remains after this operation.
      # ==========================================================

      - name: Copy Approved Folder to FVP

        shell: pwsh

        env:

          COPY_SOURCE_PATTERN: ${{ steps.paths.outputs.copy_source_pattern }}

          COPY_TARGET_PATTERN: ${{ steps.paths.outputs.copy_target_pattern }}

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host ''

          Write-Host '========================================'

          Write-Host 'COPYING APPROVED FOLDER TO FVP'

          Write-Host '========================================'


          Write-Host 'FROM:'

          Write-Host $env:COPY_SOURCE_PATTERN


          Write-Host 'TO:'

          Write-Host $env:COPY_TARGET_PATTERN


          jf rt copy `
              "$env:COPY_SOURCE_PATTERN" `
              "$env:COPY_TARGET_PATTERN" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=false `
              --flat=true `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Scout to FVP artifact copy failed.'

          }


          Write-Host 'Scout to FVP copy completed.'


      # ==========================================================
      # 12. VERIFY FVP
      # ==========================================================

      - name: Verify FVP Destination

        shell: pwsh

        env:

          TARGET_ROOT: ${{ steps.paths.outputs.target_root }}

        run: |

          $ErrorActionPreference = 'Stop'


          $targetPattern = "$env:TARGET_ROOT/*"


          Write-Host 'Verifying FVP destination:'

          Write-Host $targetPattern


          jf rt search `
              "$targetPattern" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'FVP verification failed.'

          }


          Write-Host 'FVP destination verified.'


      # ==========================================================
      # 13. VERIFY CLONE STILL EXISTS
      #
      # The approved operation is a COPY. Verify the original
      # Scout Clone folder was not removed.
      # ==========================================================

      - name: Verify Scout Clone Remains

        shell: pwsh

        env:

          SOURCE_ROOT: ${{ steps.paths.outputs.source_root }}

        run: |

          $ErrorActionPreference = 'Stop'


          $sourcePattern = "$env:SOURCE_ROOT/*"


          Write-Host 'Verifying Scout Clone still exists:'

          Write-Host $sourcePattern


          jf rt search `
              "$sourcePattern" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Scout Clone source is missing after FVP copy.'

          }


          Write-Host 'Scout Clone remains available.'


      # ==========================================================
      # 14. SUMMARY
      # ==========================================================

      - name: Promotion Summary

        if: success()

        shell: pwsh

        env:

          FOLDER_NAME: ${{ steps.request.outputs.folder_name }}

          SOURCE_ROOT: ${{ steps.paths.outputs.source_root }}

          TARGET_ROOT: ${{ steps.paths.outputs.target_root }}

        run: |

          Write-Host ''

          Write-Host '========================================'

          Write-Host 'FVP PROMOTION SUCCESSFUL'

          Write-Host '========================================'


          Write-Host 'Approved folder:'

          Write-Host $env:FOLDER_NAME


          Write-Host 'Scout Clone:'

          Write-Host $env:SOURCE_ROOT


          Write-Host 'FVP destination:'

          Write-Host $env:TARGET_ROOT


          Write-Host ''

          Write-Host 'Scout Clone status:'

          Write-Host 'AVAILABLE'


          Write-Host 'FVP status:'

          Write-Host 'PUBLISHED'


          Write-Host 'Operation:'

          Write-Host 'COPY'


      # ==========================================================
      # 15. CLEANUP
      # ==========================================================

      - name: Cleanup Scout Configuration

        if: always()

        shell: pwsh

        continue-on-error: true

        run: |

          jf c rm `
              "$env:SCOUT_SERVER_ID" `
              --quiet


          Write-Host 'Scout JFrog configuration removed.'
