name: Scout Clone to FVP

run-name: >-
  Scout to FVP |
  ${{ github.event.client_payload.build_type }} |
  ${{ github.event.client_payload.promotion_path }}

# ================================================================
# POWER AUTOMATE APPROVAL ONLY
#
# There is intentionally no workflow_dispatch trigger.
# This workflow starts only after Power Automate sends:
#
# event_type = fvp-promotion-approved
# ================================================================

on:
  repository_dispatch:
    types:
      - fvp-promotion-approved

permissions:
  contents: read

concurrency:
  group: >-
    scout-to-fvp-${{
      github.event.client_payload.promotion_path ||
      github.run_id
    }}

  cancel-in-progress: false

jobs:
  promote:
    name: Promote Approved Scout Folder to FVP

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 120

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

      PROMOTION_PATH: >-
        ${{ github.event.client_payload.promotion_path }}

      BUILD_TYPE: >-
        ${{ github.event.client_payload.build_type }}

      REQUESTED_BY: >-
        ${{ github.event.client_payload.requested_by }}

      APPROVAL_ID: >-
        ${{ github.event.client_payload.approval_id }}

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:
      # ==========================================================
      # 1. SET UP JFROG CLI
      # ==========================================================

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      # ==========================================================
      # 2. VALIDATE POWER AUTOMATE DISPATCH
      # ==========================================================

      - name: Validate Power Automate promotion request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cloneRepo = $env:CLONE_REPO.Trim().Trim('/')
          $fvpRepo = $env:FVP_REPO.Trim().Trim('/')
          $promotionPath = $env:PROMOTION_PATH.Trim().Trim('/')
          $buildType = $env:BUILD_TYPE.Trim().ToLowerInvariant()

          if (-not $cloneRepo) {
              throw 'SCOUT_CLONE_REPO secret is missing.'
          }

          if (-not $fvpRepo) {
              throw 'SCOUT_FVP_REPO secret is missing.'
          }

          if (-not $promotionPath) {
              throw 'Power Automate did not provide promotion_path.'
          }

          if (-not $buildType) {
              throw 'Power Automate did not provide build_type.'
          }

          if (
              $buildType -ne 'official-release' -and
              $buildType -ne 'official-hotfix'
          ) {
              throw (
                  'build_type must be official-release ' +
                  'or official-hotfix.'
              )
          }

          if ($promotionPath.Contains('..')) {
              throw 'promotion_path cannot contain ..'
          }

          if (
              -not $promotionPath.StartsWith(
                  'Official_Release/',
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {
              throw (
                  'Approved promotion_path must begin with ' +
                  'Official_Release/.'
              )
          }

          if ($buildType -eq 'official-release') {
              if (
                  $promotionPath -notmatch
                  '^Official_Release/CW[0-9]+ \(OTA [^)]+\)/Release$'
              ) {
                  throw (
                      'Release path must follow: ' +
                      'Official_Release/CWxx (OTA version)/Release'
                  )
              }
          }

          if ($buildType -eq 'official-hotfix') {
              if (
                  $promotionPath -notmatch
                  '^Official_Release/CW[0-9]+ \(OTA [^)]+\)/Hotfixes$'
              ) {
                  throw (
                      'Hotfix path must follow: ' +
                      'Official_Release/CWxx (OTA version)/Hotfixes'
                  )
              }
          }

          $sourcePath = "$cloneRepo/$promotionPath"
          $targetPath = "$fvpRepo/$promotionPath"

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'POWER AUTOMATE APPROVAL VALIDATED'
          Write-Host '========================================'
          Write-Host "Build Type: $buildType"
          Write-Host "Promotion Path: $promotionPath"
          Write-Host "Scout Source: $sourcePath"
          Write-Host "FVP Target: $targetPath"

          "PROMOTION_PATH=$promotionPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "BUILD_TYPE=$buildType" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "SOURCE_PATH=$sourcePath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "TARGET_PATH=$targetPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 3. VERIFY JFROG CONNECTION
      # ==========================================================

      - name: Verify Scout JFrog connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is unavailable.'
          }

          jf rt ping

          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to connect to Scout JFrog.'
          }

          Write-Host 'Scout JFrog connection successful.'

      # ==========================================================
      # 4. VERIFY APPROVED SOURCE PATH
      # ==========================================================

      - name: Verify approved Scout Clone folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_PATH/*"

          Write-Host "Searching: $sourcePattern"

          $searchResult = jf rt search `
              "$sourcePattern" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'No artifacts were found under the approved ' +
                  'Scout Clone promotion path.'
              )
          }

          $items = @(
              $searchResult |
                  ConvertFrom-Json
          )

          $realArtifacts = @(
              $items |
                  Where-Object {
                      $path = $_.path.Replace('\', '/')

                      -not $path.EndsWith(
                          '/promotion.ready',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  }
          )

          if ($realArtifacts.Count -eq 0) {
              throw (
                  'The approved folder contains no real artifacts.'
              )
          }

          Write-Host "Real artifact count: $($realArtifacts.Count)"

          foreach ($item in $realArtifacts) {
              Write-Host $item.path
          }

          "ARTIFACT_COUNT=$($realArtifacts.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 5. CREATE COPY FILE SPEC
      #
      # promotion.ready is excluded from FVP.
      # ==========================================================

      - name: Create FVP copy specification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $specFile = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "fvp-copy-${{ github.run_id }}.json"

          $pattern = "$env:SOURCE_PATH/(*)"
          $target = "$env:TARGET_PATH/{1}"

          $spec = @{
              files = @(
                  @{
                      pattern = $pattern
                      target = $target
                      recursive = $true
                      flat = $true
                      excludePatterns = @(
                          '**/promotion.ready'
                      )
                  }
              )
          }

          $spec |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                  -LiteralPath $specFile `
                  -Encoding utf8

          Write-Host "Pattern: $pattern"
          Write-Host "Target: $target"
          Write-Host 'Excluded: **/promotion.ready'

          "SPEC_FILE=$specFile" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

      # ==========================================================
      # 6. PREVIEW COPY
      # ==========================================================

      - name: Preview approved folder copy to FVP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt copy `
              --spec="$env:SPEC_FILE" `
              --dry-run

          if ($LASTEXITCODE -ne 0) {
              throw 'FVP copy dry run failed.'
          }

      # ==========================================================
      # 7. COPY APPROVED FOLDER TO FVP
      #
      # Existing files at the same destination paths are updated.
      # New files are copied.
      # Scout Clone remains unchanged.
      # ==========================================================

      - name: Promote approved folder to FVP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Source: $env:SOURCE_PATH/"
          Write-Host "Destination: $env:TARGET_PATH/"

          jf rt copy `
              --spec="$env:SPEC_FILE" `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Approved folder promotion to FVP failed.'
          }

          Write-Host 'Approved folder copy completed.'

      # ==========================================================
      # 8. VERIFY FVP
      # ==========================================================

      - name: Verify FVP destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_PATH/*"

          $targetResult = jf rt search `
              "$targetPattern" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'FVP destination verification failed.'
          }

          $targetItems = @(
              $targetResult |
                  ConvertFrom-Json
          )

          $markerInFvp = @(
              $targetItems |
                  Where-Object {
                      $_.path.Replace('\', '/').EndsWith(
                          '/promotion.ready',
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  }
          )

          if ($markerInFvp.Count -gt 0) {
              throw 'promotion.ready was found in FVP.'
          }

          Write-Host 'FVP destination verified.'
          Write-Host 'promotion.ready is not present in FVP.'

      # ==========================================================
      # 9. VERIFY SCOUT SOURCE REMAINS
      # ==========================================================

      - name: Verify Scout Clone source remains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt search `
              "$env:SOURCE_PATH/*" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout Clone verification failed after promotion.'
          }

          Write-Host 'Scout Clone source remains unchanged.'

      # ==========================================================
      # 10. SUMMARY
      # ==========================================================

      - name: Promotion summary
        if: ${{ success() }}
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'FVP PROMOTION SUCCESSFUL'
          Write-Host '========================================'
          Write-Host "Build Type: $env:BUILD_TYPE"
          Write-Host "Promotion Path: $env:PROMOTION_PATH"
          Write-Host "Scout Source: $env:SOURCE_PATH/"
          Write-Host "FVP Destination: $env:TARGET_PATH/"
          Write-Host "Artifacts Promoted: $env:ARTIFACT_COUNT"
          Write-Host 'Scout Clone Source: RETAINED'
          Write-Host 'promotion.ready: NOT COPIED TO FVP'

      # ==========================================================
      # 11. CLEANUP
      # ==========================================================

      - name: Cleanup temporary copy specification
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          if (
              $env:SPEC_FILE -and
              (Test-Path -LiteralPath $env:SPEC_FILE)
          ) {
              Remove-Item `
                  -LiteralPath $env:SPEC_FILE `
                  -Force
          }

          Write-Host 'Temporary FVP copy specification removed.'
