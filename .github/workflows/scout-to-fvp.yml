name: Scout Clone to FVP

on:
  workflow_dispatch:
    inputs:
      promotion_path:
        description: "Official_Release path inside Scout Clone"
        required: true
        type: string

      release_folder:
        description: "Release/CW number"
        required: true
        type: string

  repository_dispatch:
    types:
      - fvp-promotion-approved

permissions:
  contents: read

jobs:
  promote:
    name: Promote Approved Official Artifact to FVP

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 30

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

      PROMOTION_PATH: >-
        ${{ github.event.client_payload.promotion_path ||
            inputs.promotion_path }}

      RELEASE_FOLDER: >-
        ${{ github.event.client_payload.calendar_week ||
            inputs.release_folder }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Validate promotion request
        shell: cmd
        run: |
          @echo off

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if "%FVP_REPO%"=="" (
            echo ERROR: SCOUT_FVP_REPO is missing.
            exit /b 1
          )

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if "%RELEASE_FOLDER%"=="" (
            echo ERROR: Release/CW number is required.
            exit /b 1
          )

          echo %PROMOTION_PATH% | findstr /B /I /C:"Official_Release/%RELEASE_FOLDER%/" >nul

          if errorlevel 1 (
            echo ERROR: Invalid Official promotion path.
            echo.
            echo Expected prefix:
            echo Official_Release/%RELEASE_FOLDER%/
            echo.
            echo Received:
            echo %PROMOTION_PATH%
            exit /b 1
          )

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Cannot connect to Scout JFrog.
            exit /b 1
          )

          echo ========================================
          echo PROMOTION REQUEST VALIDATED
          echo ========================================
          echo Clone Repository:
          echo %CLONE_REPO%
          echo.
          echo FVP Repository:
          echo %FVP_REPO%
          echo.
          echo Promotion Path:
          echo %PROMOTION_PATH%
          echo.
          echo Release/CW:
          echo %RELEASE_FOLDER%

      - name: Calculate FVP destination
        id: destination
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion

          set "RELATIVE_PATH=%PROMOTION_PATH:*Official_Release/%RELEASE_FOLDER%/=%"

          if "!RELATIVE_PATH!"=="" (
            echo ERROR: Unable to calculate relative path.
            exit /b 1
          )

          if "!RELATIVE_PATH!"=="%PROMOTION_PATH%" (
            echo ERROR: Official_Release path prefix not found.
            exit /b 1
          )

          set "FVP_PATH=%RELEASE_FOLDER%/!RELATIVE_PATH!"

          echo relative_path=!RELATIVE_PATH!>>"%GITHUB_OUTPUT%"
          echo fvp_path=!FVP_PATH!>>"%GITHUB_OUTPUT%"

          echo FVP destination:
          echo %FVP_REPO%/!FVP_PATH!

          endlocal

      - name: Verify approved artifact exists in Scout Clone
        shell: cmd
        run: |
          @echo off

          echo Checking:
          echo %CLONE_REPO%/%PROMOTION_PATH%

          jf rt search ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Approved artifact was not found in Scout Clone.
            exit /b 1
          )

          echo Approved artifact found.

      - name: Promote approved artifact to FVP
        shell: cmd
        env:
          FVP_PATH: ${{ steps.destination.outputs.fvp_path }}
        run: |
          @echo off

          echo ========================================
          echo FVP PROMOTION
          echo ========================================
          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%
          echo.
          echo Destination:
          echo %FVP_REPO%/%FVP_PATH%

          jf rt copy ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            "%FVP_REPO%/%FVP_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP promotion failed.
            exit /b 1
          )

          jf rt search ^
            "%FVP_REPO%/%FVP_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP destination verification failed.
            exit /b 1
          )

          echo.
          echo ========================================
          echo FVP PROMOTION SUCCESSFUL
          echo ========================================
          echo Final location:
          echo %FVP_REPO%/%FVP_PATH%
