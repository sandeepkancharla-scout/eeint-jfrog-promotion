name: Scout Clone to FVP

on:
  repository_dispatch:
    types:
      - scout-to-fvp

jobs:
  promote-to-fvp:
    name: Promote Scout Clone to FVP
    runs-on: self-hosted

    env:
      SOURCE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      TARGET_REPO: ${{ secrets.SCOUT_FVP_REPO }}

    steps:

      # ============================================================
      # 1. Resolve source and target paths
      #
      # Official Release:
      #
      # Scout Clone:
      # Official_Release/CW11/Release
      #
      # FVP:
      # CW11/Release
      #
      #
      # Hotfix:
      #
      # Scout Clone:
      # Official_Release/CW11/Hotfixes/HF01
      #
      # FVP:
      # CW11/Hotfixes/HF01
      #
      #
      # Daily:
      #
      # Scout Clone:
      # Daily_Builds/2026-10-29/...
      #
      # FVP:
      # Daily_Builds/2026-10-29/...
      # ============================================================

      - name: Resolve promotion paths
        id: resolve
        shell: pwsh
        env:
          INPUT_FOLDER_PATH: ${{ github.event.client_payload.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath = "$env:INPUT_FOLDER_PATH".Trim()

          if ([string]::IsNullOrWhiteSpace($sourcePath)) {
              throw "Power Automate did not provide client_payload.folder_path."
          }

          # Normalize separators
          $sourcePath = $sourcePath.Replace('\', '/').Trim('/')

          # --------------------------------------------------------
          # Power Automate may send complete Artifactory URL.
          # Strip everything through Scout Clone repository name.
          # --------------------------------------------------------

          $repoMarker = "$env:SOURCE_REPO/"

          $markerPosition = $sourcePath.IndexOf(
              $repoMarker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($markerPosition -ge 0) {

              $sourcePath = $sourcePath.Substring(
                  $markerPosition + $repoMarker.Length
              )
          }

          $sourcePath = $sourcePath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($sourcePath)) {
              throw "Unable to determine Scout Clone source path."
          }


          # ========================================================
          # Official Release / Hotfix
          #
          # Remove ONLY:
          #
          # Official_Release/
          #
          # Example:
          #
          # Official_Release/CW11/Release
          #
          # becomes:
          #
          # CW11/Release
          # ========================================================

          if (
              $sourcePath.StartsWith(
                  "Official_Release/",
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {

              $promotionType = "official"

              $targetPath = $sourcePath.Substring(
                  "Official_Release/".Length
              )
          }


          # ========================================================
          # Daily
          #
          # Keep Daily_Builds hierarchy exactly.
          # ========================================================

          elseif (
              $sourcePath.StartsWith(
                  "Daily_Builds/",
                  [System.StringComparison]::OrdinalIgnoreCase
              )
          ) {

              $promotionType = "daily"

              $targetPath = $sourcePath
          }


          else {

              throw "Unsupported promotion path: $sourcePath"
          }


          $targetPath = $targetPath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($targetPath)) {
              throw "Unable to determine FVP target path."
          }


          Write-Host ""
          Write-Host "============================================"
          Write-Host "SCOUT CLONE TO FVP"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Promotion Type:"
          Write-Host "$promotionType"

          Write-Host ""
          Write-Host "Scout Source:"
          Write-Host "$env:SOURCE_REPO/$sourcePath"

          Write-Host ""
          Write-Host "FVP Target:"
          Write-Host "$env:TARGET_REPO/$targetPath"

          Write-Host ""
          Write-Host "============================================"


          "source_path=$sourcePath" >> $env:GITHUB_OUTPUT
          "target_path=$targetPath" >> $env:GITHUB_OUTPUT
          "promotion_type=$promotionType" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 2. Setup JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4


      # ============================================================
      # 3. Configure Scout JFrog
      # ============================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JFROG_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:JFROG_URL)) {
              throw "SCOUT_JFROG_URL secret is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:JFROG_TOKEN)) {
              throw "SCOUT_JFROG_ACCESS_TOKEN secret is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO)) {
              throw "SCOUT_CLONE_REPO secret is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_REPO)) {
              throw "SCOUT_FVP_REPO secret is empty."
          }


          Write-Host ""
          Write-Host "Configuring Scout JFrog..."


          # Remove an existing local CLI config if present.
          # Ignore failure because it may not exist.

          & jf c remove scout-fvp --quiet 2>$null

          $global:LASTEXITCODE = 0


          # Create fresh configuration

          & jf c add scout-fvp `
              --url="$env:JFROG_URL" `
              --access-token="$env:JFROG_TOKEN" `
              --interactive=false


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to configure Scout JFrog."
          }


          Write-Host ""
          Write-Host "Testing Scout JFrog connection..."


          & jf rt ping `
              --server-id=scout-fvp


          if ($LASTEXITCODE -ne 0) {

              throw "Scout JFrog connection failed."
          }


          Write-Host ""
          Write-Host "Scout JFrog connection successful." `
              -ForegroundColor Green


      # ============================================================
      # 4. Show exact mapping
      # ============================================================

      - name: Show promotion mapping
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION MAPPING"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "$env:SOURCE_REPO/$env:SOURCE_PATH"

          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"

          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 5. Verify Scout Clone source
      # ============================================================

      - name: Verify Scout Clone source
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern =
              "$env:SOURCE_REPO/$env:SOURCE_PATH/*"


          Write-Host ""
          Write-Host "Checking Scout Clone source:"
          Write-Host "$sourcePattern"

          Write-Host ""


          & jf rt search `
              "$sourcePattern" `
              --server-id=scout-fvp `
              --recursive=true `
              --limit=1 `
              --fail-no-op


          if ($LASTEXITCODE -ne 0) {

              throw "Scout Clone source does not exist or contains no artifacts: $env:SOURCE_PATH"
          }


          Write-Host ""
          Write-Host "Scout Clone source verified." `
              -ForegroundColor Green


      # ============================================================
      # 6. Create JFrog copy spec
      #
      # This captures EVERYTHING BELOW the selected source folder.
      #
      # Example:
      #
      # SOURCE:
      #
      # Scout Clone/
      # Official_Release/
      # CW11/
      # Release/
      # vw-group-commit-vault/
      # ...
      #
      #
      # TARGET:
      #
      # FVP/
      # CW11/
      # Release/
      # vw-group-commit-vault/
      # ...
      #
      #
      # IMPORTANT:
      #
      # This prevents:
      #
      # CW11/
      # Release/
      # Official_Release/
      # CW11/
      # Release/
      # ...
      # ============================================================

      - name: Create JFrog copy spec
        id: copy_spec
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'


          $specPath = Join-Path `
              $env:RUNNER_TEMP `
              "scout-to-fvp-copy-spec.json"


          # Capture everything BELOW the source root.

          $sourcePattern =
              "$env:SOURCE_REPO/$env:SOURCE_PATH/(*)"


          # Recreate captured hierarchy directly under target root.

          $targetPattern =
              "$env:TARGET_REPO/$env:TARGET_PATH/{1}"


          $fileEntry = [ordered]@{

              pattern = $sourcePattern

              target = $targetPattern

              recursive = "true"

              flat = "true"
          }


          $spec = [ordered]@{

              files = @(

                  $fileEntry
              )
          }


          $specJson =
              $spec |
              ConvertTo-Json -Depth 10


          Set-Content `
              -LiteralPath $specPath `
              -Value $specJson `
              -Encoding UTF8


          Write-Host ""
          Write-Host "============================================"
          Write-Host "JFROG COPY SPEC"
          Write-Host "============================================"


          Write-Host ""
          Write-Host "Source Pattern:"
           Write-Host "Target Pattern:"
          Write-Host "$targetPattern"


          Write-Host ""
          Write-Host "============================================"


          "spec_path=$specPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 7. Copy complete selected folder to FVP
      # ============================================================

      - name: Copy complete folder to FVP
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
          SPEC_PATH: ${{ steps.copy_spec.outputs.spec_path }}
        run: |
          $ErrorActionPreference = 'Stop'


          Write-Host ""
          Write-Host "============================================"
          Write-Host "COPYING SCOUT CLONE TO FVP"
          Write-Host "============================================"


          Write-Host ""
          Write-Host "Source:"
          Write-Host "$env:SOURCE_REPO/$env:SOURCE_PATH"


          Write-Host ""
          Write-Host "Target:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"


          Write-Host ""


          & jf rt cp `
              --spec="$env:SPEC_PATH" `
              --server-id=scout-fvp `
              --fail-no-op


          if ($LASTEXITCODE -ne 0) {

              throw "Scout Clone to FVP copy failed."
          }


          Write-Host ""
          Write-Host "Complete folder copied successfully." `
              -ForegroundColor Green


      # ============================================================
      # 8. Verify FVP
      # ============================================================

      - name: Verify FVP destination
        shell: pwsh
        env:
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'


          $targetPattern =
              "$env:TARGET_REPO/$env:TARGET_PATH/*"


          Write-Host ""
          Write-Host "Verifying FVP:"
          Write-Host "$targetPattern"

          Write-Host ""


          & jf rt search `
              "$targetPattern" `
              --server-id=scout-fvp `
              --recursive=true `
              --limit=1 `
              --fail-no-op


          if ($LASTEXITCODE -ne 0) {

              throw "FVP destination verification failed."
          }


          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION SUCCESSFUL"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "FVP Path:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"

          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 9. Cleanup
      #
      # Cleanup must never make an otherwise successful
      # promotion fail.
      # ============================================================

      - name: Cleanup JFrog configuration
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'


          Write-Host "Cleaning up JFrog configuration..."


          & jf c remove scout-fvp --quiet 2>$null

          $global:LASTEXITCODE = 0


          $specPath = Join-Path `
              $env:RUNNER_TEMP `
              "scout-to-fvp-copy-spec.json"


          if (Test-Path -LiteralPath $specPath) {

              Remove-Item `
                  -LiteralPath $specPath `
                  -Force `
                  -ErrorAction SilentlyContinue
          }


          Write-Host "Cleanup completed."

          exit 0
