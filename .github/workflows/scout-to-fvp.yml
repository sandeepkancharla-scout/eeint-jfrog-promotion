name: Scout Clone to FVP

on:
  repository_dispatch:
    types:
      - scout-to-fvp

jobs:
  promote-to-fvp:
    name: Promote Scout Clone to FVP
    runs-on: self-hosted

    env:
      SOURCE_REPO: rvtm-vw-rvt-scout-build-binaries-clone
      TARGET_REPO: eeint2-Scout-FVP-Release

    steps:

      # ============================================================
      # 1. Read folder path sent by Power Automate
      # ============================================================

      - name: Resolve folder path
        id: resolve
        shell: pwsh
        env:
          INPUT_FOLDER_PATH: ${{ github.event.client_payload.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $folderPath = "$env:INPUT_FOLDER_PATH".Trim()

          if ([string]::IsNullOrWhiteSpace($folderPath)) {
              throw "Power Automate did not provide client_payload.folder_path."
          }

          # Normalize slashes
          $folderPath = $folderPath.Replace('\', '/').Trim('/')

          # Power Automate may send a complete Artifactory URL.
          # If so, extract everything after the Scout Clone repository name.
          $repoMarker = "$env:SOURCE_REPO/"

          if ($folderPath.Contains($repoMarker)) {
              $folderPath = $folderPath.Substring(
                  $folderPath.IndexOf($repoMarker) + $repoMarker.Length
              )
          }

          $folderPath = $folderPath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($folderPath)) {
              throw "Unable to determine the Scout Clone folder path."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Scout Clone -> FVP"
          Write-Host "============================================"
          Write-Host "Power Automate input:"
          Write-Host "$env:INPUT_FOLDER_PATH"
          Write-Host ""
          Write-Host "Resolved relative path:"
          Write-Host "$folderPath"
          Write-Host "============================================"

          # --------------------------------------------------------
          # FVP accepts Official_Release only.
          # Daily_Builds must never reach FVP.
          # --------------------------------------------------------

          if ($folderPath -match '(^|/)Daily_Builds(/|$)') {
              throw "Daily builds are not allowed to be promoted to FVP."
          }

          if ($folderPath -notmatch '^Official_Release/') {
              throw "Only folders under Official_Release can be promoted to FVP. Received: $folderPath"
          }

          "folder_path=$folderPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 2. Setup JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ============================================================
      # 3. Verify JFrog connection
      # ============================================================

      - name: Verify JFrog connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Checking Scout JFrog connection..."

          jf rt ping

          Write-Host "Scout JFrog connection successful." `
              -ForegroundColor Green


      # ============================================================
      # 4. Display exact Clone -> FVP mapping
      # ============================================================

      - name: Show promotion mapping
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.resolve.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath = "$env:SOURCE_REPO/$env:FOLDER_PATH"
          $targetPath = "$env:TARGET_REPO/$env:FOLDER_PATH"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "$sourcePath"
          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "$targetPath"
          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 5. Verify the source has artifacts
      # ============================================================

      - name: Verify Scout Clone source
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.resolve.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_REPO/$env:FOLDER_PATH/*"

          Write-Host ""
          Write-Host "Checking Scout Clone source:"
          Write-Host "$sourcePattern"
          Write-Host ""

          jf rt search `
              "$sourcePattern" `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          Write-Host ""
          Write-Host "Source folder found." `
              -ForegroundColor Green


      # ============================================================
      # 6. Copy COMPLETE folder from Scout Clone to FVP
      #
      # The same relative path is used at the destination.
      #
      # Example:
      #
      # Clone:
      # Official_Release/CW11/Release/...
      #
      # FVP:
      # Official_Release/CW11/Release/...
      #
      # Hotfix:
      #
      # Clone:
      # Official_Release/CW11/Hotfixes/HF01/...
      #
      # FVP:
      # Official_Release/CW11/Hotfixes/HF01/...
      # ============================================================

      - name: Copy complete folder to FVP
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.resolve.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:SOURCE_REPO/$env:FOLDER_PATH/"
          $target = "$env:TARGET_REPO/$env:FOLDER_PATH/"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "COPYING COMPLETE FOLDER"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Source:"
          Write-Host "$source"
          Write-Host ""
          Write-Host "Destination:"
          Write-Host "$target"
          Write-Host ""

          jf rt cp `
              "$source*" `
              "$target" `
              --recursive=true `
              --flat=false `
              --fail-no-op

          Write-Host ""
          Write-Host "Folder copied successfully." `
              -ForegroundColor Green


      # ============================================================
      # 7. Verify FVP destination
      # ============================================================

      - name: Verify FVP destination
        shell: pwsh
        env:
          FOLDER_PATH: ${{ steps.resolve.outputs.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_REPO/$env:FOLDER_PATH/*"

          Write-Host ""
          Write-Host "Verifying FVP destination:"
          Write-Host "$targetPattern"
          Write-Host ""

          jf rt search `
              "$targetPattern" `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION SUCCESSFUL"
          Write-Host "============================================"
          Write-Host "Folder:"
          Write-Host "$env:FOLDER_PATH"
          Write-Host ""
          Write-Host "All folder contents were copied to FVP."
          Write-Host "============================================" `
              -ForegroundColor Green
