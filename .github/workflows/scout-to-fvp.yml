name: Scout Clone to FVP

on:
  repository_dispatch:
    types:
      - scout-to-fvp

jobs:
  promote-to-fvp:
    name: Promote Scout Clone to FVP
    runs-on: self-hosted

    env:
      SOURCE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      TARGET_REPO: ${{ secrets.SCOUT_FVP_REPO }}

    steps:

      # ============================================================
      # 1. Resolve paths from Power Automate
      #
      # Official:
      # Source:
      #   Official_Release/CW11/Release
      #
      # Target:
      #   CW11/Release
      #
      # Daily:
      # Source:
      #   Daily_Builds/2026-10-29/...
      #
      # Target:
      #   Daily_Builds/2026-10-29/...
      # ============================================================

      - name: Resolve promotion paths
        id: resolve
        shell: pwsh
        env:
          INPUT_FOLDER_PATH: ${{ github.event.client_payload.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath = "$env:INPUT_FOLDER_PATH".Trim()

          if ([string]::IsNullOrWhiteSpace($sourcePath)) {
              throw "Power Automate did not provide client_payload.folder_path."
          }

          # Normalize separators
          $sourcePath = $sourcePath.Replace('\', '/').Trim('/')

          # If Power Automate sends the complete Artifactory URL,
          # extract everything after the Scout Clone repository name.
          $repoMarker = "$env:SOURCE_REPO/"

          if ($sourcePath.Contains($repoMarker)) {

              $markerPosition = $sourcePath.IndexOf($repoMarker)

              $sourcePath = $sourcePath.Substring(
                  $markerPosition + $repoMarker.Length
              )
          }

          $sourcePath = $sourcePath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($sourcePath)) {
              throw "Unable to determine Scout Clone source path."
          }

          # ========================================================
          # Official Release / Hotfix
          #
          # Remove ONLY "Official_Release/" from destination.
          # ========================================================

          if ($sourcePath -match '^Official_Release/(.+)$') {

              $promotionType = "official"

              $targetPath = $Matches[1]

          }

          # ========================================================
          # Daily
          #
          # Preserve Daily_Builds hierarchy.
          # ========================================================

          elseif ($sourcePath -match '^Daily_Builds/(.+)$') {

              $promotionType = "daily"

              $targetPath = $sourcePath

          }

          else {

              throw "Unsupported FVP path '$sourcePath'. Expected Official_Release/... or Daily_Builds/..."

          }

          $targetPath = $targetPath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($targetPath)) {
              throw "Unable to determine FVP destination path."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SCOUT CLONE -> FVP"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Received:"
          Write-Host "$env:INPUT_FOLDER_PATH"
          Write-Host ""
          Write-Host "Promotion Type:"
          Write-Host "$promotionType"
          Write-Host ""
          Write-Host "Scout Clone relative path:"
          Write-Host "$sourcePath"
          Write-Host ""
          Write-Host "FVP relative path:"
          Write-Host "$targetPath"
          Write-Host ""
          Write-Host "============================================"

          "source_path=$sourcePath" >> $env:GITHUB_OUTPUT
          "target_path=$targetPath" >> $env:GITHUB_OUTPUT
          "promotion_type=$promotionType" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 2. Setup JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4


      # ============================================================
      # 3. Configure Scout JFrog
      # ============================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JFROG_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:JFROG_URL)) {
              throw "SCOUT_JFROG_URL secret is empty or unavailable."
          }

          if ([string]::IsNullOrWhiteSpace($env:JFROG_TOKEN)) {
              throw "SCOUT_JFROG_ACCESS_TOKEN secret is empty or unavailable."
          }

          Write-Host ""
          Write-Host "Configuring Scout JFrog..."

          jf c remove scout-fvp --quiet 2>$null
          $global:LASTEXITCODE = 0

          jf c add scout-fvp `
              --url="$env:JFROG_URL" `
              --access-token="$env:JFROG_TOKEN" `
              --interactive=false

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout JFrog."
          }

          Write-Host ""
          Write-Host "Testing Scout JFrog connection..."

          jf rt ping `
              --server-id=scout-fvp

          if ($LASTEXITCODE -ne 0) {
              throw "Scout JFrog connection failed."
          }

          Write-Host ""
          Write-Host "Scout JFrog connection successful." `
              -ForegroundColor Green


      # ============================================================
      # 4. Validate repository configuration
      # ============================================================

      - name: Validate repositories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO)) {
              throw "SCOUT_CLONE_REPO secret is empty or unavailable."
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_REPO)) {
              throw "SCOUT_FVP_REPO secret is empty or unavailable."
          }

          Write-Host ""
          Write-Host "Source repository:"
          Write-Host "$env:SOURCE_REPO"

          Write-Host ""
          Write-Host "FVP repository:"
          Write-Host "$env:TARGET_REPO"


      # ============================================================
      # 5. Display mapping
      # ============================================================

      - name: Show promotion mapping
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION MAPPING"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "$env:SOURCE_REPO/$env:SOURCE_PATH"

          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"

          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 6. Verify source folder
      # ============================================================

      - name: Verify Scout Clone source
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_REPO/$env:SOURCE_PATH/*"

          Write-Host ""
          Write-Host "Checking:"
          Write-Host "$sourcePattern"
          Write-Host ""

          jf rt search `
              "$sourcePattern" `
              --server-id=scout-fvp `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Clone source folder does not exist or contains no artifacts."
          }

          Write-Host ""
          Write-Host "Scout Clone source verified." `
              -ForegroundColor Green


      # ============================================================
      # 7. Copy complete folder
      #
      # OFFICIAL
      #
      # SOURCE:
      # rvtm-vw-rvt-scout-build-binaries-clone/
      # Official_Release/
      # CW11/
      # Release/
      #
      # TARGET:
      # eeint2-Scout-FVP-Release/
      # CW11/
      # Release/
      #
      #
      # HOTFIX
      #
      # SOURCE:
      # Official_Release/CW11/Hotfixes/HF01/...
      #
      # TARGET:
      # CW11/Hotfixes/HF01/...
      # ============================================================

      - name: Copy complete folder to FVP
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:SOURCE_REPO/$env:SOURCE_PATH/"
          $target = "$env:TARGET_REPO/$env:TARGET_PATH/"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "COPYING SCOUT CLONE -> FVP"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Source:"
          Write-Host "$source"

          Write-Host ""
          Write-Host "Target:"
          Write-Host "$target"

          Write-Host ""

          jf rt cp `
              "$source*" `
              "$target" `
              --server-id=scout-fvp `
              --recursive=true `
              --flat=false `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Clone -> FVP copy failed."
          }

          Write-Host ""
          Write-Host "Complete folder copied successfully." `
              -ForegroundColor Green


      # ============================================================
      # 8. Verify FVP destination
      # ============================================================

      - name: Verify FVP destination
        shell: pwsh
        env:
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_REPO/$env:TARGET_PATH/*"

          Write-Host ""
          Write-Host "Verifying FVP:"
          Write-Host "$targetPattern"
          Write-Host ""

          jf rt search `
              "$targetPattern" `
              --server-id=scout-fvp `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "FVP destination verification failed."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION SUCCESSFUL"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "FVP path:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"
          Write-Host ""
          =============

      - name: Cleanup JFrog configuration
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "Cleaning up JFrog configuration..."

          jf c remove scout-fvp --quiet

          $global:LASTEXITCODE = 0

          Write-Host "Cleanup completed."

          exit 0
