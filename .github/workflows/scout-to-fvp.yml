name: Scout Clone to FVP

on:
  workflow_dispatch:
    inputs:
      promotion_path:
        description: "Artifact path inside Scout Clone"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - daily
          - official

  repository_dispatch:
    types:
      - fvp-promotion-approved

permissions:
  contents: read

jobs:
  promote:
    name: Promote Approved Artifact to FVP

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 30

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

      PROMOTION_PATH: >-
        ${{ github.event.client_payload.promotion_path ||
            inputs.promotion_path }}

      BUILD_TYPE: >-
        ${{ github.event.client_payload.build_type ||
            inputs.build_type }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Validate promotion request
        shell: cmd
        run: |
          @echo off

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if "%FVP_REPO%"=="" (
            echo ERROR: SCOUT_FVP_REPO is missing.
            exit /b 1
          )

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if /I not "%BUILD_TYPE%"=="daily" (
            if /I not "%BUILD_TYPE%"=="official" (
              echo ERROR: build_type must be daily or official.
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="daily" (
            echo %PROMOTION_PATH% | findstr /B /I /C:"Daily_Builds/" >nul

            if errorlevel 1 (
              echo ERROR: Daily promotion path must start with Daily_Builds/
              echo Received:
              echo %PROMOTION_PATH%
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="official" (
            echo %PROMOTION_PATH% | findstr /B /I /C:"Official_Release/" >nul

            if errorlevel 1 (
              echo ERROR: Official promotion path must start with Official_Release/
              echo Received:
              echo %PROMOTION_PATH%
              exit /b 1
            )
          )

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Cannot connect to Scout JFrog.
            exit /b 1
          )

          echo Promotion request validated.
          echo Build Type: %BUILD_TYPE%
          echo Promotion Path: %PROMOTION_PATH%

      - name: Verify approved artifact exists in Scout Clone
        shell: cmd
        run: |
          @echo off

          echo Checking approved artifact:
          echo %CLONE_REPO%/%PROMOTION_PATH%

          jf rt search ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Approved artifact was not found in Scout Clone.
            exit /b 1
          )

          echo Approved artifact found.

      - name: Check whether destination already exists
        shell: cmd
        continue-on-error: true
        run: |
          @echo off

          echo Checking existing FVP path:
          echo %FVP_REPO%/%PROMOTION_PATH%

          jf rt search ^
            "%FVP_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo Destination does not currently exist.
            echo A new artifact will be created.
            exit /b 0
          )

          echo Existing artifact found.
          echo Existing artifact will be replaced at the same path.

      - name: Promote approved artifact to FVP
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo FVP PROMOTION
          echo ========================================

          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%

          echo Destination:
          echo %FVP_REPO%/%PROMOTION_PATH%

          jf rt copy ^
            "%CLONE_REPO%/%PROMOTION_PATH%" ^
            "%FVP_REPO%/%PROMOTION_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP promotion failed.
            exit /b 1
          )

          echo Artifact copied successfully.

      - name: Verify FVP destination
        shell: cmd
        run: |
          @echo off

          jf rt search ^
            "%FVP_REPO%/%PROMOTION_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP destination verification failed.
            exit /b 1
          )

          echo ========================================
          echo FVP PROMOTION SUCCESSFUL
          echo ========================================
          echo Final location:
          echo %FVP_REPO%/%PROMOTION_PATH%
