name: Scout Clone to FVP

on:
  workflow_dispatch:
    inputs:
      promotion_path:
        description: "Approved root folder path inside Scout Clone"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - daily
          - official

  repository_dispatch:
    types:
      - fvp-promotion-approved

permissions:
  contents: read

concurrency:
  group: >-
    scout-to-fvp-${{
      github.event.client_payload.promotion_path ||
      inputs.promotion_path ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Approved Root Folder to FVP

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 60

    env:
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      FVP_REPO: ${{ secrets.SCOUT_FVP_REPO }}

      PROMOTION_PATH: >-
        ${{ github.event.client_payload.promotion_path ||
            inputs.promotion_path }}

      BUILD_TYPE: >-
        ${{ github.event.client_payload.build_type ||
            inputs.build_type }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Validate promotion request
        shell: cmd
        run: |
          @echo off

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          if "%FVP_REPO%"=="" (
            echo ERROR: SCOUT_FVP_REPO is missing.
            exit /b 1
          )

          if "%PROMOTION_PATH%"=="" (
            echo ERROR: promotion_path is required.
            exit /b 1
          )

          if "%BUILD_TYPE%"=="" (
            echo ERROR: build_type is required.
            exit /b 1
          )

          if /I not "%BUILD_TYPE%"=="daily" (
            if /I not "%BUILD_TYPE%"=="official" (
              echo ERROR: build_type must be daily or official.
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="daily" (
            if /I not "%PROMOTION_PATH%"=="Daily_Builds" (
              echo ERROR: Daily root folder must be Daily_Builds.
              echo.
              echo Received:
              echo %PROMOTION_PATH%
              exit /b 1
            )
          )

          if /I "%BUILD_TYPE%"=="official" (
            echo %PROMOTION_PATH% | findstr /B /I /C:"Official_Release/" >nul

            if errorlevel 1 (
              echo ERROR: Official root folder must begin with Official_Release/
              echo.
              echo Received:
              echo %PROMOTION_PATH%
              exit /b 1
            )
          )

          echo ========================================
          echo PROMOTION REQUEST VALIDATED
          echo ========================================
          echo Build Type:
          echo %BUILD_TYPE%
          echo.
          echo Approved Root Folder:
          echo %PROMOTION_PATH%

      - name: Verify Scout JFrog connection
        shell: cmd
        run: |
          @echo off

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo Scout JFrog connection successful.

      - name: Verify approved root folder
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo VERIFY APPROVED ROOT FOLDER
          echo ========================================

          echo Searching:
          echo %CLONE_REPO%/%PROMOTION_PATH%/*

          jf rt search ^
            "%CLONE_REPO%/%PROMOTION_PATH%/*" ^
            --recursive=true ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: No artifacts were found in the approved root folder.
            echo.
            echo Folder:
            echo %CLONE_REPO%/%PROMOTION_PATH%/
            exit /b 1
          )

          echo Approved root folder contains artifacts.

      - name: Promote approved root folder to FVP
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo FVP ROOT FOLDER PROMOTION
          echo ========================================

          echo Source:
          echo %CLONE_REPO%/%PROMOTION_PATH%/

          echo Destination:
          echo %FVP_REPO%/%PROMOTION_PATH%/

          echo.
          echo Copying all artifacts under the approved root folder.
          echo Existing matching artifacts will use the same destination paths.
          echo.

          jf rt copy ^
            "%CLONE_REPO%/%PROMOTION_PATH%/(*)" ^
            "%FVP_REPO%/%PROMOTION_PATH%/{1}" ^
            --flat=true ^
            --recursive=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Root folder promotion to FVP failed.
            exit /b 1
          )

          echo Root folder copy completed.

      - name: Verify FVP root folder
        shell: cmd
        run: |
          @echo off

          echo ========================================
          echo VERIFY FVP DESTINATION
          echo ========================================

          jf rt search ^
            "%FVP_REPO%/%PROMOTION_PATH%/*" ^
            --recursive=true ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: FVP root folder verification failed.
            echo.
            echo Destination:
            echo %FVP_REPO%/%PROMOTION_PATH%/
            exit /b 1
          )

          echo.
          echo ========================================
          echo FVP PROMOTION SUCCESSFUL
          echo ========================================

          echo Build Type:
          echo %BUILD_TYPE%

          echo Approved Root Folder:
          echo %PROMOTION_PATH%

          echo Final FVP Location:
          echo %FVP_REPO%/%PROMOTION_PATH%/
