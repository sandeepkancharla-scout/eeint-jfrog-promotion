name: Scout Clone to FVP

on:
  repository_dispatch:
    types:
      - scout-to-fvp

jobs:
  promote-to-fvp:
    name: Promote Scout Clone to FVP
    runs-on: self-hosted

    env:
      SOURCE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}
      TARGET_REPO: ${{ secrets.SCOUT_FVP_REPO }}

    steps:

      # ============================================================
      # 1. Resolve source and target paths
      #
      # Official example:
      #
      # Source:
      # Official_Release/CW11/Release
      #
      # Target:
      # CW11/Release
      #
      # Final structure:
      # CW11/Release/vw-group-commit-vault/...
      #
      # Hotfix example:
      #
      # Source:
      # Official_Release/CW11/Hotfixes/HF01
      #
      # Target:
      # CW11/Hotfixes/HF01
      #
      # Daily example:
      #
      # Source:
      # Daily_Builds/2026-10-29/...
      #
      # Target:
      # Daily_Builds/2026-10-29/...
      # ============================================================

      - name: Resolve promotion paths
        id: resolve
        shell: pwsh
        env:
          INPUT_FOLDER_PATH: ${{ github.event.client_payload.folder_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath = "$env:INPUT_FOLDER_PATH".Trim()

          if ([string]::IsNullOrWhiteSpace($sourcePath)) {
              throw "Power Automate did not provide client_payload.folder_path."
          }

          # Normalize slashes.
          $sourcePath = $sourcePath.Replace('\', '/').Trim('/')

          # Power Automate may provide the complete Artifactory URL.
          # Strip everything through the Scout Clone repository name.
          $repoMarker = "$env:SOURCE_REPO/"

          if ($sourcePath.Contains($repoMarker)) {
              $markerPosition = $sourcePath.IndexOf(
                  $repoMarker,
                  [System.StringComparison]::OrdinalIgnoreCase
              )

              $sourcePath = $sourcePath.Substring(
                  $markerPosition + $repoMarker.Length
              )
          }

          $sourcePath = $sourcePath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($sourcePath)) {
              throw "Unable to determine the Scout Clone source path."
          }

          # Official Release and Hotfix:
          # Remove only the leading Official_Release directory.
          if ($sourcePath -match '(?i)^Official_Release/(.+)$') {
              $promotionType = "official"
              $targetPath = $Matches[1]
          }
          # Daily:
          # Preserve the Daily_Builds hierarchy.
          elseif ($sourcePath -match '(?i)^Daily_Builds/(.+)$') {
              $promotionType = "daily"
              $targetPath = $sourcePath
          }
          else {
              throw "Unsupported path '$sourcePath'. Expected Official_Release/... or Daily_Builds/..."
          }

          $targetPath = $targetPath.Trim('/')

          if ([string]::IsNullOrWhiteSpace($targetPath)) {
              throw "Unable to determine the FVP target path."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SCOUT CLONE TO FVP"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Promotion type:"
          Write-Host "$promotionType"
          Write-Host ""
          Write-Host "Source relative path:"
          Write-Host "$sourcePath"
          Write-Host ""
          Write-Host "Target relative path:"
          Write-Host "$targetPath"
          Write-Host ""
          Write-Host "============================================"

          "source_path=$sourcePath" >> $env:GITHUB_OUTPUT
          "target_path=$targetPath" >> $env:GITHUB_OUTPUT
          "promotion_type=$promotionType" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 2. Install JFrog CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4


      # ============================================================
      # 3. Configure Scout JFrog
      #
      # Existing repository secrets:
      #
      # SCOUT_JFROG_URL
      # SCOUT_JFROG_ACCESS_TOKEN
      # ============================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          JFROG_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JFROG_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:JFROG_URL)) {
              throw "SCOUT_JFROG_URL secret is empty or unavailable."
          }

          if ([string]::IsNullOrWhiteSpace($env:JFROG_TOKEN)) {
              throw "SCOUT_JFROG_ACCESS_TOKEN secret is empty or unavailable."
          }

          Write-Host ""
          Write-Host "Configuring Scout JFrog..."

          # Remove old runner configuration if present.
          & jf c remove scout-fvp --quiet 2>$null
          $global:LASTEXITCODE = 0

          & jf c add scout-fvp `
              --url="$env:JFROG_URL" `
              --access-token="$env:JFROG_TOKEN" `
              --interactive=false

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout JFrog."
          }

          Write-Host ""
          Write-Host "Testing Scout JFrog connection..."

          & jf rt ping --server-id=scout-fvp

          if ($LASTEXITCODE -ne 0) {
              throw "Scout JFrog connection failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "Scout JFrog connection successful." -ForegroundColor Green


      # ============================================================
      # 4. Validate repository secrets
      # ============================================================

      - name: Validate repositories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO)) {
              throw "SCOUT_CLONE_REPO secret is empty or unavailable."
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_REPO)) {
              throw "SCOUT_FVP_REPO secret is empty or unavailable."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "REPOSITORIES"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Scout Clone:"
          Write-Host "$env:SOURCE_REPO"
          Write-Host ""
          Write-Host "FVP:"
          Write-Host "$env:TARGET_REPO"
          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 5. Display exact source and target mapping
      # ============================================================

      - name: Show promotion mapping
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION MAPPING"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "$env:SOURCE_REPO/$env:SOURCE_PATH"
          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"
          Write-Host ""
          Write-Host "Expected first child folders:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH/vw-group-commit-vault/..."
          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 6. Verify the Scout Clone source
      # ============================================================

      - name: Verify Scout Clone source
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = "$env:SOURCE_REPO/$env:SOURCE_PATH/*"

          Write-Host ""
          Write-Host "Checking Scout Clone source:"
          Write-Host "$sourcePattern"
          Write-Host ""

          & jf rt search `
              "$sourcePattern" `
              --server-id=scout-fvp `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Clone source does not exist or contains no artifacts: $env:SOURCE_PATH"
          }

          Write-Host ""
          Write-Host "Scout Clone source verified."_REPO/Official_Release/CW11/Release/(.*)
      #
      # Target:
      # TARGET_REPO/CW11/Release/{1}
      #
      # Result:
      # CW11/Release/vw-group-commit-vault/...
      #
      # It will NOT create:
      # CW11/Release/Official_Release/CW11/Release/...
      # ============================================================

      - name: Create JFrog copy spec
        id: copy_spec
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $specPath = Join-Path `
              $env:RUNNER_TEMP `
              "scout-to-fvp-copy-spec.json"

          $spec = @{
              files = @(
                  @{
                      pattern = "$env:SOURCE_REPO/$env:SOURCE_PATH/(*)"
                      target = "$env:TARGET_REPO/$env:TARGET_PATH/{1}"
                      recursive = "true"
                      flat = "true"
                  }
              )
          }

          $specJson = $spec | ConvertTo-Json -Depth 10

          $specJson | Set-Content `
              -Path $specPath `
              -Encoding utf8

          Write-Host ""
          Write-Host "JFrog copy spec:"
          Write-Host "$specJson"
          Write-Host ""

          "spec_path=$specPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 8. Copy complete selected folder to FVP
      #
      # No local temporary download.
      #
      # Official:
      # Official_Release/CW11/Release/...
      # ->
      # CW11/Release/...
      #
      # Hotfix:
      # Official_Release/CW11/Hotfixes/HF01/...
      # ->
      # CW11/Hotfixes/HF01/...
      #
      # Daily:
      # Daily_Builds/2026-10-29/...
      # ->
      # Daily_Builds/2026-10-29/...
      # ============================================================

      - name: Copy complete folder to FVP
        shell: pwsh
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
          SPEC_PATH: ${{ steps.copy_spec.outputs.spec_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "============================================"
          Write-Host "COPYING SCOUT CLONE TO FVP"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Source:"
          Write-Host "$env:SOURCE_REPO/$env:SOURCE_PATH"
          Write-Host ""
          Write-Host "Target:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"
          Write-Host ""

          & jf rt cp `
              --spec="$env:SPEC_PATH" `
              --server-id=scout-fvp `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Clone to FVP copy failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "Complete folder copied successfully." -ForegroundColor Green


      # ============================================================
      # 9. Verify the correct FVP destination
      # ============================================================

      - name: Verify FVP destination
        shell: pwsh
        env:
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:TARGET_REPO/$env:TARGET_PATH/*"

          Write-Host ""
          Write-Host "Verifying FVP:"
          Write-Host "$targetPattern"
          Write-Host ""

          & jf rt search `
              "$targetPattern" `
              --server-id=scout-fvp `
              --recursive=true `
              --limit=1 `
              --fail-no-op

          if ($LASTEXITCODE -ne 0) {
              throw "FVP destination verification failed: $env:TARGET_PATH"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "FVP PROMOTION SUCCESSFUL"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "FVP path:"
          Write-Host "$env:TARGET_REPO/$env:TARGET_PATH"
          Write-Host ""
          Write-Host "The selected folder contents were copied"
          Write-Host "without duplicating the source parent path."
          Write-Host ""
          Write-Host "============================================"


      # ============================================================
      # 10. Cleanup
      #
      # Cleanup cannot fail the completed promotion.
      # ============================================================

      - name: Cleanup JFrog configuration
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "Cleaning up JFrog configuration..."

          & jf c remove scout-fvp --quiet 2>$null
          $global:LASTEXITCODE = 0

          $specPath = Join-Path `
              $env:RUNNER_TEMP `
              "scout-to-fvp-copy-spec.json"

          if (Test-Path -LiteralPath $specPath) {
              Remove-Item `
                  -LiteralPath $specPath `
                  -Force `
                  -ErrorAction SilentlyContinue
          }

          Write-Host "Cleanup completed."

          exit 0
