name: POC - Temp to Scout Clone

run-name: >-
  POC Temp to Clone |
  ${{ github.event.client_payload.build_type || inputs.build_type }} |
  ${{ github.event.client_payload.source_path || inputs.source_path }}

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Path inside the TEMP source repository"
        required: true
        type: string

      build_type:
        description: "Build classification"
        required: true
        type: choice
        options:
          - nightly
          - official

      calendar_week:
        description: "Required only for Official builds, for example CW43"
        required: false
        type: string

  repository_dispatch:
    types:
      - poc-temp-to-clone

permissions:
  contents: read

concurrency:
  group: >-
    poc-temp-to-clone-${{
      github.event.client_payload.source_path ||
      inputs.source_path ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  copy-to-clone:
    name: Copy TEMP artifact to Scout Clone
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      SOURCE_REPO: ${{ secrets.POC_SOURCE_REPO }}
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Verify required secrets
        shell: cmd
        run: |
          @echo off

          if "%SOURCE_REPO%"=="" (
            echo ERROR: POC_SOURCE_REPO is missing or empty.
            exit /b 1
          )

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing or empty.
            exit /b 1
          )

          if "${{ secrets.SCOUT_JFROG_URL }}"=="" (
            echo ERROR: SCOUT_JFROG_URL is missing or empty.
            exit /b 1
          )

          if "${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}"=="" (
            echo ERROR: SCOUT_JFROG_ACCESS_TOKEN is missing or empty.
            exit /b 1
          )

          echo Required repository and JFrog secrets are configured.

      - name: Verify JFrog connection
        shell: cmd
        run: |
          @echo off

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo JFrog connection successful.

      # =========================================================
      # REPOSITORY DISPATCH: NIGHTLY
      # =========================================================

      - name: Validate dispatched Nightly request
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required for Nightly.
            exit /b 1
          )

          echo %SOURCE_PATH% | findstr /C:".." >nul
          if not errorlevel 1 (
            echo ERROR: source_path cannot contain two consecutive dots.
            exit /b 1
          )

          echo Nightly request validated.
          echo Source path: %SOURCE_PATH%

      - name: Copy dispatched Nightly artifact
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
        run: |
          @echo off

          echo ========================================
          echo POC NIGHTLY BUILD
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%
          echo.
          echo Destination:
          echo %CLONE_REPO%/nightly/%SOURCE_PATH%
          echo.

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly source artifact was not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/nightly/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly artifact copy failed.
            exit /b 1
          )

          jf rt s "%CLONE_REPO%/nightly/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly destination verification failed.
            exit /b 1
          )

          echo.
          echo NIGHTLY COPY SUCCESSFUL
          echo No Calendar Week required.
          echo No approval required.
          echo No FVP promotion required.

      # =========================================================
      # REPOSITORY DISPATCH: OFFICIAL
      # =========================================================

      - name: Validate dispatched Official request
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required for Official.
            exit /b 1
          )

          if "%CALENDAR_WEEK%"=="" (
            echo ERROR: calendar_week is required for Official.
            exit /b 1
          )

          echo %SOURCE_PATH% | findstr /C:".." >nul
          if not errorlevel 1 (
            echo ERROR: source_path cannot contain two consecutive dots.
            exit /b 1
          )

          echo %CALENDAR_WEEK% | findstr /R /X /C:"CW[1-9]" /C:"CW[1-4][0-9]" /C:"CW5[0-3]" >nul
          if errorlevel 1 (
            echo ERROR: Calendar Week must be CW1 through CW53.
            echo Received: %CALENDAR_WEEK%
            exit /b 1
          )

          echo Official request validated.
          echo Source path: %SOURCE_PATH%
          echo Calendar Week: %CALENDAR_WEEK%

      - name: Copy dispatched Official artifact
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off

          echo ========================================
          echo POC OFFICIAL BUILD
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%
          echo.
          echo Destination:
          echo %CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%
          echo.

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official source artifact was not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official artifact copy failed.
            exit /b 1
          )

          jf rt s "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official destination verification failed.
            exit /b 1
          )

          echo.
          echo OFFICIAL COPY SUCCESSFUL

      - name: Send dispatched Official approval request
        if: >-
          success() &&
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'official'
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing or empty.
            exit /b 1
          )

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"poc_official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%CALENDAR_WEEK%\",\"promotion_path\":\"official/%CALENDAR_WEEK%/%SOURCE_PATH%\",\"requested_by\":\"%REQUESTED_BY%\",\"github_repository\":\"${{ github.repository }}\",\"github_run_id\":\"${{ github.run_id }}\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: Official approval webhook request failed.
            exit /b 1
          )

          echo.
          echo Official approval request submitted successfully.
          echo This workflow does not wait for approval.

      # =========================================================
      # MANUAL WORKFLOW DISPATCH: NIGHTLY
      # =========================================================

      - name: Validate manual Nightly request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          echo %SOURCE_PATH% | findstr /C:".." >nul
          if not errorlevel 1 (
            echo ERROR: source_path cannot contain two consecutive dots.
            exit /b 1
          )

          echo Manual Nightly request validated.

      - name: Copy manual Nightly artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          @echo off

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly source artifact was not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/nightly/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Manual Nightly copy failed.
            exit /b 1
          )

          jf rt s "%CLONE_REPO%/nightly/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly destination verification failed.
            exit /b 1
          )

          echo NIGHTLY COPY SUCCESSFUL
          echo No Calendar Week required.
          echo No approval required.

      # =========================================================
      # MANUAL WORKFLOW DISPATCH: OFFICIAL
      # =========================================================

      - name: Validate manual Official request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          if "%CALENDAR_WEEK%"=="" (
            echo ERROR: calendar_week is required for Official.
            exit /b 1
          )

          echo %SOURCE_PATH% | findstr /C:".." >nul
          if not errorlevel 1 (
            echo ERROR: source_path cannot contain two consecutive dots.
            exit /b 1
          )

          echo %CALENDAR_WEEK% | findstr /R /X /C:"CW[1-9]" /C:"CW[1-4][0-9]" /C:"CW5[0-3]" >nul
          if errorlevel 1 (
            echo ERROR: Calendar Week must be CW1 through CW53.
            exit /b 1
          )

          echo Manual Official request validated.

      - name: Copy manual Official artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official source artifact was not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Manual Official copy failed.
            exit /b 1
          )

          jf rt s "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official destination verification failed.
            exit /b 1
          )

          echo OFFICIAL COPY SUCCESSFUL

      - name: Send manual Official approval request
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'official'
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          SOURCE_PATH: ${{ inputs.source_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing or empty.
            exit /b 1
          )

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"poc_official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%CALENDAR_WEEK%\",\"promotion_path\":\"official/%CALENDAR_WEEK%/%SOURCE_PATH%\",\"requested_by\":\"${{ github.actor }}\",\"github_repository\":\"${{ github.repository }}\",\"github_run_id\":\"${{ github.run_id }}\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: Official approval webhook request failed.
            exit /b 1
          )

          echo Official approval request submitted successfully.
