name: POC - Temp to Scout Clone

run-name: >-
  POC Temp to Clone |
  ${{ github.event.client_payload.build_type || inputs.build_type }} |
  ${{ github.event.client_payload.source_path || inputs.source_path }}

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Path inside the TEMP source repository"
        required: true
        type: string

      build_type:
        description: "Build classification"
        required: true
        type: choice
        options:
          - nightly
          - official

      calendar_week:
        description: "Required only for Official builds"
        required: false
        type: string

  repository_dispatch:
    types:
      - poc-temp-to-clone

permissions:
  contents: read

concurrency:
  group: >-
    poc-temp-to-clone-${{
      github.event.client_payload.source_path ||
      inputs.source_path ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  copy-to-clone:
    name: Copy TEMP artifact to Scout Clone
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      SOURCE_REPO: ${{ secrets.POC_SOURCE_REPO }}
      CLONE_REPO: ${{ secrets.SCOUT_CLONE_REPO }}

    steps:
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.SCOUT_JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}

      - name: Verify required configuration
        shell: cmd
        run: |
          @echo off

          if "%SOURCE_REPO%"=="" (
            echo ERROR: POC_SOURCE_REPO is missing.
            exit /b 1
          )

          if "%CLONE_REPO%"=="" (
            echo ERROR: SCOUT_CLONE_REPO is missing.
            exit /b 1
          )

          echo Repository configuration is available.

      - name: Verify JFrog connection
        shell: cmd
        run: |
          @echo off

          jf rt ping

          if errorlevel 1 (
            echo ERROR: Unable to connect to Scout JFrog.
            exit /b 1
          )

          echo JFrog connection successful.

      # =====================================================
      # NIGHTLY - REPOSITORY DISPATCH
      # =====================================================

      - name: Validate dispatched Nightly request
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          echo Nightly request validated.
          echo Source Path: %SOURCE_PATH%

      - name: Copy dispatched Nightly artifact
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
        run: |
          @echo off

          echo ========================================
          echo NIGHTLY BUILD
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%
          echo.
          echo Destination:
          echo %CLONE_REPO%/nightly/%SOURCE_PATH%
          echo.

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" --count=1 --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Source artifact not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/nightly/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly copy failed.
            exit /b 1
          )

          jf rt s "%CLONE_REPO%/nightly/%SOURCE_PATH%" --count=1 --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly destination verification failed.
            exit /b 1
          )

          echo.
          echo NIGHTLY COPY SUCCESSFUL
          echo No Calendar Week required.
          echo No approval required.
          echo No FVP promotion required.

      # =====================================================
      # OFFICIAL - REPOSITORY DISPATCH
      # =====================================================

      - name: Validate dispatched Official request
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          if "%CALENDAR_WEEK%"=="" (
            echo ERROR: calendar_week is required for Official builds.
            exit /b 1
          )

          echo Official request validated.
          echo Source Path: %SOURCE_PATH%
          echo Calendar Week / Folder: %CALENDAR_WEEK%

      - name: Copy dispatched Official artifact
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
        run: |
          @echo off

          echo ========================================
          echo OFFICIAL BUILD
          echo ========================================
          echo Source:
          echo %SOURCE_REPO%/%SOURCE_PATH%
          echo.
          echo Destination:
          echo %CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%
          echo.

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" --count=1 --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Source artifact not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official copy failed.
            exit /b 1
          )

          jf rt s ^
            "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official destination verification failed.
            exit /b 1
          )

          echo.
          echo OFFICIAL COPY SUCCESSFUL

      - name: Send dispatched Official approval request
        if: >-
          success() &&
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.build_type == 'official'
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          SOURCE_PATH: ${{ github.event.client_payload.source_path }}
          CALENDAR_WEEK: ${{ github.event.client_payload.calendar_week }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing.
            exit /b 1
          )

          echo Sending Official approval request...

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"poc_official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%CALENDAR_WEEK%\",\"promotion_path\":\"official/%CALENDAR_WEEK%/%SOURCE_PATH%\",\"requested_by\":\"%REQUESTED_BY%\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: Approval webhook request failed.
            exit /b 1
          )

          echo.
          echo Official approval request submitted successfully.

      # =====================================================
      # MANUAL NIGHTLY TEST
      # =====================================================

      - name: Manual Nightly copy
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'nightly'
        shell: cmd
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" --count=1 --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Source artifact not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/nightly/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Nightly copy failed.
            exit /b 1
          )

          jf rt s "%CLONE_REPO%/nightly/%SOURCE_PATH%" --count=1 --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Destination verification failed.
            exit /b 1
          )

          echo NIGHTLY COPY SUCCESSFUL

      # =====================================================
      # MANUAL OFFICIAL TEST
      # =====================================================

      - name: Manual Official copy
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'official'
        shell: cmd
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off

          if "%SOURCE_PATH%"=="" (
            echo ERROR: source_path is required.
            exit /b 1
          )

          if "%CALENDAR_WEEK%"=="" (
            echo ERROR: calendar_week is required for Official.
            exit /b 1
          )

          jf rt s "%SOURCE_REPO%/%SOURCE_PATH%" --count=1 --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Source artifact not found.
            exit /b 1
          )

          jf rt cp ^
            "%SOURCE_REPO%/%SOURCE_PATH%" ^
            "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --flat=true ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Official copy failed.
            exit /b 1
          )

          jf rt s ^
            "%CLONE_REPO%/official/%CALENDAR_WEEK%/%SOURCE_PATH%" ^
            --count=1 ^
            --fail-no-op=true

          if errorlevel 1 (
            echo ERROR: Destination verification failed.
            exit /b 1
          )

          echo OFFICIAL COPY SUCCESSFUL

      - name: Send manual Official approval request
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.build_type == 'official'
        shell: cmd
        env:
          APPROVAL_URL: ${{ secrets.FVP_APPROVAL_WEBHOOK_URL }}
          SOURCE_PATH: ${{ inputs.source_path }}
          CALENDAR_WEEK: ${{ inputs.calendar_week }}
        run: |
          @echo off

          if "%APPROVAL_URL%"=="" (
            echo ERROR: FVP_APPROVAL_WEBHOOK_URL is missing.
            exit /b 1
          )

          curl.exe ^
            --fail-with-body ^
            --silent ^
            --show-error ^
            --request POST ^
            --header "Content-Type: application/json" ^
            --data "{\"request_type\":\"poc_official_fvp_approval\",\"source_repo\":\"%SOURCE_REPO%\",\"source_path\":\"%SOURCE_PATH%\",\"clone_repo\":\"%CLONE_REPO%\",\"build_type\":\"official\",\"calendar_week\":\"%CALENDAR_WEEK%\",\"promotion_path\":\"official/%CALENDAR_WEEK%/%SOURCE_PATH%\",\"requested_by\":\"${{ github.actor }}\"}" ^
            "%APPROVAL_URL%"

          if errorlevel 1 (
            echo ERROR: Approval webhook request failed.
            exit /b 1
          )

          echo Official approval request submitted successfully.
