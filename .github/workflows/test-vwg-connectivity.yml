name: Test Scout JFrog Connectivity

on:
  workflow_dispatch:

jobs:
  test-scout:
    name: Test Scout from GitHub Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Test Scout JFrog
        shell: bash
        env:
          SCOUT_URL: ${{ secrets.SCOUT_JFROG_URL }}
          SCOUT_TOKEN: ${{ secrets.SCOUT_JFROG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Testing Scout JFrog from ubuntu-latest"
          echo "======================================"

          if [ -z "$SCOUT_URL" ]; then
            echo "ERROR: SCOUT_JFROG_URL is empty"
            exit 1
          fi

          if [ -z "$SCOUT_TOKEN" ]; then
            echo "ERROR: SCOUT_JFROG_ACCESS_TOKEN is empty"
            exit 1
          fi

          echo "Configuring Scout JFrog..."

          jf c add scout \
            --url="$SCOUT_URL" \
            --access-token="$SCOUT_TOKEN" \
            --interactive=false

          echo
          echo "Testing Scout connection..."

          jf rt ping --server-id=scout

          echo
          echo "======================================"
          echo "Scout JFrog is reachable from ubuntu-latest"
          echo "======================================"
